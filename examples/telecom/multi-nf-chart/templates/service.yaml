apiVersion: v1
kind: Service
metadata:
  name: {{ .Release.Name }}-amf
spec:
  type: ClusterIP
  selector:
    app: {{ .Release.Name }}
    nf: amf
  ports:
    - name: sbi
      port: 8443
      protocol: TCP
---
apiVersion: v1
kind: ConfigMap
metadata:
  name: {{ .Release.Name }}-config
data:
  plmn: "00101"
