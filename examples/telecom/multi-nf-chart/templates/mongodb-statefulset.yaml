apiVersion: apps/v1
kind: StatefulSet
metadata:
  name: {{ .Release.Name }}-mongodb
spec:
  serviceName: {{ .Release.Name }}-mongodb
  replicas: 1
  selector:
    matchLabels:
      app: {{ .Release.Name }}
      nf: mongodb
  template:
    metadata:
      labels:
        app: {{ .Release.Name }}
        nf: mongodb
    spec:
      automountServiceAccountToken: false
      containers:
        - name: mongodb
          image: {{ .Values.mongodb.repository }}:{{ .Values.mongodb.tag }}
          securityContext:
            runAsNonRoot: true
            allowPrivilegeEscalation: false
            capabilities:
              drop: [ALL]
          resources:
            requests:
              cpu: 250m
              memory: 256Mi
            limits:
              cpu: 500m
              memory: 512Mi
