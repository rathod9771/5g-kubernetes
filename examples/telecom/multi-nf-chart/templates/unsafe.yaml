{{- if .Values.unsafe.includeSecret }}
apiVersion: v1
kind: Secret
metadata:
  name: {{ .Release.Name }}-bad-secret
type: Opaque
data:
  x: eA==
{{- end }}
{{- if .Values.unsafe.includeMultus }}
---
apiVersion: k8s.cni.cncf.io/v1
kind: NetworkAttachmentDefinition
metadata:
  name: {{ .Release.Name }}-n3
spec:
  config: '{"cniVersion":"0.3.1","type":"ipvlan"}'
{{- end }}
