name: Layer 3 Rel15-16 offline contract
on:
  pull_request:
    paths:
      - 'scripts/assurance/rel15_16.py'
      - 'tests/test_assurance_rel15_16.py'
      - 'docs/layer3/release-15-16-acceptance.md'
      - '.github/workflows/layer3-rel15-16.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  contract:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Syntax and bounded offline KPI contract tests
        run: |
          python -m py_compile scripts/assurance/rel15_16.py
          PYTHONDONTWRITEBYTECODE=1 python -m unittest discover -s tests -p 'test_assurance_rel15_16.py' -v
