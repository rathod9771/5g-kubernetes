name: Experimental D2B one-shot final-evidence qualified native build (no 5G runtime)
on:
  push:
    branches:
      - experiment/layer3-d2b-pinned-open5gs-graph-20261118
    paths:
      - .github/workflows/experimental-d2b-final-evidence-qualified-once-20261119.yml
permissions:
  contents: read
concurrency:
  group: d2b-final-evidence-once-${{ github.sha }}
  cancel-in-progress: false
jobs:
  one-shot-native-build-only:
    if: github.ref == 'refs/heads/experiment/layer3-d2b-pinned-open5gs-graph-20261118' && github.event_name == 'push'
    runs-on: ubuntu-22.04
    timeout-minutes: 100
    env:
      INPUT: ci/experimental/srsran-ngap-stage-d1
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          fetch-depth: 2
          persist-credentials: false
      - name: One-shot parent lock, checksum and scope preflight
        timeout-minutes: 2
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD^)" = 'e67d5065d6ad240d8f05e4ab02ba1010b4e6aca8'
          cd "$INPUT"
          sha256sum -c SHA256SUMS
          python3 - <<'PY'
          from pathlib import Path
          worker=Path('build_worker.py').read_text()
          finalizer=Path('finalize_build_evidence.py').read_text()
          supervisor=Path('build_supervisor.py').read_text()
          gate="admit_reviewed_open5gs_graph(graph,review,expanded_report)"
          compile_start="rec.phase('srsran_compilation'"
          assert worker.count(gate)==1 and worker.index(gate)<worker.index(compile_start)
          from test_sctp_link_regression import reviewed_driver_dependencies
          driver_libraries=reviewed_driver_dependencies(Path('CMakeLists.txt').read_text())
          assert driver_libraries.index('srsran_gateway')==driver_libraries.index('srsran_ngap')+1
          assert worker.count("preflight(paths,w,out/'binary-inspection-discovery.json',sidecars)")==1
          assert "shared_objects,sidecars=select_shared_libraries(ob)" in worker
          selector=Path("binary_inspection_preflight.py").read_text()
          assert "select_shared_libraries" in selector
          assert "ignored_meson_symbol_sidecars" in selector
          assert "UNREVIEWED_SHARED_LIBRARY_CANDIDATE" in selector
          assert "BINARY_INSPECTION_UNRECOGNIZED_FORMAT" in selector
          assert "inspection_outputs.append(out/'binary-inspection-failure.json')" in worker
          assert "binary-inspection-failure.json" in Path('workflow_evidence.py').read_text()
          assert "partial_inspection_manifest(" in Path('workflow_evidence.py').read_text()
          assert "audit_open5gs_graph(graph)" in worker
          assert "review_expanded_compdb(expanded,review)" in worker
          assert "raise Blocked('OPEN5GS_RSP_INDEPENDENT_REVIEW_REQUIRED')" not in worker
          assert "verify_native_terminal_guard(root,final,usage)" in finalizer
          assert "verify_guard_release_end(" in supervisor
          assert "receipts=select_native_phase_receipts(worker)" in supervisor
          assert "verify_retained_phase_outputs(receipts,mount,worker,sources)" in supervisor
          assert "PRE_COLLECTION_HELPER_RECEIPTS" in supervisor
          assert "COLLECTED_ACQUISITION_HELPER_RECEIPTS" in supervisor
          assert "select_native_phase_receipts(worker)" in supervisor
          assert "from toolchain_lock import ACQUISITION_DIAGNOSTICS" in supervisor
          assert "MISSING_TOOLCHAIN_HELPER_RECEIPT:" in supervisor
          artifact_admission=Path("workflow_evidence.py").read_text()
          assert "fullmatch('sha256:[a-f0-9]{64}'" in artifact_admission
          assert "os.environ.get('PRIOR_JOB_STATUS')!='success'" in artifact_admission
          assert "qualify_upload(sys.argv[5]" in artifact_admission
          finalizer=Path("finalize_build_evidence.py").read_text()
          assert "verify_native_terminal_guard(root,final,usage)" in finalizer
          assert "validate_toolchain_diagnostics(root)" in finalizer
          assert "inspection_manifest(root)" in finalizer
          assert "UNREVIEWED_PHASE_RECEIPT:" in supervisor
          assert "validate_quiescent_capture(" in supervisor
          for invariant in ('--unshare-net','--unshare-ipc','--unshare-pid',
                            '--property=MemorySwapMax=0','--property=CPUQuota=200%',
                            '--property=TasksMax=','--property=RuntimeMaxSec=4500s',
                            'KillMode=control-group'):
              assert invariant in supervisor,invariant
          assert "['ctest'" not in worker and "runtime_launcher" not in worker
          print('PINNED_BUILD_ONLY_FINAL_EVIDENCE_GATES_VERIFIED')
          PY
      - name: Provision pinned public toolchain on disposable hosted runner
        timeout-minutes: 5
        run: |
          sudo -n apt-get -o Acquire::Retries=0 update
          sudo -n apt-get -o Acquire::Retries=0 install -y --no-install-recommends build-essential cmake ninja-build meson pkg-config bison flex libsctp-dev libgnutls28-dev libgcrypt20-dev libssl-dev libidn11-dev libmongoc-dev libbson-dev libyaml-dev libnghttp2-dev libmicrohttpd-dev libcurl4-gnutls-dev libtalloc-dev libmbedtls-dev libyaml-cpp-dev libfftw3-dev libgtest-dev python3-venv binutils bubblewrap iproute2 e2fsprogs util-linux systemd
      - name: Exact Python harness environment
        timeout-minutes: 5
        run: |
          /usr/bin/python3 -c "import sys,platform; assert sys.version_info[:2] == (3,10) and platform.machine() == 'x86_64'"
          python3 -B "$INPUT/workflow_evidence.py" run wheel_acquisition
          python3 -B "$INPUT/workflow_evidence.py" run python_setup
      - name: Complete offline review regressions before native execution
        timeout-minutes: 5
        run: |
          set -euo pipefail
          cd "$INPUT"
          sha256sum -c SHA256SUMS
          "$RUNNER_TEMP/d1-python/bin/python3" -B -m unittest -v \
            test_harness.py test_build_harness.py test_publication.py \
            test_execution_proposals.py test_workflow_evidence.py \
            test_toolchain_bounded.py test_open5gs_graph_gate.py \
            test_open5gs_rsp_review.py test_open5gs_rsp_expansion.py \
            test_cgroup_accounting_review.py test_cgroup_terminal_guard.py \
            test_native_build_admission.py test_sctp_link_regression.py test_binary_inspection_preflight.py test_supervisor_receipt_census.py
      - name: Acquire exact pinned sources prior to isolated build
        timeout-minutes: 10
        run: |
          python3 -B "$INPUT/acquire_sources.py" --github-acquire-only
      - name: Isolated native build and bounded ELF discovery (no protocol runtime)
        timeout-minutes: 80
        run: |
          set -o pipefail
          sudo -n --preserve-env=GITHUB_ACTIONS,RUNNER_ENVIRONMENT,GITHUB_WORKSPACE,RUNNER_TEMP,ImageOS,ImageVersion \
            /usr/bin/unshare --mount --propagation private -- \
            /usr/bin/timeout -k 15s 77m /usr/bin/python3 -B "$INPUT/build-only.py" --github-build-only
      - name: Preserve bounded auxiliary diagnostics
        if: always()
        timeout-minutes: 2
        run: |
          python3 -B "$INPUT/workflow_evidence.py" collect
      - name: Require complete native phase, ELF and post-worker accounting evidence
        if: always()
        timeout-minutes: 2
        run: |
          python3 -B "$INPUT/finalize_build_evidence.py" stage-d1-build-results
      - name: Export allowlisted text diagnostics only (no binaries)
        if: always()
        timeout-minutes: 2
        run: |
          python3 -B "$INPUT/workflow_evidence.py" export
      - id: evidence_upload
        name: Upload bounded evidence for independent review
        if: always()
        timeout-minutes: 5
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: l3-d2b-final-evidence-qualified-${{ github.run_id }}
          path: stage-d1-reviewed-evidence/
          if-no-files-found: error
          retention-days: 14
      - name: Require verified upload before final qualification
        if: always()
        timeout-minutes: 1
        env:
          PRIOR_JOB_STATUS: ${{ job.status }}
          UPLOAD_OUTCOME: ${{ steps.evidence_upload.outcome }}
          ARTIFACT_ID: ${{ steps.evidence_upload.outputs.artifact-id }}
          ARTIFACT_DIGEST: ${{ steps.evidence_upload.outputs.artifact-digest }}
        run: |
          python3 -B "$INPUT/workflow_evidence.py" upload "$UPLOAD_OUTCOME" "$ARTIFACT_ID" "$ARTIFACT_DIGEST" stage-d1-reviewed-evidence
