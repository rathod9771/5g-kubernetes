name: Experimental OAI NGAP image package (no deployment)

# Builds a local OCI/Docker image on a disposable GitHub-hosted runner.
# No registry login, no image push, and no access to user's Kubernetes cluster.
on:
  push:
    branches:
      - experiment/oai-ngap-2026w13-actions
    paths:
      - .github/workflows/oai-ngap-2026w13-image.yml
      - experiments/oai-ngap-2026w13/Dockerfile.experimental
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: oai-ngap-image-${{ github.ref }}
  cancel-in-progress: true

jobs:
  package-image:
    name: Regression gate, compile, package and runtime-dependency smoke
    if: github.ref == 'refs/heads/experiment/oai-ngap-2026w13-actions'
    runs-on: ubuntu-24.04
    timeout-minutes: 100
    env:
      DEBIAN_FRONTEND: noninteractive
      GIT_TERMINAL_PROMPT: '0'
      CMAKE_BUILD_PARALLEL_LEVEL: '2'
      MAKEFLAGS: -j2
      OAI_SOURCE_DIR: /tmp/oai-ngap-src
      IMAGE_TAG: oai-ngap-2026w13-v2:ci-${{ github.run_number }}
    steps:
      - name: Check out experimental branch
        uses: actions/checkout@v4
        with:
          persist-credentials: false

      - name: Prepare hosted-runner evidence directory
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p "$RUNNER_TEMP/oai-ngap-image-evidence"
          {
            echo "Commit: $GITHUB_SHA"
            echo "Branch: $GITHUB_REF"
            echo "Base image: oaisoftwarealliance/oai-gnb:2026.w13"
            echo "No deployment or registry publishing"
            uname -a
            free -h
            df -h "$RUNNER_TEMP"
          } | tee "$RUNNER_TEMP/oai-ngap-image-evidence/preflight.txt"

      - name: Fetch OAI 2026.w13 and apply reviewed V2 patch
        shell: bash
        run: |
          set -euo pipefail
          git clone --depth 1 --single-branch --branch 2026.w13 \
            https://github.com/OPENAIRINTERFACE/openairinterface5g.git "$OAI_SOURCE_DIR"
          cd "$OAI_SOURCE_DIR"
          test "$(git describe --tags --exact-match)" = "2026.w13"
          git rev-parse HEAD | tee "$RUNNER_TEMP/oai-ngap-image-evidence/upstream-revision.txt"
          sha256sum "$GITHUB_WORKSPACE/experiments/oai-ngap-2026w13/ngap-retry-v2.patch" \
            | tee "$RUNNER_TEMP/oai-ngap-image-evidence/patch.sha256"
          git apply --check "$GITHUB_WORKSPACE/experiments/oai-ngap-2026w13/ngap-retry-v2.patch"
          git apply "$GITHUB_WORKSPACE/experiments/oai-ngap-2026w13/ngap-retry-v2.patch"
          git diff --check
          test "$(git diff --name-only)" = "openair3/NGAP/ngap_gNB.c"
          git diff --binary > "$RUNNER_TEMP/oai-ngap-image-evidence/applied-source.patch"

      - name: Required NGAP source-derived C regression gate
        shell: bash
        run: |
          set -euo pipefail
          python3 -m unittest -v tests/test_oai_ngap_2026w13_source_regression.py \
            2>&1 | tee "$RUNNER_TEMP/oai-ngap-image-evidence/regression.log"

      - name: Install upstream OAI build dependencies (runner only)
        shell: bash
        run: |
          set -euo pipefail
          cd "$OAI_SOURCE_DIR/cmake_targets"
          ./build_oai -I -w SIMU 2>&1 \
            | tee "$RUNNER_TEMP/oai-ngap-image-evidence/install.log"

      - name: Compile patched OAI gNB (Makefiles throughout, two jobs)
        shell: bash
        run: |
          set -euo pipefail
          cd "$OAI_SOURCE_DIR/cmake_targets"
          ./build_oai --gNB -w SIMU --build-tool-opt "-j2" 2>&1 \
            | tee "$RUNNER_TEMP/oai-ngap-image-evidence/build.log"
          test -x "$OAI_SOURCE_DIR/cmake_targets/ran_build/build/nr-softmodem"
          sha256sum "$OAI_SOURCE_DIR/cmake_targets/ran_build/build/nr-softmodem" \
            | tee "$RUNNER_TEMP/oai-ngap-image-evidence/nr-softmodem.sha256"

      - name: Build separate experimental image from pinned official runtime
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p "$RUNNER_TEMP/oai-ngap-image-context"
          cp "$OAI_SOURCE_DIR/cmake_targets/ran_build/build/nr-softmodem" \
            "$RUNNER_TEMP/oai-ngap-image-context/nr-softmodem"
          docker build \
            --file "$GITHUB_WORKSPACE/experiments/oai-ngap-2026w13/Dockerfile.experimental" \
            --tag "$IMAGE_TAG" "$RUNNER_TEMP/oai-ngap-image-context" \
            2>&1 | tee "$RUNNER_TEMP/oai-ngap-image-evidence/docker-build.log"
          docker image inspect "$IMAGE_TAG" \
            > "$RUNNER_TEMP/oai-ngap-image-evidence/image-inspect.json"
          docker image inspect --format '{{.Id}}' "$IMAGE_TAG" \
            | tee "$RUNNER_TEMP/oai-ngap-image-evidence/image-id.txt"

      - name: Check patched binary runtime shared libraries in image
        shell: bash
        run: |
          set -euo pipefail
          docker run --rm --network none --entrypoint /bin/sh "$IMAGE_TAG" -ec \
            'test -x /opt/oai-gnb/bin/nr-softmodem; ldd /opt/oai-gnb/bin/nr-softmodem' \
            | tee "$RUNNER_TEMP/oai-ngap-image-evidence/image-ldd.txt"
          if grep -E 'not found' "$RUNNER_TEMP/oai-ngap-image-evidence/image-ldd.txt"; then
            echo "FAILED: patched gNB requires unavailable shared libraries" >&2
            exit 1
          fi
          echo 'PASS: patched nr-softmodem loads all direct dynamic dependencies in experimental image'

      - name: Export experimental image (archive only; no registry)
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p "$RUNNER_TEMP/oai-ngap-export"
          docker save "$IMAGE_TAG" | gzip -1 \
            > "$RUNNER_TEMP/oai-ngap-export/oai-ngap-2026w13-v2-experimental.tar.gz"
          gzip -t "$RUNNER_TEMP/oai-ngap-export/oai-ngap-2026w13-v2-experimental.tar.gz"
          sha256sum "$RUNNER_TEMP/oai-ngap-export/oai-ngap-2026w13-v2-experimental.tar.gz" \
            | tee "$RUNNER_TEMP/oai-ngap-image-evidence/image-archive.sha256"
          du -h "$RUNNER_TEMP/oai-ngap-export/oai-ngap-2026w13-v2-experimental.tar.gz" \
            | tee "$RUNNER_TEMP/oai-ngap-image-evidence/image-archive-size.txt"

      - name: Upload build and smoke evidence even on failure
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: oai-ngap-image-evidence-${{ github.run_number }}
          path: ${{ runner.temp }}/oai-ngap-image-evidence/
          if-no-files-found: warn
          retention-days: 7
          compression-level: 2

      - name: Upload experimental image archive (only after all gates pass)
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: oai-ngap-2026w13-v2-image-${{ github.run_number }}
          path: ${{ runner.temp }}/oai-ngap-export/oai-ngap-2026w13-v2-experimental.tar.gz
          if-no-files-found: error
          retention-days: 7
          compression-level: 0
