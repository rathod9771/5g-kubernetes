name: H-CRAN Stage 5L UE SIGSEGV host GDB backtrace - NO DEPLOY

# Bounded isolated RFSIM attempt: full disposable Mongo/Open5GS 5GC,
# patched CU, two DUs and two synthetic OAI UEs. No HP access.
on:
  push:
    branches:
      - experiment/hcran-stage5l-ue-segv-backtrace-20261114
    paths:
      - .github/workflows/hcran-stage5l-ue-sigsegv.yml
      - experiments/oai-ngap-2026w13/stage5l/**
  workflow_dispatch:

permissions:
  contents: read
  actions: read

concurrency:
  group: hcran-stage5l-debug-${{ github.ref }}
  cancel-in-progress: true

jobs:
  two-ue-segv-backtrace:
    if: github.ref == 'refs/heads/experiment/hcran-stage5l-ue-segv-backtrace-20261114'
    runs-on: ubuntu-24.04
    timeout-minutes: 100
    env:
      CORE_IMG: gradiant/open5gs:2.7.6
      MONGO_IMG: mongo:6.0
      CU_IMG: oai-ngap-2026w13-v2:stage3-portable-4
      DU_IMG: oaisoftwarealliance/oai-gnb:2026.w45
      UE_IMG: hcran-stage5k-candidate:source-pinned-w45
    steps:
      - name: Checkout isolated qualification branch
        uses: actions/checkout@v4
        with:
          persist-credentials: false
          path: qualification

      - name: Checkout frozen Stage4P AMF recovery harness
        uses: actions/checkout@v4
        with:
          persist-credentials: false
          ref: 4080110a74bf6ba58804797c5b7216458e2f0a93
          path: baseline

      - name: Install Helm and YAML/MongoDB test dependencies
        uses: azure/setup-helm@v4
        with:
          version: v3.21.0
      - name: Prepare isolated Python dependencies and runner preflight
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p "$RUNNER_TEMP/hcran-stage5l-evidence" "$RUNNER_TEMP/hcran-stage5l-render"
          python3 -m venv "$RUNNER_TEMP/hcran-stage5l-venv"
          "$RUNNER_TEMP/hcran-stage5l-venv/bin/python" -m pip install \
            --disable-pip-version-check PyYAML==6.0.2 pymongo==4.10.1
          sudo apt-get update -qq
          sudo DEBIAN_FRONTEND=noninteractive apt-get install -y --no-install-recommends tcpdump gdb
          {
            uname -a
            free -h
            df -h /
            docker info | head -90
          } > "$RUNNER_TEMP/hcran-stage5l-evidence/runner-preflight.txt"
          if ! test -c /dev/net/tun; then
            sudo modprobe tun || true
          fi
          test -c /dev/net/tun || { echo 'TUN unavailable; PDU test cannot execute safely'; exit 1; }
          if ! test -d /proc/net/sctp; then
            sudo modprobe sctp || true
          fi
          test -d /proc/net/sctp || { echo 'Kernel SCTP missing'; exit 1; }

      - name: Render canonical H-CRAN CU and macro DU without deploying
        shell: bash
        run: |
          set -euo pipefail
          helm template hcran-oai-cu qualification/helm/cran-oai/cu \
            -f qualification/helm/cran-oai/cu/values-hcran.yaml \
            -f qualification/helm/cran-oai/cu/values-hcran-secure-staging.yaml \
            --set-string image.reference=oaisoftwarealliance/oai-gnb:2026.w13 \
            --set-string image.pullPolicy=IfNotPresent \
            > "$RUNNER_TEMP/hcran-stage5l-render/cu.yaml"
          helm template hcran-oai-macro qualification/helm/cran-oai/du \
            -f qualification/helm/cran-oai/du/values-hcran-macro.yaml \
            --set-string image.reference=oaisoftwarealliance/oai-gnb:2026.w25 \
            --set-string image.pullPolicy=IfNotPresent \
            > "$RUNNER_TEMP/hcran-stage5l-render/macro.yaml"
          helm template hcran-oai-small qualification/helm/cran-oai/du \
            -f qualification/helm/cran-oai/du/values-hcran-small.yaml \
            --set-string image.reference=oaisoftwarealliance/oai-gnb:2026.w25 \
            --set-string image.pullPolicy=IfNotPresent \
            > "$RUNNER_TEMP/hcran-stage5l-render/small.yaml"

      - name: Download verified patched CU from successful Stage 3
        uses: actions/download-artifact@v4
        with:
          repository: rathod9771/5g-kubernetes
          run-id: 43157479388
          name: oai-ngap-stage3-portable-4
          github-token: ${{ github.token }}
          path: ${{ runner.temp }}/stage5g-input

      - name: Reuse exact source-pinned Stage 5K candidate (no new UE patch)
        uses: actions/download-artifact@v4
        with:
          repository: rathod9771/5g-kubernetes
          run-id: 43569504071
          name: hcran-stage5k-source-pinned-UE-image-2
          github-token: ${{ github.token }}
          path: ${{ runner.temp }}/stage5l-archived-ue

      - name: Verify saved Stage 5K archive SHA-256 and load unchanged image
        shell: bash
        run: |
          set -euo pipefail
          archive="$RUNNER_TEMP/stage5l-archived-ue/hcran-stage5k-pdu-renewal-ue.tar.gz"
          test -s "$archive"
          echo "0ab2ab2d21693748530fdba15ae4deb43abfb74c49bffbd9cb145b3b401fb348  $archive" | sha256sum -c -
          gzip -t "$archive"
          docker load -i "$archive"
          docker image inspect "$UE_IMG" --format '{{.Id}}'
          printf '%s\\n' 'NO_GO: preserved Stage5K UE binary; Stage5L debugger attaches only during isolated AMF fault' \
            > "$RUNNER_TEMP/hcran-stage5l-evidence/stage5l-source-pin.txt"

      - name: Compile Stage 5L Python debugger wrapper (no source UE modifications)
        shell: bash
        run: |
          set -euo pipefail
          python3 -m py_compile qualification/experiments/oai-ngap-2026w13/stage5l/run_sigsegv_diagnostics.py
          python3 -m py_compile qualification/experiments/oai-ngap-2026w13/stage5i/run_bounded_recovery.py

      - name: Load patched CU and pull test-only core, DU, UE images
        shell: bash
        run: |
          set -euo pipefail
          archive="$RUNNER_TEMP/stage5g-input/oai-ngap-stage3-portable.tar.gz"
          gzip -t "$archive"
          sha256sum "$archive" > "$RUNNER_TEMP/hcran-stage5l-evidence/cu-image-archive.sha256"
          docker load -i "$archive" | tee "$RUNNER_TEMP/hcran-stage5l-evidence/cu-load.txt"
          for img in "$CORE_IMG" "$MONGO_IMG" "$DU_IMG"; do
            docker pull "$img" || exit 1
          done
          docker image inspect "$UE_IMG" --format '{{.Id}}' \
            > "$RUNNER_TEMP/hcran-stage5l-evidence/ue-test-candidate-id.txt"
          docker image inspect "$CU_IMG" > "$RUNNER_TEMP/hcran-stage5l-evidence/cu-image.json"
          docker image inspect "$CORE_IMG" > "$RUNNER_TEMP/hcran-stage5l-evidence/core-image.json"
          docker image inspect "$DU_IMG" > "$RUNNER_TEMP/hcran-stage5l-evidence/du-image.json"
          docker image inspect "$UE_IMG" > "$RUNNER_TEMP/hcran-stage5l-evidence/ue-image.json"
          docker run --rm --network none --entrypoint /bin/sh "$CORE_IMG" -ec \
            'for nf in nrfd scpd ausfd udmd udrd nssfd pcfd bsfd smfd upfd amfd; do command -v open5gs-$nf >/dev/null; done; test -d /opt/open5gs/etc/open5gs' \
            | tee "$RUNNER_TEMP/hcran-stage5l-evidence/core-binary-preflight.txt"
          docker run --rm --network none --entrypoint /bin/sh "$UE_IMG" -ec \
            'test -x /opt/oai-nr-ue/bin/nr-uesoftmodem; ldd /opt/oai-nr-ue/bin/nr-uesoftmodem' \
            > "$RUNNER_TEMP/hcran-stage5l-evidence/ue-ldd.txt"
          if grep -q 'not found' "$RUNNER_TEMP/hcran-stage5l-evidence/ue-ldd.txt"; then
            echo 'UE binary missing shared-library dependencies' >&2
            exit 1
          fi

      - name: Extract exact pinned UE ELF for source-level host debugger symbols
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p "$RUNNER_TEMP/stage5l-symbols"
          cid="$(docker create --entrypoint /bin/true "$UE_IMG")"
          docker cp "$cid:/opt/oai-nr-ue/bin/nr-uesoftmodem" \
            "$RUNNER_TEMP/stage5l-symbols/nr-uesoftmodem"
          docker rm "$cid"
          echo "803c3ac7a6e90c61cd94f83540343960340d6dea15b39bd0731eb36820d291b1  $RUNNER_TEMP/stage5l-symbols/nr-uesoftmodem" | sha256sum -c -
          readelf -S "$RUNNER_TEMP/stage5l-symbols/nr-uesoftmodem" | grep -F '.debug_info'
          readelf -S "$RUNNER_TEMP/stage5l-symbols/nr-uesoftmodem" | grep -F '.symtab'
          echo 'Pinned UE ELF source-level symbols available to host GDB; no binary uploaded'

      - name: Real AMF-only fault, both UEs re-register, re-IP and restore bidirectional GTP-U
        shell: bash
        run: |
          set -euo pipefail
          "$RUNNER_TEMP/hcran-stage5l-venv/bin/python" -u \
            qualification/experiments/oai-ngap-2026w13/stage5l/run_sigsegv_diagnostics.py \
            --baseline "$GITHUB_WORKSPACE/baseline/experiments/oai-ngap-2026w13" \
            --symbol-file "$RUNNER_TEMP/stage5l-symbols/nr-uesoftmodem" \
            --rendered "$RUNNER_TEMP/hcran-stage5l-render" \
            --output "$RUNNER_TEMP/hcran-stage5l-evidence" \
            --cu-image "$CU_IMG" --du-image "$DU_IMG" --ue-image "$UE_IMG" \
            --verify-gtpu \
            2>&1 | tee "$RUNNER_TEMP/hcran-stage5l-console.log"
          "$RUNNER_TEMP/hcran-stage5l-venv/bin/python" \
            qualification/experiments/oai-ngap-2026w13/stage5i/verify_bounded_recovery.py \
            "$RUNNER_TEMP/hcran-stage5l-evidence"
          "$RUNNER_TEMP/hcran-stage5l-venv/bin/python" \
            qualification/experiments/oai-ngap-2026w13/stage5k/verify_tun_renewal.py \
            "$RUNNER_TEMP/hcran-stage5l-evidence"
          echo 'PASS only with 2 unchanged UEs, fresh 5GC PDU IPv4 re-addressing, cause9, SUCI, and real bidirectional F1-U/NG-U.'

      - name: Purge private synthetic test material before artifact upload
        if: always()
        shell: bash
        run: |
          rm -rf "$RUNNER_TEMP/hcran-stage5l-evidence/PRIVATE-REMOVE-BEFORE-UPLOAD"
          test ! -e "$RUNNER_TEMP/hcran-stage5l-evidence/PRIVATE-REMOVE-BEFORE-UPLOAD"

      - name: Upload redacted stage evidence on success or failure
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: hcran-stage5l-gdb-real-service-recovery-${{ github.run_number }}
          path: ${{ runner.temp }}/hcran-stage5l-evidence/
          if-no-files-found: warn
          retention-days: 7
          compression-level: 2
