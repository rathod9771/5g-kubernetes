name: OSM Catalog Preflight (read-only)

# Catalog mutation is an operator-reviewed action, never a push side effect.
on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  preflight:
    runs-on: self-hosted
    steps:
      - uses: actions/checkout@v4
      - name: Validate prepared packages without catalog mutation
        env:
          OSM_PASSWORD: ${{ secrets.OSM_PASSWORD }}
        run: |
          python3 scripts/osm_onboard.py --ready --dry-run
