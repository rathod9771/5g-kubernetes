name: H-CRAN Stage 5K source-pinned PDU TUN re-IP after AMF restart - NO DEPLOY

# Bounded isolated RFSIM attempt: full disposable Mongo/Open5GS 5GC,
# patched CU, macro DU 100 and one test-only OAI NR UE. No HP access.
on:
  push:
    branches:
      - experiment/hcran-stage5k-pdu-tun-renewal-20261114
    paths:
      - .github/workflows/hcran-stage5k-pdu-tun-renewal.yml
      - experiments/oai-ngap-2026w13/stage5k/**
      - experiments/oai-ngap-2026w13/stage5i/run_bounded_recovery.py
      - scripts/hcran_build_pinned_w45_ue_t3517_tunrenewal.sh
  workflow_dispatch:

permissions:
  contents: read
  actions: read

concurrency:
  group: hcran-stage5k-tunrenewal-${{ github.ref }}
  cancel-in-progress: true

jobs:
  two-ue-pdu-tun-renewal:
    if: github.ref == 'refs/heads/experiment/hcran-stage5k-pdu-tun-renewal-20261114'
    runs-on: ubuntu-24.04
    timeout-minutes: 100
    env:
      CORE_IMG: gradiant/open5gs:2.7.6
      MONGO_IMG: mongo:6.0
      CU_IMG: oai-ngap-2026w13-v2:stage3-portable-4
      DU_IMG: oaisoftwarealliance/oai-gnb:2026.w45
      UE_IMG: oai-hcran-stage5k-w45-reip-${{ github.run_number }}
    steps:
      - name: Checkout isolated qualification branch
        uses: actions/checkout@v4
        with:
          persist-credentials: false
          path: qualification

      - name: Checkout frozen Stage4P AMF recovery harness
        uses: actions/checkout@v4
        with:
          persist-credentials: false
          ref: 4080110a74bf6ba58804797c5b7216458e2f0a93
          path: baseline

      - name: Install Helm and YAML/MongoDB test dependencies
        uses: azure/setup-helm@v4
        with:
          version: v3.21.0
      - name: Prepare isolated Python dependencies and runner preflight
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p "$RUNNER_TEMP/hcran-stage5k-evidence" "$RUNNER_TEMP/hcran-stage5k-render"
          python3 -m venv "$RUNNER_TEMP/hcran-stage5k-venv"
          "$RUNNER_TEMP/hcran-stage5k-venv/bin/python" -m pip install \
            --disable-pip-version-check PyYAML==6.0.2 pymongo==4.10.1
          sudo apt-get update -qq
          sudo DEBIAN_FRONTEND=noninteractive apt-get install -y --no-install-recommends tcpdump
          {
            uname -a
            free -h
            df -h /
            docker info | head -90
          } > "$RUNNER_TEMP/hcran-stage5k-evidence/runner-preflight.txt"
          if ! test -c /dev/net/tun; then
            sudo modprobe tun || true
          fi
          test -c /dev/net/tun || { echo 'TUN unavailable; PDU test cannot execute safely'; exit 1; }
          if ! test -d /proc/net/sctp; then
            sudo modprobe sctp || true
          fi
          test -d /proc/net/sctp || { echo 'Kernel SCTP missing'; exit 1; }

      - name: Render canonical H-CRAN CU and macro DU without deploying
        shell: bash
        run: |
          set -euo pipefail
          helm template hcran-oai-cu qualification/helm/cran-oai/cu \
            -f qualification/helm/cran-oai/cu/values-hcran.yaml \
            -f qualification/helm/cran-oai/cu/values-hcran-secure-staging.yaml \
            --set-string image.reference=oaisoftwarealliance/oai-gnb:2026.w13 \
            --set-string image.pullPolicy=IfNotPresent \
            > "$RUNNER_TEMP/hcran-stage5k-render/cu.yaml"
          helm template hcran-oai-macro qualification/helm/cran-oai/du \
            -f qualification/helm/cran-oai/du/values-hcran-macro.yaml \
            --set-string image.reference=oaisoftwarealliance/oai-gnb:2026.w25 \
            --set-string image.pullPolicy=IfNotPresent \
            > "$RUNNER_TEMP/hcran-stage5k-render/macro.yaml"
          helm template hcran-oai-small qualification/helm/cran-oai/du \
            -f qualification/helm/cran-oai/du/values-hcran-small.yaml \
            --set-string image.reference=oaisoftwarealliance/oai-gnb:2026.w25 \
            --set-string image.pullPolicy=IfNotPresent \
            > "$RUNNER_TEMP/hcran-stage5k-render/small.yaml"

      - name: Download verified patched CU from successful Stage 3
        uses: actions/download-artifact@v4
        with:
          repository: rathod9771/5g-kubernetes
          run-id: 43157479388
          name: oai-ngap-stage3-portable-4
          github-token: ${{ github.token }}
          path: ${{ runner.temp }}/stage5g-input

      - name: Audit source-pinned W45 UE patch and syntax only
        shell: bash
        run: |
          set -euo pipefail
          bash -n qualification/scripts/hcran_build_pinned_w45_ue_t3517_tunrenewal.sh
          python3 -m py_compile qualification/experiments/oai-ngap-2026w13/stage5g/patch_oai_ue_cause9.py
          python3 -m py_compile qualification/experiments/oai-ngap-2026w13/stage5i/verify_bounded_recovery.py
          python3 -m py_compile qualification/experiments/oai-ngap-2026w13/stage5i/patch_oai_ue_t3517.py
          python3 -m py_compile qualification/experiments/oai-ngap-2026w13/stage5i/run_bounded_recovery.py
          python3 -m py_compile qualification/experiments/oai-ngap-2026w13/stage5k/patch_ue_tun_renewal.py
          python3 -m py_compile qualification/experiments/oai-ngap-2026w13/stage5k/verify_tun_renewal.py
          echo 'PASS: pinned NAS/RRC and TUN source patch syntax; real recovery still unverified'

      - name: Compile test-only pinned UE with bounded NAS retry, cause9 and TUN re-IP
        shell: bash
        env:
          OAI_SOURCE: ${{ runner.temp }}/hcran-stage5k-w45-oai-source
          OUTPUT: ${{ runner.temp }}/hcran-stage5k-build-evidence
          IMAGE: oai-hcran-stage5k-w45-reip-${{ github.run_number }}
        run: |
          set -euo pipefail
          cd "$GITHUB_WORKSPACE/qualification"
          export GITHUB_WORKSPACE="$PWD"
          bash scripts/hcran_build_pinned_w45_ue_t3517_tunrenewal.sh

      - name: Archive bounded source-pinned UE candidate for subsequent RFsim acceptance
        shell: bash
        run: |
          set -euo pipefail
          test -n "$UE_IMG"
          docker image inspect "$UE_IMG" --format '{{.Id}}'
          docker tag "$UE_IMG" hcran-stage5k-candidate:source-pinned-w45
          mkdir -p "$RUNNER_TEMP/stage5g-candidate-archive"
          docker save hcran-stage5k-candidate:source-pinned-w45 | gzip -1 \
            > "$RUNNER_TEMP/stage5g-candidate-archive/hcran-stage5k-pdu-renewal-ue.tar.gz"
          gzip -t "$RUNNER_TEMP/stage5g-candidate-archive/hcran-stage5k-pdu-renewal-ue.tar.gz"
          sha256sum "$RUNNER_TEMP/stage5g-candidate-archive/hcran-stage5k-pdu-renewal-ue.tar.gz" \
            > "$RUNNER_TEMP/hcran-stage5k-build-evidence/reusable-image-archive.sha256"

      - name: Upload expiring RESEARCH UE image candidate (not production)
        uses: actions/upload-artifact@v4
        with:
          name: hcran-stage5k-source-pinned-UE-image-${{ github.run_number }}
          path: ${{ runner.temp }}/stage5g-candidate-archive/hcran-stage5k-pdu-renewal-ue.tar.gz
          if-no-files-found: error
          retention-days: 7
          compression-level: 0

      - name: Load patched CU and pull test-only core, DU, UE images
        shell: bash
        run: |
          set -euo pipefail
          archive="$RUNNER_TEMP/stage5g-input/oai-ngap-stage3-portable.tar.gz"
          gzip -t "$archive"
          sha256sum "$archive" > "$RUNNER_TEMP/hcran-stage5k-evidence/cu-image-archive.sha256"
          docker load -i "$archive" | tee "$RUNNER_TEMP/hcran-stage5k-evidence/cu-load.txt"
          for img in "$CORE_IMG" "$MONGO_IMG" "$DU_IMG"; do
            docker pull "$img" || exit 1
          done
          docker image inspect "$UE_IMG" --format '{{.Id}}' \
            > "$RUNNER_TEMP/hcran-stage5k-evidence/ue-test-candidate-id.txt"
          docker image inspect "$CU_IMG" > "$RUNNER_TEMP/hcran-stage5k-evidence/cu-image.json"
          docker image inspect "$CORE_IMG" > "$RUNNER_TEMP/hcran-stage5k-evidence/core-image.json"
          docker image inspect "$DU_IMG" > "$RUNNER_TEMP/hcran-stage5k-evidence/du-image.json"
          docker image inspect "$UE_IMG" > "$RUNNER_TEMP/hcran-stage5k-evidence/ue-image.json"
          docker run --rm --network none --entrypoint /bin/sh "$CORE_IMG" -ec \
            'for nf in nrfd scpd ausfd udmd udrd nssfd pcfd bsfd smfd upfd amfd; do command -v open5gs-$nf >/dev/null; done; test -d /opt/open5gs/etc/open5gs' \
            | tee "$RUNNER_TEMP/hcran-stage5k-evidence/core-binary-preflight.txt"
          docker run --rm --network none --entrypoint /bin/sh "$UE_IMG" -ec \
            'test -x /opt/oai-nr-ue/bin/nr-uesoftmodem; ldd /opt/oai-nr-ue/bin/nr-uesoftmodem' \
            > "$RUNNER_TEMP/hcran-stage5k-evidence/ue-ldd.txt"
          if grep -q 'not found' "$RUNNER_TEMP/hcran-stage5k-evidence/ue-ldd.txt"; then
            echo 'UE binary missing shared-library dependencies' >&2
            exit 1
          fi

      - name: Real AMF-only fault, both UEs re-register, re-IP and restore bidirectional GTP-U
        shell: bash
        run: |
          set -euo pipefail
          "$RUNNER_TEMP/hcran-stage5k-venv/bin/python" -u \
            qualification/experiments/oai-ngap-2026w13/stage5i/run_bounded_recovery.py \
            --baseline "$GITHUB_WORKSPACE/baseline/experiments/oai-ngap-2026w13" \
            --rendered "$RUNNER_TEMP/hcran-stage5k-render" \
            --output "$RUNNER_TEMP/hcran-stage5k-evidence" \
            --cu-image "$CU_IMG" --du-image "$DU_IMG" --ue-image "$UE_IMG" \
            --verify-gtpu \
            2>&1 | tee "$RUNNER_TEMP/hcran-stage5k-console.log"
          "$RUNNER_TEMP/hcran-stage5k-venv/bin/python" \
            qualification/experiments/oai-ngap-2026w13/stage5i/verify_bounded_recovery.py \
            "$RUNNER_TEMP/hcran-stage5k-evidence"
          "$RUNNER_TEMP/hcran-stage5k-venv/bin/python" \
            qualification/experiments/oai-ngap-2026w13/stage5k/verify_tun_renewal.py \
            "$RUNNER_TEMP/hcran-stage5k-evidence"
          echo 'PASS only with 2 unchanged UEs, fresh 5GC PDU IPv4 re-addressing, cause9, SUCI, and real bidirectional F1-U/NG-U.'

      - name: Purge private synthetic test material before artifact upload
        if: always()
        shell: bash
        run: |
          rm -rf "$RUNNER_TEMP/hcran-stage5k-evidence/PRIVATE-REMOVE-BEFORE-UPLOAD"
          test ! -e "$RUNNER_TEMP/hcran-stage5k-evidence/PRIVATE-REMOVE-BEFORE-UPLOAD"

      - name: Upload source patch and reproducible build proof
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: hcran-stage5k-source-build-proof-${{ github.run_number }}
          path: ${{ runner.temp }}/hcran-stage5k-build-evidence/
          if-no-files-found: warn
          retention-days: 7
          compression-level: 2

      - name: Upload redacted stage evidence on success or failure
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: hcran-stage5k-tun-renewal-real-service-recovery-${{ github.run_number }}
          path: ${{ runner.temp }}/hcran-stage5k-evidence/
          if-no-files-found: warn
          retention-days: 7
          compression-level: 2
