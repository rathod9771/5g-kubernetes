name: H-CRAN Stage 5H verified W45 cause9 UE-server F1 recovery - NO DEPLOY
on:
  push:
    branches:
      - experiment/hcran-production-qualification-20261113
    paths:
      - experiments/oai-ngap-2026w13/stage5h/RUN-ONCE.json
  workflow_dispatch:

permissions:
  contents: read
  actions: read

jobs:
  actual-ue-server-nas-cause9:
    if: github.ref == 'refs/heads/experiment/hcran-production-qualification-20261113'
    runs-on: ubuntu-24.04
    timeout-minutes: 40
    env:
      CORE_IMG: gradiant/open5gs:2.7.6
      MONGO_IMG: mongo:6.0
      DU_IMG: oaisoftwarealliance/oai-gnb:2026.w45
      CU_IMG: oai-hcran-f1-telnet-test-2
      UE_IMG: hcran-stage5g-candidate:source-pinned-w45
    steps:
      - name: Checkout isolated qualification branch
        uses: actions/checkout@v4
        with:
          persist-credentials: false
          path: qualification

      - name: Checkout immutable baseline Stage4Z and Open5GS bootstrap
        uses: actions/checkout@v4
        with:
          persist-credentials: false
          ref: 1fb544a39232a37c1af7250e0f3612c9ac0fc738
          path: baseline

      - name: Verify proven source build run is SUCCESS, not pending or cancelled
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          file=qualification/experiments/oai-ngap-2026w13/stage5h/RUN-ONCE.json
          test -f "$file" || { echo 'Opt-in candidate run marker missing'; exit 1; }
          id="$(python3 - "$file" <<'PY'
          import json,sys
          obj=json.load(open(sys.argv[1]))
          id=obj.get('source_run_id')
          assert isinstance(id,int) and id>43300000000
          print(id)
          PY
          )"
          status="$(gh api "repos/${{ github.repository }}/actions/runs/$id" --jq '.status')"
          conclusion="$(gh api "repos/${{ github.repository }}/actions/runs/$id" --jq '.conclusion')"
          number="$(gh api "repos/${{ github.repository }}/actions/runs/$id" --jq '.run_number')"
          workflow="$(gh api "repos/${{ github.repository }}/actions/runs/$id" --jq '.name')"
          test "$status" = completed && test "$conclusion" = success
          test "$workflow" = 'H-CRAN Stage 5G source-pinned UE cause9 initial registration recovery - NO DEPLOY'
          echo "SOURCE_RUN_ID=$id" >> "$GITHUB_ENV"
          echo "SOURCE_ARTIFACT=hcran-stage5g-source-pinned-UE-image-$number" >> "$GITHUB_ENV"
          echo 'NO_GO: source build success alone never authorizes production'

      - name: Install YAML, Mongo, tcpdump and SCTP/TUN simulator prerequisites
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p "$RUNNER_TEMP/stage5h-evidence" "$RUNNER_TEMP/stage5h-render"
          python3 -m venv "$RUNNER_TEMP/stage5h-venv"
          "$RUNNER_TEMP/stage5h-venv/bin/python" -m pip install --disable-pip-version-check PyYAML==6.0.2 pymongo==4.10.1
          sudo apt-get update -qq
          sudo DEBIAN_FRONTEND=noninteractive apt-get install -y --no-install-recommends tcpdump
          test -c /dev/net/tun || sudo modprobe tun
          test -d /proc/net/sctp || sudo modprobe sctp
          test -c /dev/net/tun && test -d /proc/net/sctp

      - name: Helm-render dual-DU UE-server mobility topology, without deploy
        uses: azure/setup-helm@v4
        with:
          version: v3.21.0

      - name: Validate isolated RIC-free CU and two DU values
        shell: bash
        run: |
          set -euo pipefail
          CHART="$GITHUB_WORKSPACE/qualification/helm/cran-oai"
          helm template hcran-oai-cu "$CHART/cu" \
            -f "$CHART/cu/values-hcran.yaml" \
            -f "$CHART/cu/values-hcran-secure-staging.yaml" \
            --set-string image.reference=oaisoftwarealliance/oai-gnb:2026.w13 \
            > "$RUNNER_TEMP/stage5h-render/cu.yaml"
          for role in macro small; do
            helm template "hcran-oai-$role" "$CHART/du" \
              -f "$CHART/du/values-hcran-$role.yaml" \
              -f "$CHART/du/values-hcran-mobility-$role.yaml" \
              --set-string mobilityRfsim.serverAddr=172.29.76.40 \
              --set-string image.reference=oaisoftwarealliance/oai-gnb:2026.w45 \
              > "$RUNNER_TEMP/stage5h-render/$role.yaml"
          done
          "$RUNNER_TEMP/stage5h-venv/bin/python" - <<'PY'
          import os,pathlib,re,yaml
          p=pathlib.Path(os.environ['RUNNER_TEMP'])/'stage5h-render'
          def conf(role):
              items=[x for x in yaml.safe_load_all((p/(role+'.yaml')).read_text()) if isinstance(x,dict)]
              return next(x for x in items if x.get('kind')=='ConfigMap')['data']['gnb.conf']
          cu,macro,small=[conf(z) for z in ('cu','macro','small')]
          assert not any(x in cu for x in ('e2_agent', 'near_ric_ip_addr'))
          assert re.search(r'ciphering_algorithms\s*=\s*\(\s*"nea2"\s*\)\s*;',cu)
          assert re.search(r'integrity_algorithms\s*=\s*\(\s*"nia2"\s*\)\s*;',cu)
          assert 'gNB_DU_ID = 100;' in macro and 'gNB_DU_ID = 101;' in small
          assert all(re.search(r'serveraddr\s*=\s*"172\.29\.76\.40"\s*;',v) for v in (macro,small))
          assert 'ssb_PositionsInBurst_Bitmap' in macro and 'ssb_PositionsInBurst_Bitmap' in small
          print('PASS configuration, 2 DU F1, distinct cell beams, NEA2/NIA2, no E2/RIC')
          PY

      - name: Download verified disposable patched F1 CU
        uses: actions/download-artifact@v4
        with:
          repository: rathod9771/5g-kubernetes
          run-id: 43388901151
          name: hcran-f1-telnet-candidate-2
          github-token: ${{ github.token }}
          path: ${{ runner.temp }}/stage5h-cu

      - name: Download source-pinned Stage 5G W45 synthetic UE
        uses: actions/download-artifact@v4
        with:
          repository: rathod9771/5g-kubernetes
          run-id: ${{ env.SOURCE_RUN_ID }}
          name: ${{ env.SOURCE_ARTIFACT }}
          github-token: ${{ github.token }}
          path: ${{ runner.temp }}/stage5h-ue

      - name: Load checked test CU and UE images, and pull W45 DUs
        shell: bash
        run: |
          set -euo pipefail
          test "$UE_IMG" = 'hcran-stage5g-candidate:source-pinned-w45'
          test "$CU_IMG" = 'oai-hcran-f1-telnet-test-2'
          cu="$RUNNER_TEMP/stage5h-cu/hcran-f1-patched-telnet.tar.gz"
          ue="$RUNNER_TEMP/stage5h-ue/hcran-stage5g-cause9-ue.tar.gz"
          gzip -t "$cu" && gzip -t "$ue"
          sha256sum "$cu" "$ue" > "$RUNNER_TEMP/stage5h-evidence/oci-archive-sha256.txt"
          docker load -i "$cu" > "$RUNNER_TEMP/stage5h-evidence/cu-load.txt"
          docker load -i "$ue" > "$RUNNER_TEMP/stage5h-evidence/ue-load.txt"
          docker image inspect "$CU_IMG" --format '{{.Id}}' > "$RUNNER_TEMP/stage5h-evidence/cu-image-id.txt"
          docker image inspect "$UE_IMG" --format '{{.Id}}' > "$RUNNER_TEMP/stage5h-evidence/ue-image-id.txt"
          docker run --rm --network none --entrypoint /bin/sh "$UE_IMG" -ec \
            'test -x /opt/oai-nr-ue/bin/nr-uesoftmodem && ! ldd /opt/oai-nr-ue/bin/nr-uesoftmodem | grep -q "not found"'
          for img in "$CORE_IMG" "$MONGO_IMG" "$DU_IMG"; do docker pull "$img"; done

      - name: Real AMF-only fault and one-UE cause9 recovery with no process restarts
        shell: bash
        run: |
          set -euo pipefail
          "$RUNNER_TEMP/stage5h-venv/bin/python" -u \
            qualification/experiments/oai-ngap-2026w13/stage5h/amf_cause9_f1_ue_server.py \
            --baseline "$GITHUB_WORKSPACE/baseline/experiments/oai-ngap-2026w13" \
            --rendered "$RUNNER_TEMP/stage5h-render" \
            --output "$RUNNER_TEMP/stage5h-evidence" \
            --cu-image "$CU_IMG" --du-image "$DU_IMG" --ue-image "$UE_IMG" \
            --verify-gtpu 2>&1 | tee "$RUNNER_TEMP/stage5h-console.txt"
          "$RUNNER_TEMP/stage5h-venv/bin/python" - <<'PY'
          import json,os,pathlib
          root=pathlib.Path(os.environ['RUNNER_TEMP'])/'stage5h-evidence'
          events=json.loads((root/'results.json').read_text())
          assert any(x.get('stage')=='STAGE4Z' and x.get('status')=='PASS' for x in events)
          assert any(x.get('stage')=='STAGE5H' and x.get('status')=='PASS' for x in events)
          x=json.loads((root/'stage5h-cause9-runtime.json').read_text())
          assert x['original_ue_process_unchanged'] is True
          assert x['manual_f1_handover_after_fault'] is False
          assert x['native_spontaneous_recovery_proven'] is False
          assert x['production_decision']=='NO_GO' and x['production_authorized'] is False
          assert all(x['actual_postfault_gtpu'][k]>0 for k in ('f1u_ul','f1u_dl','ngu_ul','ngu_dl'))
          assert len(x['post_fault_pcap_sha256'])==64
          print('PASS: real postfault cause9 initial reg/UE PDU with F1-U + NG-U; no production permission')
          PY

      - name: Purge private synthetic USIM files and raw UE diagnostic logs
        if: always()
        shell: bash
        run: |
          set -euo pipefail
          rm -rf "$RUNNER_TEMP/stage5h-evidence/PRIVATE-REMOVE-BEFORE-UPLOAD"
          find "$RUNNER_TEMP/stage5h-evidence" -maxdepth 1 -type f -name '*ue*.log' -delete
          test ! -e "$RUNNER_TEMP/stage5h-evidence/PRIVATE-REMOVE-BEFORE-UPLOAD"

      - name: Upload bounded non-secret real protocol evidence or failure summary
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: hcran-stage5h-real-cause9-attempt-${{ github.run_number }}
          path: ${{ runner.temp }}/stage5h-evidence/
          if-no-files-found: warn
          retention-days: 7
          compression-level: 2
