name: H-CRAN Stage 5Y live Open5GS AMF cell-ingress evidence gate - NO DEPLOY

# TWO independent Stage5Y diagnostics, each with THREE consecutive AMF
# faults against the SAME two unchanged UE processes. REBUILD test-only
# pinned Stage5T UE with unchanged pre-SIB1 MAC guard; rebuild pinned Stage3 NGAP CU.
# No historical artifact fetch; this rebuilds a source-equivalent CU, not bit-identical.
# Stage5Y-A: test-only race-safe /proc AMF count; frozen Stage4P baseline unchanged.
# Stage5ZB: additional radio/RRC log categories are read-only, no runtime changes.
# The real Stage5P, Stage5U and Stage5Y acceptance gates remain fail-closed.
# Stage5ZC: add category-only post-idle SIB1/BWP0 readiness observation.
# Preserve original Stage5P/5U/5Y live gates; NO DEPLOY.
# Stage5ZD: test-only, pinned UE source adds LOG_I at native MIB/SIB1 handoff.
# Core Stage5P/5U/5Y acceptance remains unchanged. NO DEPLOY.
# Stage5ZF: source-pinned, bounded RRC SIB1 cached-validity vs MAC BWP0 observation.
# Frozen UE recovery, Stage5P/5U/5Y gates and no-deploy restriction unchanged.
# Stage5ZG: two extra log-only RRC->MAC SIB message send/dispatch markers.
# No runtime protocol/retry changes; full Stage5P/5U/5Y gates retained.
# This never touches HP, Kubernetes, OSM, production keys or subscribers.
# Stage5ZH: no auto-run on push; expensive live RFsim is EXPLICITLY dispatched
# only when exact-commit full offline project validation has passed.
on:
  workflow_dispatch:
    inputs:
      offline_run_id:
        description: "Successful Offline Project Validation run ID for this exact branch and commit"
        required: true
        type: string
      confirm_isolated_no_deploy:
        description: "Enter ISOLATED_RFSIM_NO_DEPLOY"
        required: true
        type: string

permissions:
  contents: read
  actions: read

concurrency:
  group: hcran-stage5y-20261117-${{ github.ref }}
  cancel-in-progress: false

jobs:
  offline-gate:
    name: Require successful full offline validation for exactly this commit
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - name: Checkout the exact experimental commit
        uses: actions/checkout@v4
        with:
          persist-credentials: false
      - name: Verify offline run success, same SHA and same branch before expensive RFsim jobs
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          HCRAN_OFFLINE_RUN_ID: ${{ inputs.offline_run_id }}
          HCRAN_ISOLATED_CONFIRM: ${{ inputs.confirm_isolated_no_deploy }}
        run: |
          set -euo pipefail
          python3 -m py_compile scripts/experiments/hcran_stage5zh_verify_offline_run.py
          python3 scripts/experiments/hcran_stage5zh_verify_offline_run.py

  isolated-independent-trial:
    needs: offline-gate
    name: Stage5Y pinned 2UE 3-fault live AMF-cell ingress proof trial ${{ matrix.trial }}/2
    runs-on: ubuntu-24.04
    timeout-minutes: 95
    strategy:
      fail-fast: false
      max-parallel: 2
      matrix:
        trial: [1, 2]
    env:
      CORE_IMG: gradiant/open5gs:2.7.6
      MONGO_IMG: mongo:6.0
      CU_IMG: oai-ngap-2026w13-v2:stage3-portable-4
      DU_IMG: oaisoftwarealliance/oai-gnb:2026.w45
      UE_IMG: hcran-stage5zg-sib-handoff:run-${{ github.run_number }}
    steps:
      - name: Checkout Stage5P qualification source (current experimental commit)
        uses: actions/checkout@v4
        with:
          persist-credentials: false
          ref: ${{ github.sha }}
          path: qualification

      - name: Checkout frozen Stage4P AMF fault harness
        uses: actions/checkout@v4
        with:
          persist-credentials: false
          ref: 4080110a74bf6ba58804797c5b7216458e2f0a93
          path: baseline

      - name: Install isolated test dependencies and kernel prerequisites
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p "$RUNNER_TEMP/stage5p-evidence" "$RUNNER_TEMP/stage5p-render" "$RUNNER_TEMP/stage5p-inputs"
          python3 -m venv "$RUNNER_TEMP/stage5p-venv"
          "$RUNNER_TEMP/stage5p-venv/bin/python" -m pip install --disable-pip-version-check PyYAML==6.0.2 pymongo==4.10.1
          sudo apt-get update -qq
          sudo DEBIAN_FRONTEND=noninteractive apt-get install -y --no-install-recommends tcpdump
          test -c /dev/net/tun || sudo modprobe tun
          test -c /dev/net/tun
          test -d /proc/net/sctp || sudo modprobe sctp
          test -d /proc/net/sctp
          {
            echo "trial=${{ matrix.trial }}"
            echo "upstream_stage5m_run=43588828565"
            uname -a
            free -h
            df -h /
          } > "$RUNNER_TEMP/stage5p-evidence/runner-preflight.txt"

      - name: Install Helm for static H-CRAN manifests
        uses: azure/setup-helm@v4
        with:
          version: v3.21.0

      - name: Render two-DU H-CRAN source without deployment
        shell: bash
        run: |
          set -euo pipefail
          helm template hcran-oai-cu qualification/helm/cran-oai/cu \
            -f qualification/helm/cran-oai/cu/values-hcran.yaml \
            -f qualification/helm/cran-oai/cu/values-hcran-secure-staging.yaml \
            --set-string image.reference=oaisoftwarealliance/oai-gnb:2026.w13 \
            --set-string image.pullPolicy=IfNotPresent \
            > "$RUNNER_TEMP/stage5p-render/cu.yaml"
          helm template hcran-oai-macro qualification/helm/cran-oai/du \
            -f qualification/helm/cran-oai/du/values-hcran-macro.yaml \
            --set-string image.reference=oaisoftwarealliance/oai-gnb:2026.w25 \
            --set-string image.pullPolicy=IfNotPresent \
            > "$RUNNER_TEMP/stage5p-render/macro.yaml"
          helm template hcran-oai-small qualification/helm/cran-oai/du \
            -f qualification/helm/cran-oai/du/values-hcran-small.yaml \
            --set-string image.reference=oaisoftwarealliance/oai-gnb:2026.w25 \
            --set-string image.pullPolicy=IfNotPresent \
            > "$RUNNER_TEMP/stage5p-render/small.yaml"

      - name: Rebuild OAI W13 Stage3 NGAP patched CU from pinned upstream source
        shell: bash
        env:
          OAI_SOURCE: ${{ runner.temp }}/stage5q-pinned-stage3-cu-source
          OUTPUT: ${{ runner.temp }}/stage5q-cu-build-proof
        run: |
          set -euo pipefail
          bash -n qualification/scripts/hcran_build_pinned_stage3_ngap_cu.sh
          cd "$GITHUB_WORKSPACE/qualification"
          export GITHUB_WORKSPACE="$PWD"
          export IMAGE="$CU_IMG"
          bash scripts/hcran_build_pinned_stage3_ngap_cu.sh

      - name: Verify exact pinned source-builder syntax
        shell: bash
        run: |
          set -euo pipefail
          bash -n qualification/scripts/hcran_build_pinned_w45_ue_stage5t.sh
          bash -n qualification/scripts/experiments/hcran_build_pinned_w45_ue_stage5zd.sh
          bash -n qualification/scripts/experiments/hcran_build_pinned_w45_ue_stage5zg.sh
          python3 -m py_compile qualification/experiments/oai-ngap-2026w13/stage5q/patch_mac_bwp0_liveness.py
          python3 -m py_compile qualification/experiments/oai-ngap-2026w13/stage5t/patch_pre_sib1_ra_ordering.py
          python3 -m py_compile qualification/experiments/oai-ngap-2026w13/stage5zd/patch_mib_sib1_handoff_observe.py
          python3 -m py_compile qualification/experiments/oai-ngap-2026w13/stage5s/mib_sib1_handoff_stage5zd.py
          python3 -m py_compile qualification/experiments/oai-ngap-2026w13/stage5zd/analyze_mib_sib1_handoff.py
          python3 -m py_compile qualification/experiments/oai-ngap-2026w13/stage5zf/patch_rrc_si_decision_observe.py
          python3 -m py_compile qualification/experiments/oai-ngap-2026w13/stage5s/rrc_si_decision_stage5zf.py
          python3 -m py_compile qualification/experiments/oai-ngap-2026w13/stage5zf/analyze_rrc_si_cache.py
          python3 -m py_compile qualification/experiments/oai-ngap-2026w13/stage5zg/patch_rrc_mac_si_handoff_observe.py
          python3 -m py_compile qualification/experiments/oai-ngap-2026w13/stage5s/rrc_mac_handoff_stage5zg.py
          python3 -m py_compile qualification/experiments/oai-ngap-2026w13/stage5zg/analyze_rrc_mac_sib_handoff.py

      - name: Rebuild pinned OAI W45 Stage5T research UE plus Stage5ZD log-only MIB/SIB1 handoff probe
        shell: bash
        env:
          OAI_SOURCE: ${{ runner.temp }}/stage5zg-pinned-source
          OUTPUT: ${{ runner.temp }}/stage5zg-build-proof
          IMAGE: hcran-stage5zg-sib-handoff:run-${{ github.run_number }}
        run: |
          set -euo pipefail
          cd "$GITHUB_WORKSPACE/qualification"
          export GITHUB_WORKSPACE="$PWD"
          bash scripts/experiments/hcran_build_pinned_w45_ue_stage5zg.sh
          grep -q 'Stage5ZG' "$OUTPUT/test-only-UE-stage5zg-rrc-mac-sib-handoff.patch"
          docker image inspect "$IMAGE" --format '{{.Id}}'

      - name: Verify source-rebuilt CU and isolated core/DU container images
        shell: bash
        run: |
          set -euo pipefail
          docker image inspect "$CU_IMG" --format '{{.Id}}' \
            > "$RUNNER_TEMP/stage5p-evidence/source-rebuilt-cu-id.txt"
          docker image inspect "$UE_IMG" --format '{{.Id}}' \
            > "$RUNNER_TEMP/stage5p-evidence/stage5t-candidate-id.txt"
          for image in "$CORE_IMG" "$MONGO_IMG" "$DU_IMG"; do docker pull "$image"; done

      - name: Audit fail-closed multicycle harness syntax
        shell: bash
        run: |
          set -euo pipefail
          python3 -m py_compile qualification/experiments/oai-ngap-2026w13/stage5s/run_bounded_recovery_stage5s.py
          python3 -m py_compile qualification/experiments/oai-ngap-2026w13/stage5s/verify_bounded_recovery_stage5s.py
          python3 -m py_compile qualification/experiments/oai-ngap-2026w13/stage5s/run_three_cycle_recovery.py
          python3 -m py_compile qualification/experiments/oai-ngap-2026w13/stage5s/run_protocol_trace.py
          python3 -m py_compile qualification/experiments/oai-ngap-2026w13/stage5s/amf_process_count_stage5y.py
          python3 -m py_compile qualification/experiments/oai-ngap-2026w13/stage5s/cu_amf_selection_stage5z.py
          python3 -m py_compile qualification/experiments/oai-ngap-2026w13/stage5s/rrc_radio_boundary_stage5zb.py
          python3 -m py_compile qualification/experiments/oai-ngap-2026w13/stage5zb/analyze_rrc_radio_boundary.py
          python3 -m py_compile qualification/experiments/oai-ngap-2026w13/stage5s/sib1_reacquisition_stage5zc.py
          python3 -m py_compile qualification/experiments/oai-ngap-2026w13/stage5zc/analyze_sib1_reacquisition.py
          python3 -m py_compile qualification/experiments/oai-ngap-2026w13/stage5z/analyze_amf_selection_stage5z.py
          python3 -m py_compile qualification/experiments/oai-ngap-2026w13/stage5s/verify_three_cycle_recovery.py
          python3 -m py_compile qualification/experiments/oai-ngap-2026w13/stage5u/audit_repeatability.py
          python3 -m py_compile qualification/experiments/oai-ngap-2026w13/stage5w/analyze_protocol_gap.py
          python3 -m py_compile qualification/experiments/oai-ngap-2026w13/stage5x/analyze_f1c_amf_ingress.py
          python3 -m py_compile qualification/experiments/oai-ngap-2026w13/stage5s/amf_ingress_stream_stage5y.py
          python3 -m py_compile qualification/experiments/oai-ngap-2026w13/stage5y/verify_live_amf_ingress.py
          python3 -m py_compile qualification/experiments/oai-ngap-2026w13/stage5s/verify_bounded_recovery_stage5s.py
          python3 -m py_compile qualification/experiments/oai-ngap-2026w13/stage5k/verify_tun_renewal.py

      - name: Live Stage5R protocol timeline plus genuine three-cycle Stage5P acceptance
        shell: bash
        run: |
          set -euo pipefail
          "$RUNNER_TEMP/stage5p-venv/bin/python" -u \
            qualification/experiments/oai-ngap-2026w13/stage5s/run_protocol_trace.py \
            --baseline "$GITHUB_WORKSPACE/baseline/experiments/oai-ngap-2026w13" \
            --rendered "$RUNNER_TEMP/stage5p-render" \
            --output "$RUNNER_TEMP/stage5p-evidence" \
            --cu-image "$CU_IMG" --du-image "$DU_IMG" --ue-image "$UE_IMG" \
            --cycles 3 --verify-gtpu \
            2>&1 | tee "$RUNNER_TEMP/stage5p-console.log"
          "$RUNNER_TEMP/stage5p-venv/bin/python" \
            qualification/experiments/oai-ngap-2026w13/stage5s/verify_three_cycle_recovery.py \
            "$RUNNER_TEMP/stage5p-evidence"

      - name: Stage5U verify full RFsim protocol trace and 9 negative evidence controls
        shell: bash
        run: |
          set -euo pipefail
          "$RUNNER_TEMP/stage5p-venv/bin/python" \
            qualification/experiments/oai-ngap-2026w13/stage5u/audit_repeatability.py \
            "$RUNNER_TEMP/stage5p-evidence"

      - name: Stage5W archive privacy-safe post-NGSetup NAS and CU gap matrix even on real recovery failure
        if: always()
        shell: bash
        run: |
          set -euo pipefail
          python3 qualification/experiments/oai-ngap-2026w13/stage5w/analyze_protocol_gap.py \
            "$RUNNER_TEMP/stage5p-evidence"

      - name: Stage5X emit redacted CU F1-C and Open5GS AMF cell-ingress correlation even if recovery FAILS
        if: always()
        shell: bash
        run: |
          set -euo pipefail
          python3 qualification/experiments/oai-ngap-2026w13/stage5x/analyze_f1c_amf_ingress.py \
            "$RUNNER_TEMP/stage5p-evidence"

      - name: Stage5Z archive bounded CU AMF-selection boundary diagnostics, even on recovery failure
        if: always()
        shell: bash
        run: |
          set -euo pipefail
          python3 qualification/experiments/oai-ngap-2026w13/stage5z/analyze_amf_selection_stage5z.py \
            "$RUNNER_TEMP/stage5p-evidence"

      - name: Stage5ZB diagnose UE and DU RA/RRC-to-CU boundary, even on real recovery failure
        if: always()
        shell: bash
        run: |
          set -euo pipefail
          python3 qualification/experiments/oai-ngap-2026w13/stage5zb/analyze_rrc_radio_boundary.py \
            "$RUNNER_TEMP/stage5p-evidence"

      - name: Stage5ZC diagnose post-idle SIB1/BWP0 readiness and RA deferral on genuine failure
        if: always()
        shell: bash
        run: |
          set -euo pipefail
          python3 qualification/experiments/oai-ngap-2026w13/stage5zc/analyze_sib1_reacquisition.py \
            "$RUNNER_TEMP/stage5p-evidence"

      - name: Stage5ZD audit source-pinned MIB/SIB1/BWP0 handoff even on genuine recovery failure
        if: always()
        shell: bash
        run: |
          set -euo pipefail
          python3 qualification/experiments/oai-ngap-2026w13/stage5zd/analyze_mib_sib1_handoff.py \
            "$RUNNER_TEMP/stage5p-evidence"

      - name: Stage5ZF audit RRC SI cached validity versus missing MAC BWP0 even on genuine recovery failure
        if: always()
        shell: bash
        run: |
          set -euo pipefail
          python3 qualification/experiments/oai-ngap-2026w13/stage5zf/analyze_rrc_si_cache.py \
            "$RUNNER_TEMP/stage5p-evidence"

      - name: Stage5ZG diagnostic-only RRC SIB request send-to-MAC dispatch boundary
        if: always()
        shell: bash
        run: |
          set -euo pipefail
          python3 qualification/experiments/oai-ngap-2026w13/stage5zg/analyze_rrc_mac_sib_handoff.py \
            "$RUNNER_TEMP/stage5p-evidence"

      - name: Stage5Y independently require both live AMF cell ingress categories per genuine recovery cycle
        # A genuine Stage5P recovery failure must not be replaced by an
        # observation report. Stage5X always() runs first, then this
        # separate coverage gate checks all 3 real cycles.
        if: success()
        shell: bash
        run: |
          set -euo pipefail
          "$RUNNER_TEMP/stage5p-venv/bin/python" \
            qualification/experiments/oai-ngap-2026w13/stage5y/verify_live_amf_ingress.py \
            "$RUNNER_TEMP/stage5p-evidence"

      - name: Remove private test material before artifact upload
        if: always()
        shell: bash
        run: |
          rm -rf "$RUNNER_TEMP/stage5p-evidence/PRIVATE-REMOVE-BEFORE-UPLOAD"
          test ! -e "$RUNNER_TEMP/stage5p-evidence/PRIVATE-REMOVE-BEFORE-UPLOAD"

      - name: Archive reproducible Stage3 NGAP CU source-build proof
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: hcran-stage5y-stage3-cu-build-proof-${{ github.run_number }}-${{ matrix.trial }}
          path: ${{ runner.temp }}/stage5q-cu-build-proof/
          if-no-files-found: warn
          retention-days: 7
          compression-level: 2

      - name: Preserve pinned research source build proof, including full Stage5T patch
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: hcran-stage5zd-stage5t-ue-source-proof-${{ github.run_number }}-${{ matrix.trial }}
          path: ${{ runner.temp }}/stage5zg-build-proof/
          if-no-files-found: warn
          retention-days: 7
          compression-level: 2

      - name: Preserve redacted evidence whether pass or fail
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: hcran-stage5y-repeatability-trial-${{ matrix.trial }}
          path: ${{ runner.temp }}/stage5p-evidence/
          if-no-files-found: warn
          retention-days: 7
          compression-level: 2
