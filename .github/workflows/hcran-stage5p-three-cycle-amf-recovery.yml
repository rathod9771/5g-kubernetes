name: H-CRAN Stage 5P three consecutive AMF recoveries in one two-UE session - NO DEPLOY

# Two independent GitHub-hosted sessions, each with THREE consecutive AMF
# faults against the SAME two unchanged UE processes. Reuse source-pinned
# successful Stage5M candidate image and historical Stage3 patched CU.
# This never touches HP, Kubernetes, OSM, production keys or subscribers.
on:
  push:
    branches:
      - experiment/hcran-stage5p-three-cycle-amf-recovery-20261116
    paths:
      - .github/workflows/hcran-stage5p-three-cycle-amf-recovery.yml
  workflow_dispatch:

permissions:
  contents: read
  actions: read

concurrency:
  group: hcran-stage5p-20261116-${{ github.ref }}
  cancel-in-progress: false

jobs:
  isolated-independent-trial:
    name: One session, three consecutive AMF recovery cycles; repeat ${{ matrix.trial }}/2
    runs-on: ubuntu-24.04
    timeout-minutes: 90
    strategy:
      fail-fast: false
      max-parallel: 2
      matrix:
        trial: [1, 2]
    env:
      CORE_IMG: gradiant/open5gs:2.7.6
      MONGO_IMG: mongo:6.0
      CU_IMG: oai-ngap-2026w13-v2:stage3-portable-4
      DU_IMG: oaisoftwarealliance/oai-gnb:2026.w45
      UE_IMG: hcran-stage5p-reused-guard:trial-${{ matrix.trial }}
    steps:
      - name: Checkout Stage5P qualification source (current experimental commit)
        uses: actions/checkout@v4
        with:
          persist-credentials: false
          ref: ${{ github.sha }}
          path: qualification

      - name: Checkout frozen Stage4P AMF fault harness
        uses: actions/checkout@v4
        with:
          persist-credentials: false
          ref: 4080110a74bf6ba58804797c5b7216458e2f0a93
          path: baseline

      - name: Install isolated test dependencies and kernel prerequisites
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p "$RUNNER_TEMP/stage5p-evidence" "$RUNNER_TEMP/stage5p-render" "$RUNNER_TEMP/stage5p-inputs"
          python3 -m venv "$RUNNER_TEMP/stage5p-venv"
          "$RUNNER_TEMP/stage5p-venv/bin/python" -m pip install --disable-pip-version-check PyYAML==6.0.2 pymongo==4.10.1
          sudo apt-get update -qq
          sudo DEBIAN_FRONTEND=noninteractive apt-get install -y --no-install-recommends tcpdump
          test -c /dev/net/tun || sudo modprobe tun
          test -c /dev/net/tun
          test -d /proc/net/sctp || sudo modprobe sctp
          test -d /proc/net/sctp
          {
            echo "trial=${{ matrix.trial }}"
            echo "upstream_stage5m_run=43588828565"
            uname -a
            free -h
            df -h /
          } > "$RUNNER_TEMP/stage5p-evidence/runner-preflight.txt"

      - name: Install Helm for static H-CRAN manifests
        uses: azure/setup-helm@v4
        with:
          version: v3.21.0

      - name: Render two-DU H-CRAN source without deployment
        shell: bash
        run: |
          set -euo pipefail
          helm template hcran-oai-cu qualification/helm/cran-oai/cu \
            -f qualification/helm/cran-oai/cu/values-hcran.yaml \
            -f qualification/helm/cran-oai/cu/values-hcran-secure-staging.yaml \
            --set-string image.reference=oaisoftwarealliance/oai-gnb:2026.w13 \
            --set-string image.pullPolicy=IfNotPresent \
            > "$RUNNER_TEMP/stage5p-render/cu.yaml"
          helm template hcran-oai-macro qualification/helm/cran-oai/du \
            -f qualification/helm/cran-oai/du/values-hcran-macro.yaml \
            --set-string image.reference=oaisoftwarealliance/oai-gnb:2026.w25 \
            --set-string image.pullPolicy=IfNotPresent \
            > "$RUNNER_TEMP/stage5p-render/macro.yaml"
          helm template hcran-oai-small qualification/helm/cran-oai/du \
            -f qualification/helm/cran-oai/du/values-hcran-small.yaml \
            --set-string image.reference=oaisoftwarealliance/oai-gnb:2026.w25 \
            --set-string image.pullPolicy=IfNotPresent \
            > "$RUNNER_TEMP/stage5p-render/small.yaml"

      - name: Retrieve immutable Stage3 patched CU archive
        uses: actions/download-artifact@v4
        with:
          repository: rathod9771/5g-kubernetes
          run-id: 43157479388
          name: oai-ngap-stage3-portable-4
          github-token: ${{ github.token }}
          path: ${{ runner.temp }}/stage5p-inputs/cu

      - name: Retrieve passing Stage5M source-pinned UE research image
        uses: actions/download-artifact@v4
        with:
          repository: rathod9771/5g-kubernetes
          run-id: 43588828565
          name: hcran-stage5m-source-pinned-UE-image-1
          github-token: ${{ github.token }}
          path: ${{ runner.temp }}/stage5p-inputs/ue

      - name: Verify and load candidate; isolate core and DU container images
        shell: bash
        run: |
          set -euo pipefail
          cu="$RUNNER_TEMP/stage5p-inputs/cu/oai-ngap-stage3-portable.tar.gz"
          ue="$RUNNER_TEMP/stage5p-inputs/ue/hcran-stage5m-ra-guard-ue.tar.gz"
          gzip -t "$cu"
          gzip -t "$ue"
          sha256sum "$cu" "$ue" > "$RUNNER_TEMP/stage5p-evidence/pinned-inputs.sha256"
          python3 - "$cu" "$ue" <<'PY'
          import hashlib, sys
          expected = ("97b456a24402043d48489c0336154457ce6c29c2ab947d52442b0979e7b4369d",
                      "a06256ac032672a1e8766c53f4bfbd7d2c5f3a61e4f3f1060c4dea0523b000b2")
          for path, trusted in zip(sys.argv[1:], expected):
              actual = hashlib.sha256(open(path, "rb").read()).hexdigest()
              if actual != trusted:
                  raise SystemExit("FAIL CLOSED: archived Stage5M CU/UE input SHA mismatch")
          print("PASS pinned Stage5M research image and Stage3 CU archive SHA-256")
          PY
          docker load -i "$cu"
          docker load -i "$ue"
          docker image inspect hcran-stage5m-candidate:source-pinned-w45 --format '{{.Id}}' \
            > "$RUNNER_TEMP/stage5p-evidence/stage5m-ue-source-id.txt"
          docker tag hcran-stage5m-candidate:source-pinned-w45 "$UE_IMG"
          for image in "$CORE_IMG" "$MONGO_IMG" "$DU_IMG"; do docker pull "$image"; done
          docker image inspect "$UE_IMG" --format '{{.Id}}' > "$RUNNER_TEMP/stage5p-evidence/ue-candidate-id.txt"

      - name: Audit fail-closed multicycle harness syntax
        shell: bash
        run: |
          set -euo pipefail
          python3 -m py_compile qualification/experiments/oai-ngap-2026w13/stage5p/run_three_cycle_recovery.py
          python3 -m py_compile qualification/experiments/oai-ngap-2026w13/stage5p/verify_three_cycle_recovery.py
          python3 -m py_compile qualification/experiments/oai-ngap-2026w13/stage5i/verify_bounded_recovery.py
          python3 -m py_compile qualification/experiments/oai-ngap-2026w13/stage5k/verify_tun_renewal.py

      - name: Three consecutive AMF faults, unchanged two UEs, fresh NAS and F1-U NG-U every cycle
        shell: bash
        run: |
          set -euo pipefail
          "$RUNNER_TEMP/stage5p-venv/bin/python" -u \
            qualification/experiments/oai-ngap-2026w13/stage5p/run_three_cycle_recovery.py \
            --baseline "$GITHUB_WORKSPACE/baseline/experiments/oai-ngap-2026w13" \
            --rendered "$RUNNER_TEMP/stage5p-render" \
            --output "$RUNNER_TEMP/stage5p-evidence" \
            --cu-image "$CU_IMG" --du-image "$DU_IMG" --ue-image "$UE_IMG" \
            --cycles 3 --verify-gtpu \
            2>&1 | tee "$RUNNER_TEMP/stage5p-console.log"
          "$RUNNER_TEMP/stage5p-venv/bin/python" \
            qualification/experiments/oai-ngap-2026w13/stage5p/verify_three_cycle_recovery.py \
            "$RUNNER_TEMP/stage5p-evidence"

      - name: Remove private test material before artifact upload
        if: always()
        shell: bash
        run: |
          rm -rf "$RUNNER_TEMP/stage5p-evidence/PRIVATE-REMOVE-BEFORE-UPLOAD"
          test ! -e "$RUNNER_TEMP/stage5p-evidence/PRIVATE-REMOVE-BEFORE-UPLOAD"

      - name: Preserve redacted evidence whether pass or fail
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: hcran-stage5p-independent-recovery-trial-${{ matrix.trial }}
          path: ${{ runner.temp }}/stage5p-evidence/
          if-no-files-found: warn
          retention-days: 7
          compression-level: 2
