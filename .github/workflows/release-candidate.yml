name: Release Candidate (original orchestrator)

# Builds immutable release candidates and records signed provenance.
# It never deploys: no OSM or Kubernetes credentials are available here, only
# GitHub-hosted runners are used, and the HP self-hosted runner is never targeted.
# Which RAN is active is decided later on the target, under the lifecycle lock.
on:
  push:
    branches: [reproducible-installer, 'feature/**']
  pull_request:
    branches: [reproducible-installer]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: release-candidate-${{ github.ref }}
  # An in-progress candidate build/attestation is never cancelled; superseded
  # PR validations may be.
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

env:
  RELEASE_BRANCH: reproducible-installer
  RELEASE_ENVIRONMENT: hp-lab

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    outputs:
      channel: ${{ steps.release.outputs.channel }}
      packages: ${{ steps.release.outputs.packages }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          ref: ${{ github.sha }}
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: '3.12'
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: '20'
      - uses: azure/setup-helm@1a275c3b69536ee54be43f2070a358922e12c8d4 # v4.3.1
        with:
          version: 'v3.21.0'
      - name: Install offline test dependencies
        run: python3 -m pip install -r ran-selector/requirements.txt
      - name: Verify exact source commit
        shell: bash
        run: test "$(git rev-parse HEAD)" = "$GITHUB_SHA"
      - name: Full offline regression suite
        run: python3 -m unittest discover -s tests -p 'test_*.py'
      - name: Determine comparable base commit
        id: base
        shell: bash
        env:
          EVENT_BEFORE: ${{ github.event.before }}
          PR_BASE: ${{ github.event.pull_request.base.sha }}
        run: |
          base=""
          if [ "$GITHUB_EVENT_NAME" = push ]; then base="$EVENT_BEFORE"; fi
          if [ "$GITHUB_EVENT_NAME" = pull_request ]; then base="$PR_BASE"; fi
          # A new branch has no previous push: compare with the integration branch.
          # No usable base means build_release.py performs a full rebuild.
          if ! [[ "$base" =~ ^[0-9a-f]{40}$ ]] || [[ "$base" =~ ^0+$ ]]; then
            base="$(git merge-base "origin/$RELEASE_BRANCH" HEAD 2>/dev/null || true)"
          fi
          echo "base=$base" >> "$GITHUB_OUTPUT"
      - name: Build release candidate (packages, image evidence, manifest)
        id: release
        shell: bash
        env:
          BASE: ${{ steps.base.outputs.base }}
        run: |
          python3 scripts/build_release.py --base "$BASE" --head "$GITHUB_SHA" \
            --output "$RUNNER_TEMP/release" --release-branch "$RELEASE_BRANCH" \
            --environment "$RELEASE_ENVIRONMENT" --ci-validation passed --verify-registry \
            > "$RUNNER_TEMP/summary.json"
          cat "$RUNNER_TEMP/summary.json"
          { echo '```json'; cat "$RUNNER_TEMP/summary.json"; echo '```'; } >> "$GITHUB_STEP_SUMMARY"
          echo "channel=$(python3 -c 'import json,sys; print(json.load(open(sys.argv[1]))["channel"])' "$RUNNER_TEMP/summary.json")" >> "$GITHUB_OUTPUT"
          echo "packages=$(python3 -c 'import json,sys; print(json.load(open(sys.argv[1]))["packages"])' "$RUNNER_TEMP/summary.json")" >> "$GITHUB_OUTPUT"
      - name: Upload release candidate
        if: github.event_name != 'pull_request'
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: release-candidate-${{ github.sha }}-${{ github.run_attempt }}
          path: ${{ runner.temp }}/release/
          if-no-files-found: error
          retention-days: 30

  attest:
    # Signed provenance only for pushes to the approved release branch. OIDC and
    # attestation permissions exist only in this job, which runs no repository code.
    needs: build
    if: github.event_name == 'push' && github.ref == 'refs/heads/reproducible-installer' && needs.build.outputs.channel == 'release' && needs.build.outputs.packages != '0'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
      id-token: write
      attestations: write
    steps:
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4.3.0
        with:
          name: release-candidate-${{ github.sha }}-${{ github.run_attempt }}
          path: release
      - uses: actions/attest-build-provenance@e8998f949152b193b063cb0ec769d69d929409be # v2.4.0
        with:
          subject-path: |
            release/release-manifest.json
            release/packages/*.tar.gz
            release/provenance/*.json
