name: Experimental OAI NGAP Stage 4A H-CRAN offline audit (NO DEPLOY)

# Read-only offline render and archive audit. The production promotion gate
# stays NO-GO even if Helm/source/image checks pass.
on:
  push:
    branches:
      - experiment/oai-ngap-stage4-hcran-gates
    paths:
      - .github/workflows/oai-ngap-2026w13-stage4.yml
      - experiments/oai-ngap-2026w13/stage4/**
  workflow_dispatch:

permissions:
  contents: read
  actions: read

concurrency:
  group: ngap-hcran-stage4a-${{ github.ref }}
  cancel-in-progress: true

jobs:
  hcran-offline-audit:
    name: Canonical CU + macro/small DU and experimental image audit
    if: github.ref == 'refs/heads/experiment/oai-ngap-stage4-hcran-gates'
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    env:
      OAI_CU_REF: oaisoftwarealliance/oai-gnb:2026.w13
      OAI_DU_REF: oaisoftwarealliance/oai-gnb:2026.w25
      PORTABLE_IMAGE_TAG: oai-ngap-2026w13-v2:stage3-portable-4
    steps:
      - name: Read-only checkout of Stage 4A branch
        uses: actions/checkout@v4
        with:
          persist-credentials: false

      - name: Install pinned Helm for offline template rendering
        uses: azure/setup-helm@v4
        with:
          version: v3.21.0

      - name: Prepare Python YAML parser in isolated virtual environment
        shell: bash
        run: |
          set -euo pipefail
          python3 -m venv "$RUNNER_TEMP/stage4-python"
          "$RUNNER_TEMP/stage4-python/bin/python" -m pip install \
            --disable-pip-version-check PyYAML==6.0.2

      - name: Helm lint and render CU, macro and small (NO install)
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p "$RUNNER_TEMP/stage4-render" "$RUNNER_TEMP/stage4-evidence"
          helm lint helm/cran-oai/cu --strict -f helm/cran-oai/cu/values-hcran.yaml \
            --set-string "image.reference=$OAI_CU_REF" \
            --set-string "image.pullPolicy=IfNotPresent" \
            | tee "$RUNNER_TEMP/stage4-evidence/helm-cu-lint.txt"
          helm template hcran-oai-cu helm/cran-oai/cu \
            -f helm/cran-oai/cu/values-hcran.yaml \
            --set-string "image.reference=$OAI_CU_REF" \
            --set-string "image.pullPolicy=IfNotPresent" \
            > "$RUNNER_TEMP/stage4-render/cu.yaml"
          for cell in macro small; do
            helm lint helm/cran-oai/du --strict \
              -f "helm/cran-oai/du/values-hcran-${cell}.yaml" \
              --set-string "image.reference=$OAI_DU_REF" \
              --set-string "image.pullPolicy=IfNotPresent" \
              | tee "$RUNNER_TEMP/stage4-evidence/helm-${cell}-lint.txt"
            helm template "hcran-oai-${cell}" helm/cran-oai/du \
              -f "helm/cran-oai/du/values-hcran-${cell}.yaml" \
              --set-string "image.reference=$OAI_DU_REF" \
              --set-string "image.pullPolicy=IfNotPresent" \
              > "$RUNNER_TEMP/stage4-render/${cell}.yaml"
          done
          cp "$RUNNER_TEMP"/stage4-render/*.yaml "$RUNNER_TEMP/stage4-evidence/"

      - name: Download completed Stage 3 portable image artifact
        uses: actions/download-artifact@v4
        with:
          repository: rathod9771/5g-kubernetes
          run-id: 43157479388
          name: oai-ngap-stage3-portable-4
          github-token: ${{ github.token }}
          path: ${{ runner.temp }}/stage4-input

      - name: Inspect portable image and shared libraries (no runtime NGAP)
        shell: bash
        run: |
          set -euo pipefail
          archive="$RUNNER_TEMP/stage4-input/oai-ngap-stage3-portable.tar.gz"
          gzip -t "$archive"
          sha256sum "$archive" > "$RUNNER_TEMP/stage4-evidence/image-archive.sha256"
          docker load -i "$archive" | tee "$RUNNER_TEMP/stage4-evidence/image-load.txt"
          docker image inspect "$PORTABLE_IMAGE_TAG" \
            > "$RUNNER_TEMP/stage4-evidence/image-inspect.json"
          docker run --rm --network none --entrypoint /bin/sh "$PORTABLE_IMAGE_TAG" -ec \
            'test -x /opt/oai-gnb/bin/nr-softmodem; ldd /opt/oai-gnb/bin/nr-softmodem' \
            | tee "$RUNNER_TEMP/stage4-evidence/ldd.txt"
          if grep -q 'not found' "$RUNNER_TEMP/stage4-evidence/ldd.txt"; then
            echo "Missing dependencies in candidate image" >&2
            exit 1
          fi

      - name: Run read-only topology audit and capture NO-GO reasons
        shell: bash
        run: |
          set -euo pipefail
          "$RUNNER_TEMP/stage4-python/bin/python" \
            experiments/oai-ngap-2026w13/stage4/validate_hcran.py \
            --repository "$GITHUB_WORKSPACE" \
            --rendered "$RUNNER_TEMP/stage4-render" \
            --image-inspect "$RUNNER_TEMP/stage4-evidence/image-inspect.json" \
            --report "$RUNNER_TEMP/stage4-evidence/readiness.json" \
            2>&1 | tee "$RUNNER_TEMP/stage4-evidence/assessment.log"
          echo "::warning::Stage 4A is static only. Production promotion remains NO-GO pending E2, two-DU F1, UE/PDU, image distribution and OSM tests."

      - name: Always upload offline readiness evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: oai-ngap-stage4a-hcran-no-go-${{ github.run_number }}
          path: ${{ runner.temp }}/stage4-evidence/
          if-no-files-found: warn
          retention-days: 7
