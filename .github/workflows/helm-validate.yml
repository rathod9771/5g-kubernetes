name: Offline Project Validation

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  offline-regression:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
      - uses: azure/setup-helm@v4
        with:
          version: 'v3.21.0'
      - name: Install offline test dependencies
        run: python3 -m pip install -r ran-selector/requirements.txt
      # Source-derived NGAP tests require the exact upstream OAI tag, patched
      # only on the hosted runner. No source is copied from the HP cluster.
      - name: Prepare pinned patched OAI fixture for source regression
        if: hashFiles('experiments/oai-ngap-2026w13/ngap-retry-v2.patch') != ''
        shell: bash
        run: |
          set -euo pipefail
          git clone --depth 1 --single-branch --branch 2026.w13 \
            https://github.com/OPENAIRINTERFACE/openairinterface5g.git "$RUNNER_TEMP/oai-2026w13-fixture"
          cd "$RUNNER_TEMP/oai-2026w13-fixture"
          git apply --check "$GITHUB_WORKSPACE/experiments/oai-ngap-2026w13/ngap-retry-v2.patch"
          git apply "$GITHUB_WORKSPACE/experiments/oai-ngap-2026w13/ngap-retry-v2.patch"
          test "$(git diff --name-only)" = "openair3/NGAP/ngap_gNB.c"
          echo "OAI_SOURCE_DIR=$RUNNER_TEMP/oai-2026w13-fixture" >> "$GITHUB_ENV"
      # Tests supply approved synthetic image inputs, validate complete chart
      # roots and immutable OSM packages, and assert missing images fail closed.
      # Bare rendering without those inputs is intentionally rejected.
      - name: Regressions, simulations, Helm and OSM package validation
        run: python3 -m unittest discover -s tests -p 'test_*.py'
      - name: JavaScript syntax
        run: |
          node --check ran-selector/assurance.js
          node --check tests/workspace_dom.js
      - name: Reject unsupported template-file reads
        run: |
          if grep -rn '\.Files\.Get "templates/' helm/; then
            echo 'Templates are excluded from .Files; use an explicit helper.'
            exit 1
          fi
