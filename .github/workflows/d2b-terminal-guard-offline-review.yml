name: D2B terminal-accounting guard offline review
on:
  push:
    branches:
      - experiment/layer3-d2b-pinned-open5gs-graph-20261118
    paths:
      - .github/workflows/d2b-terminal-guard-offline-review.yml
permissions:
  contents: read
jobs:
  offline-guard-review-only:
    runs-on: ubuntu-22.04
    timeout-minutes: 14
    env:
      INPUT: ci/experimental/srsran-ngap-stage-d1
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          persist-credentials: false
      - name: Source integrity
        run: |
          set -euo pipefail
          cd "$INPUT"
          sha256sum -c SHA256SUMS
      - name: Install read-only Ninja smoke-test dependency
        timeout-minutes: 3
        run: |
          sudo -n apt-get -o Acquire::Retries=0 update
          sudo -n apt-get -o Acquire::Retries=0 install -y --no-install-recommends ninja-build
      - name: Review-only Python setup
        timeout-minutes: 5
        run: |
          python3 -B "$INPUT/workflow_evidence.py" run wheel_acquisition
          python3 -B "$INPUT/workflow_evidence.py" run python_setup
      - name: All offline regressions including quiescent terminal guard
        timeout-minutes: 6
        run: |
          set -euo pipefail
          cd "$INPUT"
          sha256sum -c SHA256SUMS
          "$RUNNER_TEMP/d1-python/bin/python3" -B -m unittest -v \
            test_harness.py test_build_harness.py test_publication.py \
            test_execution_proposals.py test_workflow_evidence.py \
            test_toolchain_bounded.py test_open5gs_graph_gate.py \
            test_open5gs_rsp_review.py test_open5gs_rsp_expansion.py \
            test_cgroup_accounting_review.py test_cgroup_terminal_guard.py test_native_build_admission.py
      - name: Verify no hosted native build was invoked
        run: |
          python3 - <<'PY'
          from pathlib import Path
          worker=Path('ci/experimental/srsran-ngap-stage-d1/build_worker.py').read_text()
          supervisor=Path('ci/experimental/srsran-ngap-stage-d1/build_supervisor.py').read_text()
          assert worker.index("admit_reviewed_open5gs_graph(graph,review,expanded_report)") < worker.index("rec.phase('srsran_compilation'")
          assert "audit_open5gs_graph(graph)" in worker
          assert "review_expanded_compdb(expanded,review)" in worker
          assert "['ctest'" not in worker
          assert "runtime_launcher" not in worker
          finalizer=Path('ci/experimental/srsran-ngap-stage-d1/finalize_build_evidence.py').read_text()
          assert "verify_native_terminal_guard(root,final,usage)" in finalizer
          assert "'/usr/bin/python3','-B',str(p/'guarded_worker.py')" in supervisor
          assert "validate_quiescent_capture(" in supervisor
          assert "verify_guard_release_end(" in supervisor
          print("OFFLINE_PINNED_NATIVE_ADMISSION_REVIEW_ONLY__NO_NATIVE_EXECUTION")
          PY

# Requalification after guarded native-evidence fixture updates (offline only).

# Offline recheck after consistent unittest class method indentation.
