name: H-CRAN Stage 5F observed NEA2 NIA2 RRC security mode (NO DEPLOY)

on:
  push:
    branches:
      - experiment/hcran-production-qualification-20261113
    paths:
      - .github/workflows/hcran-stage5f-as-security-evidence.yml
      - scripts/hcran_as_security_log_audit.py
      - tests/test_hcran_as_security_log_audit.py
  workflow_dispatch:

permissions:
  contents: read
  actions: read

jobs:
  audit-as-mode:
    runs-on: ubuntu-24.04
    timeout-minutes: 9
    steps:
      - name: Check out isolated H-CRAN qualification source
        uses: actions/checkout@v4
        with:
          persist-credentials: false
      - name: Check adversarial security log contract
        shell: bash
        run: |
          set -euo pipefail
          python3 -m unittest discover -s tests -p test_hcran_as_security_log_audit.py -v
      - name: Fetch successful real Stage 4Z CU/UE logs, never production data
        uses: actions/download-artifact@v4
        with:
          repository: rathod9771/5g-kubernetes
          run-id: 43391519669
          name: hcran-stage4z-real-f1-handover-attempt-3
          github-token: ${{ github.token }}
          path: ${{ runner.temp }}/real-stage4z-logs
      - name: Inspect real UE and CU AS security mode without copying raw log
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p "$RUNNER_TEMP/hcran-5f-report"
          test -s "$RUNNER_TEMP/real-stage4z-logs/after-bidirectional-f1-handover-cu.log"
          test -s "$RUNNER_TEMP/real-stage4z-logs/after-bidirectional-f1-handover-ue.log"
          python3 scripts/hcran_as_security_log_audit.py \
            --cu "$RUNNER_TEMP/real-stage4z-logs/after-bidirectional-f1-handover-cu.log" \
            --ue "$RUNNER_TEMP/real-stage4z-logs/after-bidirectional-f1-handover-ue.log" \
            --out "$RUNNER_TEMP/hcran-5f-report/observed-as-security.json"
          python3 - <<'PY'
          import json, os, pathlib
          data=json.loads((pathlib.Path(os.environ['RUNNER_TEMP'])/'hcran-5f-report'/'observed-as-security.json').read_text())
          assert data['as_security_mode_observed'] is True
          assert data['cu_as_ciphering_algorithm']==2
          assert data['cu_as_integrity_algorithm']==2
          assert data['nas_ciphering_or_integrity_proven'] is False
          assert data['onwire_ciphertext_proven'] is False
          assert data['production_authorized'] is False
          assert data['production_decision']=='NO_GO'
          print('PASS: logged NEA2/NIA2 AS mode + SecurityModeComplete + real NAS/PDU continuation; not on-wire crypto conformance')
          PY
      - name: Upload only sanitized results without subscriber or raw logs
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: hcran-stage5f-as-security-log-proof-${{ github.run_number }}
          path: ${{ runner.temp }}/hcran-5f-report/observed-as-security.json
          if-no-files-found: warn
          retention-days: 7
