name: H-CRAN pinned F1 handover CU build - isolated no deploy

on:
  push:
    branches:
      - experiment/hcran-production-qualification-20261113
    paths:
      - .github/workflows/hcran-f1-cu-telnet-build.yml
      - scripts/hcran_build_pinned_f1_cu.sh
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: hcran-f1-telnet-build-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build-cu:
    runs-on: ubuntu-24.04
    timeout-minutes: 90
    env:
      OAI_SOURCE: ${{ runner.temp }}/hcran-f1-oai-source
      OUTPUT: ${{ runner.temp }}/hcran-f1-build-evidence
      IMAGE: oai-hcran-f1-telnet:experimental-${{ github.run_number }}
    steps:
      - name: Checkout isolated branch
        uses: actions/checkout@v4
        with:
          persist-credentials: false

      - name: Compile pinned patched CU and handover CI modules
        shell: bash
        run: bash scripts/hcran_build_pinned_f1_cu.sh

      - name: Upload successful ephemeral test-only image
        uses: actions/upload-artifact@v4
        with:
          name: hcran-f1-telnet-candidate-${{ github.run_number }}
          path: ${{ runner.temp }}/hcran-f1-candidate-archive/hcran-f1-patched-telnet.tar.gz
          if-no-files-found: error
          retention-days: 7
          compression-level: 0

      - name: Preserve diagnostics even on failure
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: hcran-f1-build-log-${{ github.run_number }}
          path: ${{ runner.temp }}/hcran-f1-build-evidence/
          if-no-files-found: warn
          retention-days: 7
