name: D2B scratch correction offline review only
on:
  push:
    branches:
      - experiment/layer3-d2b-storage-preflight-20261118
permissions:
  contents: read
concurrency:
  group: d2b-scratch-review-${{ github.ref }}
  cancel-in-progress: false
jobs:
  offline-tests-only:
    if: github.ref == 'refs/heads/experiment/layer3-d2b-storage-preflight-20261118' && github.event_name == 'push'
    runs-on: ubuntu-22.04
    timeout-minutes: 20
    env:
      INPUT: ci/experimental/srsran-ngap-stage-d1
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          persist-credentials: false
      - name: Verify reviewed input hashes before setup
        run: |
          cd "$INPUT"
          sha256sum -c SHA256SUMS
      - name: Acquire pinned wheels and install offline isolated Python
        timeout-minutes: 7
        run: |
          /usr/bin/python3 -c "import sys,platform; assert sys.version_info[:2] == (3,10) and platform.machine() == 'x86_64'"
          python3 -B "$INPUT/workflow_evidence.py" run wheel_acquisition
          python3 -B "$INPUT/workflow_evidence.py" run python_setup
      - name: Run complete offline preparation tests (no native compilation)
        timeout-minutes: 5
        run: |
          cd "$INPUT"
          sha256sum -c SHA256SUMS
          "$RUNNER_TEMP/d1-python/bin/python3" -B -m unittest -v test_harness.py test_build_harness.py test_publication.py test_execution_proposals.py test_workflow_evidence.py test_toolchain_bounded.py
