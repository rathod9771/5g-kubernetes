name: P5 CD Safety Gate (no deployment)

# Offline policy guard only. Never targets self-hosted runners, OSM or Kubernetes.
on:
  push:
    branches:
      - 'p5/**'
  pull_request:
    branches:
      - 'p4/kdu-upgrade-experiment'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  readiness:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: '3.12'
      - name: Verify existing policy and upgrade gate remain closed
        run: python3 scripts/experiments/p5/p5_readiness.py --assert-locked
      - name: Offline P5 readiness regression tests
        run: python3 -m unittest discover -s tests -p 'test_p5_readiness.py' -v
