name: H-CRAN Stage 5I AMF race recovery research - NO DEPLOY
on:
  push:
    branches: [experiment/hcran-stage5i-amf-race-20261114]
    paths:
      - experiments/oai-ngap-2026w13/stage5i/TRIGGER-ONCE.txt
  workflow_dispatch:

permissions:
  contents: read
  actions: read

concurrency:
  group: hcran-stage5i-no-deploy
  cancel-in-progress: true

jobs:
  real-ue-recovery:
    runs-on: ubuntu-24.04
    timeout-minutes: 105
    env:
      CORE_IMG: gradiant/open5gs:2.7.6
      MONGO_IMG: mongo:6.0
      DU_IMG: oaisoftwarealliance/oai-gnb:2026.w45
      CU_IMG: oai-hcran-stage5i-cu:experimental
      UE_IMG: oai-hcran-stage5i-ue:experimental
    steps:
      - name: Checkout isolated experimental branch
        uses: actions/checkout@v4
        with:
          persist-credentials: false
          path: qualification
      - name: Checkout immutable Stage4Z bootstrap
        uses: actions/checkout@v4
        with:
          persist-credentials: false
          path: baseline
          ref: 1fb544a39232a37c1af7250e0f3612c9ac0fc738
      - name: Offline patch tests and source/script syntax
        shell: bash
        run: |
          set -euo pipefail
          python3 -m unittest discover -s qualification/experiments/oai-ngap-2026w13/stage5i -p 'test_*.py' -v
          python3 -m py_compile qualification/experiments/oai-ngap-2026w13/stage5i/*.py
          bash -n qualification/scripts/hcran_build_pinned_f1_cu.sh
          bash -n qualification/scripts/hcran_build_pinned_w45_ue_cause9.sh
      - name: Install Helm
        uses: azure/setup-helm@v4
        with:
          version: v3.21.0
      - name: Prepare isolated Docker RFsim prerequisites
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p "$RUNNER_TEMP/stage5i-evidence" "$RUNNER_TEMP/stage5i-render"
          python3 -m venv "$RUNNER_TEMP/stage5i-venv"
          "$RUNNER_TEMP/stage5i-venv/bin/python" -m pip install --disable-pip-version-check PyYAML==6.0.2 pymongo==4.10.1
          sudo apt-get update -qq
          sudo DEBIAN_FRONTEND=noninteractive apt-get install -y --no-install-recommends tcpdump
          test -c /dev/net/tun || sudo modprobe tun
          test -d /proc/net/sctp || sudo modprobe sctp
          test -c /dev/net/tun && test -d /proc/net/sctp
          { uname -a; free -h; df -h /; } > "$RUNNER_TEMP/stage5i-evidence/runner-preflight.txt"
      - name: Compile pinned F1 CU with test-only no-AMF RRC release
        shell: bash
        run: |
          set -euo pipefail
          cd qualification
          export GITHUB_WORKSPACE="$PWD"
          export OAI_SOURCE="$RUNNER_TEMP/stage5i-cu-source"
          export OUTPUT="$RUNNER_TEMP/stage5i-cu-build-proof"
          export IMAGE="$CU_IMG"
          export STAGE5I_NO_AMF_RELEASE=1
          bash scripts/hcran_build_pinned_f1_cu.sh
          grep -q 'Stage5I: InitialUEMessage undelivered' "$OUTPUT/applied-ngap-patch.diff"
          docker image inspect "$CU_IMG" --format '{{.Id}}' > "$RUNNER_TEMP/stage5i-evidence/cu-image-id.txt"
      - name: Compile pinned W45 UE with cause9 and RRC-release TUN rearm
        shell: bash
        run: |
          set -euo pipefail
          cd qualification
          export GITHUB_WORKSPACE="$PWD"
          export OAI_SOURCE="$RUNNER_TEMP/stage5i-ue-source"
          export OUTPUT="$RUNNER_TEMP/stage5i-ue-build-proof"
          export IMAGE="$UE_IMG"
          export STAGE5I_REARM=1
          bash scripts/hcran_build_pinned_w45_ue_cause9.sh
          grep -q 'Stage5I: RRC release interrupted Service Request' "$OUTPUT/test-only-UE-NAS-cause9.patch"
          docker image inspect "$UE_IMG" --format '{{.Id}}' > "$RUNNER_TEMP/stage5i-evidence/ue-image-id.txt"
      - name: Render RIC-free CU and two-DU UE-server RFsim profile
        shell: bash
        run: |
          set -euo pipefail
          CHART="$GITHUB_WORKSPACE/qualification/helm/cran-oai"
          helm template hcran-oai-cu "$CHART/cu" \
            -f "$CHART/cu/values-hcran.yaml" \
            -f "$CHART/cu/values-hcran-secure-staging.yaml" \
            --set-string image.reference=oaisoftwarealliance/oai-gnb:2026.w13 \
            > "$RUNNER_TEMP/stage5i-render/cu.yaml"
          for role in macro small; do
            helm template "hcran-oai-$role" "$CHART/du" \
              -f "$CHART/du/values-hcran-$role.yaml" \
              -f "$CHART/du/values-hcran-mobility-$role.yaml" \
              --set-string mobilityRfsim.serverAddr=172.29.76.40 \
              --set-string image.reference=oaisoftwarealliance/oai-gnb:2026.w45 \
              > "$RUNNER_TEMP/stage5i-render/$role.yaml"
          done
          "$RUNNER_TEMP/stage5i-venv/bin/python" - <<'PY'
          import os,pathlib,re,yaml
          p=pathlib.Path(os.environ['RUNNER_TEMP'])/'stage5i-render'
          def conf(n):
              docs=[x for x in yaml.safe_load_all((p/(n+'.yaml')).read_text()) if isinstance(x,dict)]
              return next(x for x in docs if x.get('kind')=='ConfigMap')['data']['gnb.conf']
          cu,macro,small=[conf(x) for x in ('cu','macro','small')]
          assert not any(x in cu for x in ('near_ric_ip_addr','e2_agent'))
          assert re.search(r'ciphering_algorithms\s*=\s*\(\s*"nea2"\s*\)\s*;',cu)
          assert re.search(r'integrity_algorithms\s*=\s*\(\s*"nia2"\s*\)\s*;',cu)
          assert 'gNB_DU_ID = 100;' in macro and 'gNB_DU_ID = 101;' in small
          assert all(re.search(r'serveraddr\s*=\s*"172\.29\.76\.40"\s*;',v) for v in (macro,small))
          print('PASS secure synthetic CU+2DU configuration; no E2/RIC')
          PY
      - name: Pull disposable core and DU and validate fresh test images
        shell: bash
        run: |
          set -euo pipefail
          for img in "$CORE_IMG" "$MONGO_IMG" "$DU_IMG"; do docker pull "$img"; done
          docker run --rm --network none --entrypoint /bin/sh "$CU_IMG" -ec \
            'test -x /opt/oai-gnb/bin/nr-softmodem && test -f /opt/oai-gnb/lib/libtelnetsrv_ci.so'
          docker run --rm --network none --entrypoint /bin/sh "$UE_IMG" -ec \
            'test -x /opt/oai-nr-ue/bin/nr-uesoftmodem && ! ldd /opt/oai-nr-ue/bin/nr-uesoftmodem | grep -q "not found"'
      - name: Real AMF-only fault and unchanged UE NAS PDU F1U NGU recovery
        shell: bash
        run: |
          set -euo pipefail
          "$RUNNER_TEMP/stage5i-venv/bin/python" -u \
            qualification/experiments/oai-ngap-2026w13/stage5i/amf_cause9_f1_ue_server.py \
            --baseline "$GITHUB_WORKSPACE/baseline/experiments/oai-ngap-2026w13" \
            --rendered "$RUNNER_TEMP/stage5i-render" \
            --output "$RUNNER_TEMP/stage5i-evidence" \
            --cu-image "$CU_IMG" --du-image "$DU_IMG" --ue-image "$UE_IMG" \
            --verify-gtpu 2>&1 | tee "$RUNNER_TEMP/stage5i-console.txt"
          "$RUNNER_TEMP/stage5i-venv/bin/python" \
            qualification/experiments/oai-ngap-2026w13/stage5i/evidence_contract.py \
            "$RUNNER_TEMP/stage5i-evidence"
      - name: Purge private synthetic test material
        if: always()
        shell: bash
        run: |
          rm -rf "$RUNNER_TEMP/stage5i-evidence/PRIVATE-REMOVE-BEFORE-UPLOAD"
          find "$RUNNER_TEMP/stage5i-evidence" -maxdepth 1 -type f -name '*ue*.log' -delete || true
          test ! -e "$RUNNER_TEMP/stage5i-evidence/PRIVATE-REMOVE-BEFORE-UPLOAD"
      - name: Upload source build evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: hcran-stage5i-source-build
          path: |
            ${{ runner.temp }}/stage5i-cu-build-proof/
            ${{ runner.temp }}/stage5i-ue-build-proof/
          if-no-files-found: warn
          retention-days: 7
          compression-level: 2
      - name: Upload redacted runtime evidence or failure summary
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: hcran-stage5i-runtime
          path: ${{ runner.temp }}/stage5i-evidence/
          if-no-files-found: warn
          retention-days: 7
          compression-level: 2
