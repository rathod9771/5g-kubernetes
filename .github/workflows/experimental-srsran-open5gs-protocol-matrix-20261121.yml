name: srsRAN Open5GS real NGAP F1AP protocol matrix (no OAI no build)
on:
  push:
    branches:
      - experiment/layer3-srsran-open5gs-protocol-matrix-20261121
    paths:
      - .github/workflows/experimental-srsran-open5gs-protocol-matrix-20261121.yml
permissions:
  contents: read
concurrency:
  group: srsran-open5gs-protocol-${{ github.sha }}
  cancel-in-progress: false
jobs:
  baseline-cran:
    name: C-RAN real protocol baseline
    if: github.repository == 'rathod9771/5g-kubernetes'
    runs-on: ubuntu-22.04
    timeout-minutes: 18
    steps:
      - name: Checkout isolated experimental branch
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          persist-credentials: false
      - name: Setup Helm for repository srsRAN chart rendering
        uses: azure/setup-helm@v4
        with:
          version: v3.17.3
      - name: Verify test script syntax before any container execution
        shell: bash
        run: |
          set -euo pipefail
          bash -n ci/experimental/srsran-open5gs-protocol/run.sh
          python3 -m py_compile ci/experimental/srsran-open5gs-protocol/prepare.py ci/experimental/srsran-open5gs-protocol/report.py
          ! grep -qiE 'oaisoftwarealliance|oai-nr-ue|kubectl |helm install|helm upgrade|docker build|git clone' ci/experimental/srsran-open5gs-protocol/{prepare.py,report.py,run.sh}
      - name: Real Open5GS AMF-NRF and srsRAN C-RAN CU-DU packet-level NG/F1 Setup
        timeout-minutes: 16
        shell: bash
        run: bash ci/experimental/srsran-open5gs-protocol/run.sh cran
      - name: Upload fail-closed classification only (no raw PCAP or subscriber data)
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: srsran-cran-protocol-${{ github.run_id }}
          path: verdict.json
          if-no-files-found: warn
          retention-days: 14
  parallel-profiles:
    name: "${{ matrix.profile }} srsRAN protocol test"
    needs: baseline-cran
    if: needs.baseline-cran.result == 'success'
    runs-on: ubuntu-22.04
    timeout-minutes: 18
    strategy:
      fail-fast: false
      max-parallel: 3
      matrix:
        profile: [vcran, fran, cloud-ran, oran, hcran]
    steps:
      - name: Checkout isolated experimental branch
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          persist-credentials: false
      - name: Setup Helm for repository srsRAN chart rendering
        uses: azure/setup-helm@v4
        with:
          version: v3.17.3
      - name: Real Open5GS and srsRAN protocol test in disposable runner
        timeout-minutes: 16
        shell: bash
        run: bash ci/experimental/srsran-open5gs-protocol/run.sh "${{ matrix.profile }}"
      - name: Upload fail-closed classification only
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: srsran-${{ matrix.profile }}-protocol-${{ github.run_id }}
          path: verdict.json
          if-no-files-found: warn
          retention-days: 14
