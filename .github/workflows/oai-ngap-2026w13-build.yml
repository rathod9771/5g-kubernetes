name: Experimental OAI NGAP 2026.w13 compile (no deploy)

# Separate experimental branch. No deployment, image publishing, or Git writes.
on:
  push:
    branches:
      - experiment/oai-ngap-2026w13-actions
    paths:
      - .github/workflows/oai-ngap-2026w13-build.yml
      - experiments/oai-ngap-2026w13/**
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: oai-ngap-2026w13-${{ github.ref }}
  cancel-in-progress: true

jobs:
  compile:
    name: Validate patch and build OAI gNB (RF simulator)
    if: github.ref == 'refs/heads/experiment/oai-ngap-2026w13-actions'
    runs-on: ubuntu-24.04
    timeout-minutes: 90
    env:
      DEBIAN_FRONTEND: noninteractive
      GIT_TERMINAL_PROMPT: "0"
      OAI_TAG: "2026.w13"
      PATCH_REL: "experiments/oai-ngap-2026w13/ngap-retry-v2.patch"
      CMAKE_BUILD_PARALLEL_LEVEL: "2"
      MAKEFLAGS: "-j2"
    steps:
      - name: Check out experimental branch (read-only token)
        uses: actions/checkout@v4
        with:
          persist-credentials: false

      - name: Runner preflight and provenance
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p "$RUNNER_TEMP/oai-ngap-ci-logs"
          {
            echo "Run: $GITHUB_RUN_ID"
            echo "Experimental commit: $GITHUB_SHA"
            echo "Experimental ref: $GITHUB_REF"
            echo "OAI requested tag: $OAI_TAG"
            echo "Runner: $RUNNER_OS / $RUNNER_ARCH"
            echo "CPU threads: $(nproc)"
            free -h
            df -h "$RUNNER_TEMP"
            sha256sum "$GITHUB_WORKSPACE/$PATCH_REL"
          } | tee "$RUNNER_TEMP/oai-ngap-ci-logs/preflight.txt"

      - name: Fetch upstream OAI release (isolated runner)
        shell: bash
        run: |
          set -euo pipefail
          git clone --depth 1 --single-branch --branch "$OAI_TAG" \
            https://github.com/OPENAIRINTERFACE/openairinterface5g.git \
            "$RUNNER_TEMP/openairinterface5g"
          git -C "$RUNNER_TEMP/openairinterface5g" rev-parse HEAD \
            | tee "$RUNNER_TEMP/oai-ngap-ci-logs/upstream-commit.txt"
          git -C "$RUNNER_TEMP/openairinterface5g" describe --tags --exact-match \
            | tee "$RUNNER_TEMP/oai-ngap-ci-logs/upstream-tag.txt"
          test "$(cat "$RUNNER_TEMP/oai-ngap-ci-logs/upstream-tag.txt")" = "$OAI_TAG"

      - name: Check, apply, and audit reviewed NGAP V2 patch
        shell: bash
        run: |
          set -euo pipefail
          cd "$RUNNER_TEMP/openairinterface5g"
          git apply --check "$GITHUB_WORKSPACE/$PATCH_REL"
          git apply "$GITHUB_WORKSPACE/$PATCH_REL"
          git diff --check
          git diff --stat | tee "$RUNNER_TEMP/oai-ngap-ci-logs/patch-stat.txt"
          git diff --binary > "$RUNNER_TEMP/oai-ngap-ci-logs/applied-source.patch"
          test "$(git diff --name-only)" = "openair3/NGAP/ngap_gNB.c"
          grep -q 'ngap_release_ues_for_amf(ngap_amf_data_p)' openair3/NGAP/ngap_gNB.c

      - name: Install OAI build prerequisites (hosted runner only)
        shell: bash
        run: |
          set -euo pipefail
          cd "$RUNNER_TEMP/openairinterface5g/cmake_targets"
          ./build_oai -I -w SIMU 2>&1 \
            | tee "$RUNNER_TEMP/oai-ngap-ci-logs/install.log"

      - name: Compile OAI gNB with bounded parallelism
        shell: bash
        run: |
          set -euo pipefail
          cd "$RUNNER_TEMP/openairinterface5g/cmake_targets"
          ./build_oai --gNB -w SIMU --ninja --build-tool-opt "-j2" 2>&1 \
            | tee "$RUNNER_TEMP/oai-ngap-ci-logs/build.log"
          test -f "$RUNNER_TEMP/openairinterface5g/cmake_targets/ran_build/build/nr-softmodem"
          sha256sum "$RUNNER_TEMP/openairinterface5g/cmake_targets/ran_build/build/nr-softmodem" \
            | tee "$RUNNER_TEMP/oai-ngap-ci-logs/nr-softmodem.sha256"

      - name: Collect final resource and build summary
        if: always()
        shell: bash
        run: |
          {
            echo "OAI tag: $OAI_TAG"
            echo "Experimental commit: $GITHUB_SHA"
            echo "Build job status: ${{ job.status }}"
            date -u
            free -h
            df -h "$RUNNER_TEMP"
          } > "$RUNNER_TEMP/oai-ngap-ci-logs/summary.txt"

      - name: Upload patch, build logs, and provenance (not a deployment artifact)
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: oai-ngap-2026w13-review-${{ github.run_number }}
          path: ${{ runner.temp }}/oai-ngap-ci-logs/
          if-no-files-found: warn
          retention-days: 7
