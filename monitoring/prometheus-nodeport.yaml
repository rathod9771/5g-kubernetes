apiVersion: v1
kind: Service
metadata:
  name: kube-prometheus-stack-prometheus-nodeport
  namespace: monitoring
spec:
  type: NodePort
  selector:
    app.kubernetes.io/name: prometheus
    prometheus: kube-prometheus-stack-prometheus
  ports:
  - port: 9090
    targetPort: 9090
    nodePort: 30990
    name: web
