# REVIEW FRAGMENT ONLY. Merge selected child route/receiver/inhibition into the
# existing configuration; never replace root routes or OSM alert receivers.
route:
  receiver: layer3-observe-only
  group_by: [cluster, namespace, ns_id, alertname]
  group_wait: 60s
  group_interval: 5m
  repeat_interval: 4h
  routes:
    - matchers: ['simulation="true"']
      receiver: layer3-simulation-drop
    - matchers: ['assurance="layer3"', 'simulation="false"']
      receiver: layer3-observe-only
receivers:
  - name: layer3-simulation-drop
  - name: layer3-observe-only
    webhook_configs:
      - url: http://REVIEWED-DASHBOARD-ENDPOINT/api/assurance/webhook
        send_resolved: true
        http_config:
          authorization:
            type: Bearer
            credentials_file: /etc/alertmanager/secrets/layer3-webhook/token
inhibit_rules:
  - source_matchers: ['alertname="KubernetesNodeNotReady"', 'node!=""', 'cluster!=""', 'simulation="false"']
    target_matchers: ['alertname=~"DUUnavailable|CUUnavailable|PodCrashLoop|ContainerRestartsHigh"', 'node!=""', 'cluster!=""', 'simulation="false"']
    equal: [cluster, node]
  - source_matchers: ['alertname="CUUnavailable"', 'ns_id!=""', 'cluster!=""', 'simulation="false"']
    target_matchers: ['alertname=~"F1AssociationLost|NGAPAssociationLost"', 'ns_id!=""', 'cluster!=""', 'simulation="false"']
    equal: [cluster, namespace, ns_id]
# Operator silences use Alertmanager's existing UI/API, with explicit matchers,
# creator, reason, start/end. Recurring maintenance must be configured as a
# reviewed time_interval plus child-route mute_time_intervals; never silence
# the root route. Engine maintenance windows suppress proposals, not collection.
