apiVersion: monitoring.coreos.com/v1
kind: PodMonitor
metadata:
  name: ran-exporter-metrics
  namespace: monitoring
  labels:
    release: kube-prometheus-stack
spec:
  namespaceSelector:
    any: true
  selector:
    matchLabels:
      app: ran-exporter
  podMetricsEndpoints:
  - port: metrics
    path: /metrics
    interval: 15s
