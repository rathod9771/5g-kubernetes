# Runtime template: render with scripts/runtime_render.py manifest before applying.
apiVersion: apps/v1
kind: Deployment
metadata:
  name: ran-exporter
  namespace: PLACEHOLDER_NAMESPACE
  labels:
    app: ran-exporter
spec:
  replicas: 1
  selector:
    matchLabels:
      app: ran-exporter
  template:
    metadata:
      labels:
        app: ran-exporter
      annotations:
        sidecar.istio.io/inject: "false"
    spec:
      serviceAccountName: ran-exporter
      containers:
      - name: exporter
        image: python:3.12-slim
        command: ["python3", "/app/ran_exporter.py"]
        env:
        - name: TARGET_NAMESPACE
          valueFrom:
            fieldRef:
              fieldPath: metadata.namespace
        - name: POD_LABEL_SELECTOR
          value: "" # namespace-scoped discovery; strict image/role classification in code
        ports:
        - containerPort: 9091
          name: metrics
        resources:
          requests:
            cpu: "100m"
            memory: "128Mi"
          limits:
            cpu: "500m"
            memory: "256Mi"
        volumeMounts:
        - name: script
          mountPath: /app
      volumes:
      - name: script
        configMap:
          name: ran-exporter-script
---
apiVersion: v1
kind: Service
metadata:
  name: ran-exporter
  namespace: PLACEHOLDER_NAMESPACE
  labels:
    app: ran-exporter
spec:
  selector:
    app: ran-exporter
  ports:
  - port: 9091
    targetPort: 9091
    name: metrics
