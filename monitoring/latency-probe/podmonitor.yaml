apiVersion: monitoring.coreos.com/v1
kind: PodMonitor
metadata:
  name: latency-probe-metrics
  namespace: monitoring
  labels:
    release: kube-prometheus-stack
spec:
  namespaceSelector:
    any: true
  selector:
    matchLabels:
      app: latency-probe
  podMetricsEndpoints:
  - port: metrics
    path: /metrics
    interval: 10s
