vnfd:
  description: KNF with single KDU using a helm-chart for Kamailio IMS
  df:
  - id: default-df
  ext-cpd:
  - id: mgmt-ext
    k8s-cluster-net: net1
  id: ims_knf
  k8s-cluster:
    nets:
    - id: net1
  kdu:
  - name: ims
    helm-chart: ims
  mgmt-cp: mgmt-ext
  product-name: ims_knf
  provider: Amrita5G
  version: '1.0'
