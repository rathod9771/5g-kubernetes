nsd:
  nsd:
  - description: Full stack NS - open5gs core, ims, and srsran RAN on shared mgmt network
    designer: Amrita5G
    df:
    - id: default-df
      vnf-profile:
      - id: open5gs
        virtual-link-connectivity:
        - constituent-cpd-id:
          - constituent-base-element-id: open5gs
            constituent-cpd-id: mgmt-ext
          virtual-link-profile-id: net1
        vnfd-id: open5gs_knf
      - id: ims
        virtual-link-connectivity:
        - constituent-cpd-id:
          - constituent-base-element-id: ims
            constituent-cpd-id: mgmt-ext
          virtual-link-profile-id: net1
        vnfd-id: ims_knf
      - id: srsran
        virtual-link-connectivity:
        - constituent-cpd-id:
          - constituent-base-element-id: srsran
            constituent-cpd-id: mgmt-ext
          virtual-link-profile-id: net1
        vnfd-id: srsran_knf
    id: full_stack_ns
    name: full_stack_ns
    version: 1.0
    virtual-link-desc:
    - id: net1
      mgmt-network: true
    vnfd-id:
    - open5gs_knf
    - ims_knf
    - srsran_knf
