apiVersion: v1
kind: ConfigMap
metadata:
  name: fran-edge-content
data:
  index.html: |
    <html><body>
    <h1>Fog RAN edge node</h1>
    <p>Served locally at the edge site. This traffic broke out at the
    edge UPF and never traversed the central user plane.</p>
    </body></html>
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: fran-edge-app
  labels: {app: fran-edge-app, ran-type: fran, site: edge}
spec:
  replicas: 1
  selector:
    matchLabels: {app: fran-edge-app}
  template:
    metadata:
      labels: {app: fran-edge-app, ran-type: fran, site: edge}
      annotations:
        sidecar.istio.io/inject: "false"
    spec:
      containers:
      - name: app
        image: {{ .Values.edgeApp.image }}
        ports:
        - containerPort: 80
        resources:
{{ toYaml .Values.edgeApp.resources | indent 10 }}
        volumeMounts:
        - name: content
          mountPath: /usr/share/nginx/html
      volumes:
      - name: content
        configMap:
          name: fran-edge-content
---
apiVersion: v1
kind: Service
metadata:
  name: fran-edge-app
  labels: {ran-type: fran, site: edge}
spec:
  selector: {app: fran-edge-app}
  ports:
  - port: 80
    targetPort: 80
