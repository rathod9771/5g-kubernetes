vnfd:
  description: KNF with single KDU using a helm-chart for srsRAN gNB
  df:
  - id: default-df
  ext-cpd:
  - id: mgmt-ext
    k8s-cluster-net: net1
  id: srsran_knf
  k8s-cluster:
    nets:
    - id: net1
  kdu:
