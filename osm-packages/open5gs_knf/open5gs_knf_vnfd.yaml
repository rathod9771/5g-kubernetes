vnfd:
  description: KNF with single KDU using a helm-chart for open5gs 5G core
  df:
  - id: default-df
  ext-cpd:
  - id: mgmt-ext
    k8s-cluster-net: net1
  id: open5gs_knf
  k8s-cluster:
    nets:
    - id: net1
  kdu:
  - name: open5gs
    helm-chart: open5gs
  mgmt-cp: mgmt-ext
  product-name: open5gs_knf
  provider: Amrita5G
  version: '1.0'
