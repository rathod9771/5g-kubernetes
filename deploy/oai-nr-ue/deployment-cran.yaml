# OAI NR UE for the C-RAN CU/DU RFSIM test ONLY. Created at replicas: 0 --
# nothing runs until it is scaled up deliberately.
#
# It uses the private reference subscriber, so the two UE variants must NEVER
# run at the same time: scale oai-nr-ue to 0 (and confirm the
# pod is gone) before scaling this one to 1.
#
# Render with scripts/prepare_simulated_ue.py. Private subscriber settings are
# mounted from a Secret; repository templates contain no subscriber material.
# New: ConfigMap oai-nr-ue-cran-discovery-script (from discover_gnb_cran.py).
# New: ConfigMap oai-nr-ue-cran-init (from ue-init-cran.sh) -- runs the UE with
# the carrier frequency this DU actually expects (-C 3450720000 --ssb 516,
# both values printed by the DU itself); the shared ue-init.sh (-C 3319680000,
# tuned for the monolithic gNB) is not used by this Deployment.
# Applied with `kubectl apply -n <namespace>`; no namespace is set here.
apiVersion: apps/v1
kind: Deployment
metadata:
  name: oai-nr-ue-cran
  labels:
    app: oai-nr-ue-cran
    component: ue-cran
spec:
  replicas: 0
  selector:
    matchLabels:
      app: oai-nr-ue-cran
  template:
    metadata:
      labels:
        app: oai-nr-ue-cran
        component: ue-cran
      annotations:
        sidecar.istio.io/inject: "false"
    spec:
      serviceAccountName: oai-nr-ue
      initContainers:
      - name: discover-gnb
        image: APPROVED_UE_DISCOVERY_IMAGE
        imagePullPolicy: IfNotPresent
        command: ["python3", "/discovery/discover_gnb.py"]
        env:
        - name: TARGET_NAMESPACE
          valueFrom:
            fieldRef:
              fieldPath: metadata.namespace
        - name: OUTPUT_FILE
          value: "/shared/gnb-ip.txt"
        - name: GNB_LABEL_SELECTOR
          value: "app=cran-oai-du"
        volumeMounts:
        - name: discovery-script
          mountPath: /discovery
        - name: shared
          mountPath: /shared
      containers:
      - name: nr-ue
        image: APPROVED_OAI_UE_IMAGE
        imagePullPolicy: IfNotPresent
        securityContext:
          privileged: true
          capabilities:
            add: ["NET_ADMIN"]
        command: ["bash", "/cran-init/ue-init-cran.sh"]
        resources:
          requests:
            cpu: "1"
            memory: "1Gi"
          limits:
            cpu: "2"
            memory: "2Gi"
        volumeMounts:
        - name: ue-config
          mountPath: /opt/oai-nr-ue/etc
        - name: cran-init
          mountPath: /cran-init
          readOnly: true
        - name: shared
          mountPath: /shared
      volumes:
      - name: ue-config
        secret:
          secretName: oai-nr-ue-config
          defaultMode: 0400
      - name: cran-init
        configMap:
          name: oai-nr-ue-cran-init
          defaultMode: 0755
      - name: discovery-script
        configMap:
          name: oai-nr-ue-cran-discovery-script
      - name: shared
        emptyDir: {}
