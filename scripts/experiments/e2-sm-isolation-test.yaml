apiVersion: v1
kind: ConfigMap
metadata:
  name: e2-sm-isolation-test-config
data:
  du-init.sh: |
    #!/bin/bash
    export POD_IP=$(awk 'END{print $1}' /etc/hosts)
    export CU_IP=$(getent hosts oran-oai-cu | awk '{print $1}')
    echo "E2-SM-ISOLATION-TEST: POD_IP=${POD_IP} CU_IP=${CU_IP}"
    mkdir -p /tmp/conf
    sed -e "s|CU_IP|${CU_IP}|g" -e "s|POD_IP|${POD_IP}|g" /opt/oai-gnb/etc/gnb.conf > /tmp/conf/du.conf
    exec /opt/oai-gnb/bin/nr-softmodem -O /tmp/conf/du.conf --rfsim
  gnb.conf: |
    # SPDX-License-Identifier: LicenseRef-CSSL-1.0

    Active_gNBs = ( "du-rfsim-isolation-test");
    Asn1_verbosity = "none";

    gNBs =
    (
     {
        gNB_ID = 0xe01;
        gNB_DU_ID = 0xe01;
        gNB_name  =  "du-rfsim-isolation-test";

        tracking_area_code  =  1;
        plmn_list = ({ mcc = 208; mnc = 93; mnc_length = 2; snssaiList = ({ sst = 1; sd = 0x010203; }) });

        nr_cellid = 12345679L;

        min_rxtxtime = 4;

        servingCellConfigCommon = (
        {
          physCellId                                               = 1;

          absoluteFrequencySSB                                      = 630048;
          dl_frequencyBand                                          = 78;
          dl_absoluteFrequencyPointA                                = 628776;
            dl_offstToCarrier                                       = 0;
            dl_subcarrierSpacing                                    = 1;
            dl_carrierBandwidth                                     = 106;
            initialDLBWPlocationAndBandwidth                         = 28875;
            initialDLBWPsubcarrierSpacing                             = 1;
            initialDLBWPcontrolResourceSetZero                        = 12;
            initialDLBWPsearchSpaceZero                               = 0;

          ul_frequencyBand                                             = 78;
          ul_offstToCarrier                                            = 0;
          ul_subcarrierSpacing                                         = 1;
          ul_carrierBandwidth                                          = 106;
          pMax                                                         = 20;
            initialULBWPlocationAndBandwidth                           = 28875;
            initialULBWPsubcarrierSpacing                              = 1;
              prach_ConfigurationIndex                                 = 98;
              prach_msg1_FDM                                           = 0;
              prach_msg1_FrequencyStart                                = 0;
              zeroCorrelationZoneConfig                                = 13;
              preambleReceivedTargetPower                              = -96;
              preambleTransMax                                         = 6;
            powerRampingStep                                           = 1;
            ssb_perRACH_OccasionAndCB_PreamblesPerSSB_PR               = 4;
            ssb_perRACH_OccasionAndCB_PreamblesPerSSB                  = 14;
            ra_ContentionResolutionTimer                               = 7;
            rsrp_ThresholdSSB                                          = 19;
            prach_RootSequenceIndex_PR                                 = 2;
            prach_RootSequenceIndex                                    = 1;
            msg1_SubcarrierSpacing                                     = 1,
            restrictedSetConfig                                        = 0,

            msg3_DeltaPreamble                                         = 1;
            p0_NominalWithGrant                                        =-90;

            pucchGroupHopping                                          = 0;
            hoppingId                                                  = 40;
            p0_nominal                                                 = -90;

          ssb_PositionsInBurst_Bitmap                                  = 1;

          ssb_periodicityServingCell                                   = 2;

          dmrs_TypeA_Position                                           = 0;

          subcarrierSpacing                                            = 1;

          referenceSubcarrierSpacing                                   = 1;
          dl_UL_TransmissionPeriodicity                                = 6;
          nrofDownlinkSlots                                            = 7;
          nrofDownlinkSymbols                                          = 6;
          nrofUplinkSlots                                              = 2;
          nrofUplinkSymbols                                            = 4;

          ssPBCH_BlockPower                                            = -25;
         }

      );

        SCTP :
        {
            SCTP_INSTREAMS  = 2;
            SCTP_OUTSTREAMS = 2;
        };
      }
    );

    MACRLCs = ({
        tr_s_preference     = "local_L1";
        tr_n_preference     = "f1";
        local_n_address = "POD_IP";
        remote_n_address = "CU_IP";
        local_n_portd = 38472;
        remote_n_portd = 38472;
        pusch_FailureThres  = 1000;
    });

    L1s = ({
        tr_n_preference = "local_mac";
        prach_dtx_threshold = 200;
        pucch0_dtx_threshold = 150;
        ofdm_offset_divisor = 8;
    });
    RUs = ({
        local_rf       = "yes"
        nb_tx          = 1
        nb_rx          = 1
        att_tx         = 0
        att_rx         = 0;
        bands          = [78];
        max_pdschReferenceSignalPower = -27;
        max_rxgain                    = 114;
        eNB_instances  = [0];
        clock_src = "internal";
    });

    rfsimulator =({
      serveraddr = "server";
      serverport = 4043;
      options = ();
      modelname = "AWGN";
      IQfile = "/tmp/rfsimulator.iqs"
    });

    log_config: {
      global_log_level = "info";
      hw_log_level     = "info";
      nr_phy_log_level = "info";
      nr_mac_log_level = "info";
      rlc_log_level    = "info";
      pdcp_log_level   = "info";
      rrc_log_level    = "info";
      f1ap_log_level   = "info";
      ngap_log_level   = "debug";
    };
    e2_agent = {
      near_ric_ip_addr = "10.107.153.48";
      sm_dir = "/tmp/flexric-sm-kpm-rc/";
    };
---
apiVersion: v1
kind: Pod
metadata:
  name: e2-sm-isolation-test
  labels:
    app: e2-sm-isolation-test
    purpose: diagnostic-throwaway
spec:
  restartPolicy: Never
  initContainers:
  - name: copy-kpm-rc-only
    image: oaisoftwarealliance/oai-gnb:2026.w25
    command: ["sh", "-c", "mkdir -p /sm-out && cp /usr/local/lib/flexric/libkpm_sm.so /usr/local/lib/flexric/librc_sm.so /sm-out/ && ls -la /sm-out/"]
    volumeMounts:
    - name: sm-temp
      mountPath: /sm-out
  containers:
  - name: du-test
    image: oaisoftwarealliance/oai-gnb:2026.w25
    command: ["bash", "/opt/oai-gnb/etc/du-init.sh"]
    securityContext:
      privileged: true
    volumeMounts:
    - name: test-config
      mountPath: /opt/oai-gnb/etc
    - name: sm-temp
      mountPath: /tmp/flexric-sm-kpm-rc
  volumes:
  - name: test-config
    configMap:
      name: e2-sm-isolation-test-config
      defaultMode: 0755
  - name: sm-temp
    emptyDir: {}
