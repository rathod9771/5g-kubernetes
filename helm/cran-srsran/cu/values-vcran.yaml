fullname: vcran-srsran-cu
ranType: vcran
# Virtualized CU: keep scheduling requests and CPU isolation.
# Omit hard memory ceilings: pinned srsRAN OOMed at 512Mi, 1Gi and 2Gi
# on Precision despite ample node memory (see docs/vcran-autoscaling.md).
resources:
  requests:
    cpu: "250m"
    memory: "1Gi"
  limits:
    cpu: "500m"
# Optional Kubernetes HPA policy; disabled until Resource Metrics API is available.
# One replica is the safe envelope for the existing stateful F1/NGAP CU.
autoscaling:
  enabled: false
  minReplicas: 1
  maxReplicas: 1
  targetCPUUtilizationPercentage: 70
  # Explicit acknowledgement required for experimental maxReplicas > 1.
  # This flag records operator validation; it does not implement shared CU state.
  stateAwareMultiCUValidated: false
