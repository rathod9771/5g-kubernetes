{{- $autoscaling := .Values.autoscaling | default dict }}
{{- if and (eq .Values.ranType "vcran") ($autoscaling.enabled | default false) }}
{{- if or (lt (int $autoscaling.minReplicas) 1) (lt (int $autoscaling.maxReplicas) (int $autoscaling.minReplicas)) }}
{{- fail "vC-RAN autoscaling requires 1 <= minReplicas <= maxReplicas" }}
{{- end }}
{{- if and (gt (int $autoscaling.maxReplicas) 1) (ne ($autoscaling.stateAwareMultiCUValidated | toJson) "true") }}
{{- fail "vC-RAN multi-CU scaling requires explicit stateAwareMultiCUValidated acknowledgement" }}
{{- end }}
{{- if or (lt (int $autoscaling.targetCPUUtilizationPercentage) 1) (gt (int $autoscaling.targetCPUUtilizationPercentage) 100) }}
{{- fail "vC-RAN CPU utilization target must be between 1 and 100" }}
{{- end }}
apiVersion: autoscaling/v2
kind: HorizontalPodAutoscaler
metadata:
  name: {{ .Values.fullname }}
  labels:
    ran-type: vcran
    component: cu
spec:
  scaleTargetRef:
    apiVersion: apps/v1
    kind: Deployment
    name: {{ .Values.fullname }}
  minReplicas: {{ $autoscaling.minReplicas }}
  maxReplicas: {{ $autoscaling.maxReplicas }}
  metrics:
    - type: Resource
      resource:
        name: cpu
        target:
          type: Utilization
          averageUtilization: {{ $autoscaling.targetCPUUtilizationPercentage }}
  behavior:
    scaleUp:
      stabilizationWindowSeconds: 30
    scaleDown:
      stabilizationWindowSeconds: 120
{{- end }}
