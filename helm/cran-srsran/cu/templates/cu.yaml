apiVersion: v1
kind: ConfigMap
metadata:
  name: {{ .Values.fullname }}-config
data:
  cu-init.sh: |
    #!/bin/bash
    export POD_IP=$(awk 'END{print $1}' /etc/hosts)
    export AMF_IP=$(getent hosts {{ .Values.amf.address }} | awk '{print $1}')
    echo "C-RAN CU starting: POD_IP=${POD_IP} AMF_IP=${AMF_IP}"
    mkdir -p /etc/srsran
    sed -e "s|AMF_IP|${AMF_IP}|g" -e "s|POD_IP|${POD_IP}|g" /mnt/srsran/cu.yml > /etc/srsran/cu.yml
    exec srscu -c /etc/srsran/cu.yml
  cu.yml: |
    cu_cp:
      f1ap:
        bind_addr: POD_IP
      amf:
        addr: AMF_IP
        bind_addr: POD_IP
        supported_tracking_areas:
          - tac: 1
            plmn_list:
              - plmn: "20893"
                tai_slice_support_list:
                  - sst: 1
                    sd: 66051
    log:
      filename: /tmp/cu.log
      all_level: warning
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ .Values.fullname }}
  labels:
    app: {{ .Values.fullname }}
    ran-type: {{ .Values.ranType | default "cran" }}
    component: cu
spec:
  replicas: 1
  selector:
    matchLabels:
      app: {{ .Values.fullname }}
  template:
    metadata:
      labels:
        app: {{ .Values.fullname }}
        ran-type: {{ .Values.ranType | default "cran" }}
        component: cu
      annotations:
        sidecar.istio.io/inject: "false"
    spec:
      containers:
      - name: cu
        image: {{ required "Supply approved image values with scripts/runtime_images.py" .Values.image.reference | quote }}
        imagePullPolicy: {{ .Values.image.pullPolicy }}
        securityContext:
          privileged: true
        {{- with .Values.resources }}
        resources:
          {{- toYaml . | nindent 10 }}
        {{- end }}
        command: ["bash", "/mnt/srsran/cu-init.sh"]
        volumeMounts:
        - name: cu-config
          mountPath: /mnt/srsran
      volumes:
      - name: cu-config
        configMap:
          name: {{ .Values.fullname }}-config
          defaultMode: 0755
---
apiVersion: v1
kind: Service
metadata:
  name: {{ .Values.fullname }}
spec:
  selector:
    app: {{ .Values.fullname }}
  ports:
  - name: ngap
    port: 38412
    targetPort: 38412
    protocol: SCTP
  - name: f1c
    port: 38472
    targetPort: 38472
    protocol: SCTP
