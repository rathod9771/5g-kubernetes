image:
  repository: oaisoftwarealliance/oai-gnb
  tag: 2026.w25
  pullPolicy: IfNotPresent

du:
  mcc: "208"
  mnc: "93"
  tac: 1
  plmn: "20893"
  cu:
    address: "cran-oai-cu"
    port: 38472

network:
  masterIf: enp3s0

ran:
  type: cran
  component: du

# RF backend selection. rfsim is the safe default (no hardware
# assumptions). usrp requires a physically attached, host-visible
# USRP and has NOT been validated end-to-end in this repository.
rf:
  mode: rfsim

  # Only used when rf.mode=usrp. Deliberately no real serial number
  # committed here -- supply it via values-usrp.yaml or --set.
  usrp:
    args: "type=b200,serial=XXXXXXXX"
    clockSource: internal
    timeSource: internal
