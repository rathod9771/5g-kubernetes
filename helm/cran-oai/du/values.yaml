# Image identity is supplied by config/reference-versions.json.
image: {}

du:
  mcc: "208"
  mnc: "93"
  tac: 1
  plmn: "20893"
  cu:
    address: "cran-oai-cu"
    port: 38472

network:
  masterIf: "" # Unused by hostNetwork/RFSIM; external Multus must supply an interface.

ran:
  type: cran
  component: du

# RF backend selection. rfsim is the safe default (no hardware
# assumptions). usrp requires a physically attached, host-visible
# USRP and has NOT been validated end-to-end in this repository.
rf:
  mode: rfsim

  # Only used when rf.mode=usrp. Deliberately no real serial number
  # committed here -- supply it via values-usrp.yaml or --set.
  usrp:
    args: "type=b200,serial=XXXXXXXX"
    clockSource: internal
    timeSource: internal

# Deployment identity. Defaults preserve exact current C-RAN behavior.
# cuFullname must match the CU's own fullname so this DU's F1-C getent
# lookup resolves the correct Service.
fullname: cran-oai-du
cuFullname: cran-oai-cu
ranType: cran
