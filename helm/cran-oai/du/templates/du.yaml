apiVersion: v1
kind: ConfigMap
metadata:
  name: {{ .Values.fullname }}-config
data:
  du-init.sh: |
    #!/bin/bash
    export POD_IP=$(awk 'END{print $1}' /etc/hosts)
    export CU_IP=$(getent hosts {{ .Values.cuFullname }} | awk '{print $1}')
    echo "OAI DU (C-RAN, rf.mode={{ .Values.rf.mode }}): POD_IP=${POD_IP} CU_IP=${CU_IP}"
    mkdir -p /tmp/conf
    sed -e "s|CU_IP|${CU_IP}|g" -e "s|POD_IP|${POD_IP}|g" /opt/oai-gnb/etc/gnb.conf > /tmp/conf/du.conf
{{- if eq .Values.rf.mode "rfsim" }}
    exec /opt/oai-gnb/bin/nr-softmodem -O /tmp/conf/du.conf --rfsim
{{- else if eq .Values.rf.mode "usrp" }}
    exec /opt/oai-gnb/bin/nr-softmodem -O /tmp/conf/du.conf
{{- else }}
{{- fail "rf.mode must be either rfsim or usrp" }}
{{- end }}
  gnb.conf: |
    # SPDX-License-Identifier: LicenseRef-CSSL-1.0

    Active_gNBs = ( "du-rfsim");
    Asn1_verbosity = "none";

    gNBs =
    (
     {
        gNB_ID = 0xe00;
        gNB_DU_ID = 0xe00;
        gNB_name  =  "du-rfsim";

        tracking_area_code  =  1;
        plmn_list = ({ mcc = 208; mnc = 93; mnc_length = 2; snssaiList = ({ sst = 1; sd = 0x010203; }) });

        nr_cellid = 12345678L;

        min_rxtxtime = 4;

        servingCellConfigCommon = (
        {
          physCellId                                               = 0;

          absoluteFrequencySSB                                      = 630048;
          dl_frequencyBand                                          = 78;
          dl_absoluteFrequencyPointA                                = 628776;
            dl_offstToCarrier                                       = 0;
            dl_subcarrierSpacing                                    = 1;
            dl_carrierBandwidth                                     = 106;
            initialDLBWPlocationAndBandwidth                         = 28875;
            initialDLBWPsubcarrierSpacing                             = 1;
            initialDLBWPcontrolResourceSetZero                        = 12;
            initialDLBWPsearchSpaceZero                               = 0;

          ul_frequencyBand                                             = 78;
          ul_offstToCarrier                                            = 0;
          ul_subcarrierSpacing                                         = 1;
          ul_carrierBandwidth                                          = 106;
          pMax                                                         = 20;
            initialULBWPlocationAndBandwidth                           = 28875;
            initialULBWPsubcarrierSpacing                              = 1;
              prach_ConfigurationIndex                                 = 98;
              prach_msg1_FDM                                           = 0;
              prach_msg1_FrequencyStart                                = 0;
              zeroCorrelationZoneConfig                                = 13;
              preambleReceivedTargetPower                              = -96;
              preambleTransMax                                         = 6;
            powerRampingStep                                           = 1;
            ssb_perRACH_OccasionAndCB_PreamblesPerSSB_PR               = 4;
            ssb_perRACH_OccasionAndCB_PreamblesPerSSB                  = 14;
            ra_ContentionResolutionTimer                               = 7;
            rsrp_ThresholdSSB                                          = 19;
            prach_RootSequenceIndex_PR                                 = 2;
            prach_RootSequenceIndex                                    = 1;
            msg1_SubcarrierSpacing                                     = 1,
            restrictedSetConfig                                        = 0,

            msg3_DeltaPreamble                                         = 1;
            p0_NominalWithGrant                                        =-90;

            pucchGroupHopping                                          = 0;
            hoppingId                                                  = 40;
            p0_nominal                                                 = -90;

          ssb_PositionsInBurst_Bitmap                                  = 1;

          ssb_periodicityServingCell                                   = 2;

          dmrs_TypeA_Position                                           = 0;

          subcarrierSpacing                                            = 1;

          referenceSubcarrierSpacing                                   = 1;
          dl_UL_TransmissionPeriodicity                                = 6;
          nrofDownlinkSlots                                            = 7;
          nrofDownlinkSymbols                                          = 6;
          nrofUplinkSlots                                              = 2;
          nrofUplinkSymbols                                            = 4;

          ssPBCH_BlockPower                                            = -25;
         }

      );

        SCTP :
        {
            SCTP_INSTREAMS  = 2;
            SCTP_OUTSTREAMS = 2;
        };
      }
    );

    MACRLCs = ({
        tr_s_preference     = "local_L1";
        tr_n_preference     = "f1";
        local_n_address = "POD_IP";
        remote_n_address = "CU_IP";
        local_n_portd = 38472;
        remote_n_portd = 38472;
        pusch_FailureThres  = 1000;
    });

    L1s = ({
        tr_n_preference = "local_mac";
        prach_dtx_threshold = 200;
        pucch0_dtx_threshold = 150;
        ofdm_offset_divisor = 8;
    });

{{- if eq .Values.rf.mode "rfsim" }}
    RUs = ({
        local_rf       = "yes"
        nb_tx          = 1
        nb_rx          = 1
        att_tx         = 0
        att_rx         = 0;
        bands          = [78];
        max_pdschReferenceSignalPower = -27;
        max_rxgain                    = 114;
        eNB_instances  = [0];
        clock_src = "internal";
    });

    rfsimulator =({
      serveraddr = "server";
      serverport = 4043;
      options = ();
      modelname = "AWGN";
      IQfile = "/tmp/rfsimulator.iqs"
    });
{{- else if eq .Values.rf.mode "usrp" }}
    # Verified syntax per OAI's own official radio/USRP/README.md:
    # clock_source/time_source are NOT separate RUs keys -- they are
    # comma-separated parameters embedded inside the sdr_addrs string
    # itself, alongside the device identifier (serial=... for a
    # USB-attached B210, rather than addr=... used by network-attached
    # N3xx/X3xx devices).
    RUs = ({
        local_rf       = "yes"
        nb_tx          = 1
        nb_rx          = 1
        att_tx         = 0
        att_rx         = 0;
        bands          = [78];
        max_pdschReferenceSignalPower = -27;
        max_rxgain                    = 114;
        eNB_instances  = [0];
        sdr_addrs = "{{ .Values.rf.usrp.args }},clock_source={{ .Values.rf.usrp.clockSource }},time_source={{ .Values.rf.usrp.timeSource }}"
    });
{{- else }}
{{- fail "rf.mode must be either rfsim or usrp" }}
{{- end }}

    log_config: {
      global_log_level = "info";
      hw_log_level     = "info";
      nr_phy_log_level = "info";
      nr_mac_log_level = "info";
      rlc_log_level    = "info";
      pdcp_log_level   = "info";
      rrc_log_level    = "info";
      f1ap_log_level   = "info";
      ngap_log_level   = "debug";
    };

---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ .Values.fullname }}
  labels:
    app: {{ .Values.fullname }}
    ran-type: {{ .Values.ranType | default "cran" }}
    component: du
    rf-mode: {{ .Values.rf.mode }}
spec:
  replicas: 1
  selector:
    matchLabels:
      app: {{ .Values.fullname }}
  template:
    metadata:
      labels:
        app: {{ .Values.fullname }}
        ran-type: {{ .Values.ranType | default "cran" }}
        component: du
        rf-mode: {{ .Values.rf.mode }}
      annotations:
        sidecar.istio.io/inject: "false"
    spec:
      containers:
      - name: du
        image: {{ .Values.image.repository }}:{{ .Values.image.tag }}
        imagePullPolicy: {{ .Values.image.pullPolicy }}
        securityContext:
          privileged: true
        {{- with .Values.resources }}
        resources:
          {{- toYaml . | nindent 10 }}
        {{- end }}
{{- if eq .Values.rf.mode "usrp" }}
        volumeMounts:
        - name: du-config
          mountPath: /opt/oai-gnb/etc
        - name: usb-bus
          mountPath: /dev/bus/usb
{{- else }}
        volumeMounts:
        - name: du-config
          mountPath: /opt/oai-gnb/etc
{{- end }}
        command: ["bash", "/opt/oai-gnb/etc/du-init.sh"]
      volumes:
      - name: du-config
        configMap:
          name: {{ .Values.fullname }}-config
          defaultMode: 0755
{{- if eq .Values.rf.mode "usrp" }}
      - name: usb-bus
        hostPath:
          path: /dev/bus/usb
{{- end }}
---
apiVersion: v1
kind: Service
metadata:
  name: {{ .Values.fullname }}
spec:
  selector:
    app: {{ .Values.fullname }}
  ports:
  - name: f1
    port: 38472
    targetPort: 38472
    protocol: SCTP
