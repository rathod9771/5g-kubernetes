image:
  repository: oaisoftwarealliance/oai-gnb
  tag: 2026.w13
  pullPolicy: IfNotPresent

cu:
  mcc: "208"
  mnc: "93"
  tac: 1
  plmn: "20893"
  amf:
    address: "" # Unused: startup resolves the top-level amf.address Service.
    port: 38412
  f1:
    port: 38472

network:
  masterIf: "" # Unused by hostNetwork/RFSIM; external Multus must supply an interface.

ran:
  type: cran
  component: cu

configRevision: 1

# Name the CU resolves at startup to find the Open5GS AMF's NGAP endpoint.
# This is the stable Service the working srsRAN CU also uses; the
# OSM-generated name (open5gs-<release-id>-amf-ngap) is not used because
# the release id in the middle of it changes on every core redeploy.
amf:
  address: "amf-ngap-stable"

# Deployment identity. Defaults preserve exact current C-RAN behavior;
# a profile values file (e.g. values-cloudran.yaml) overrides these to
# produce a differently-named deployment from this SAME chart, per the
# "same CU/DU implementation, different deployment profile" principle.
fullname: cran-oai-cu
ranType: cran
