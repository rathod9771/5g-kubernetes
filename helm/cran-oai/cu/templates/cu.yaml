{{- /* H-CRAN deliberately excludes E2/near-RT RIC. Other RAN scenarios unaffected. */ -}}
{{- if eq (.Values.ranType | default "cran") "hcran" -}}
{{- $e2 := .Values.e2Agent | default dict -}}
{{- $ric := .Values.ric | default dict -}}
{{- $legacyE2 := .Values.e2 | default dict -}}
{{- if or ($e2.enabled | default false) ($ric.enabled | default false) ($legacyE2.enabled | default false) -}}
{{- fail "H-CRAN 3GPP profile refuses Near-RT RIC/E2 agent; monitor with Prometheus/Grafana" -}}
{{- end -}}
{{- end -}}
{{- /* Optional secure staging candidate: preserve the prior RFSIM baseline when not selected. */ -}}
{{- $radioSecurity := .Values.radioSecurity | default dict -}}
{{- $ciphers := $radioSecurity.cipheringAlgorithms | default (list "nea0") -}}
{{- $integrities := $radioSecurity.integrityAlgorithms | default (list "nia2" "nia0") -}}
{{- if and (eq (.Values.ranType | default "cran") "hcran") ($radioSecurity.hardenedCandidate | default false) -}}
{{- if or (ne (len $ciphers) 1) (ne (first $ciphers) "nea2") (ne (len $integrities) 1) (ne (first $integrities) "nia2") -}}
{{- fail "H-CRAN secure staging candidate requires only NEA2 ciphering and NIA2 integrity; no NEA0 or NIA0" -}}
{{- end -}}
{{- end -}}
{{- /* Pod least-privilege is a disposable staging candidate, never assumed production-ready. */ -}}
{{- $podSec := .Values.containerSecurityContext | default dict -}}
{{- if and (eq (.Values.ranType | default "cran") "hcran") (.Values.securePodCandidate | default false) -}}
{{- if or (not (hasKey $podSec "privileged")) ($podSec.privileged | default false) -}}
{{- fail "H-CRAN Pod security staging candidate requires explicit privileged=false" -}}
{{- end -}}
{{- end -}}
apiVersion: v1
kind: ConfigMap
metadata:
  name: {{ .Values.fullname }}-config
data:
  cu-init.sh: |
    #!/bin/bash
    export POD_IP=$(awk 'END{print $1}' /etc/hosts)
{{- if .Values.experimentalTransport }}
    # OSM may install KDUs concurrently; resolve dependencies before starting.
    deadline=$((SECONDS + 120))
    while :; do
      AMF_IP=$(timeout 5 getent ahostsv4 {{ .Values.amf.address }} | awk 'NR==1{print $1}')
      [ -n "${AMF_IP}" ] && break
      if [ "$SECONDS" -ge "$deadline" ]; then
        echo "Dependency discovery failed: {{ .Values.amf.address }}" >&2
        exit 1
      fi
      sleep 1
    done
    export AMF_IP
{{- else }}
    export AMF_IP=$(getent hosts {{ .Values.amf.address }} | awk '{print $1}')
{{- end }}
    echo "OAI CU (C-RAN): POD_IP=${POD_IP} AMF_IP=${AMF_IP}"
    mkdir -p /tmp/conf
    sed -e "s|AMF_IP|${AMF_IP}|g" -e "s|POD_IP|${POD_IP}|g" /opt/oai-gnb/etc/gnb.conf > /tmp/conf/cu.conf
    exec /opt/oai-gnb/bin/nr-softmodem -O /tmp/conf/cu.conf
  gnb.conf: |
    # SPDX-License-Identifier: LicenseRef-CSSL-1.0

    Active_gNBs = ( "cu-rfsim");
    Asn1_verbosity = "none";

    gNBs =
    (
     {
        gNB_ID = {{ if .Values.radio }}{{ .Values.radio.gnbId | int64 }}{{ else }}0xe00{{ end }};
        gNB_name  =  "cu-rfsim";

        tracking_area_code  =  1;
        plmn_list = ({ mcc = 208; mnc = 93; mnc_length = 2; snssaiList = ({ sst = 1; sd = 0x010203; }) });

        nr_cellid = {{ if .Values.radio }}{{ .Values.radio.cellId | int64 }}{{ else }}12345678{{ end }}L;

        tr_s_preference = "f1";

        local_s_address = "POD_IP";
        remote_s_address = "0.0.0.0"; # multiple DUs
        local_s_portd = 38472;
        remote_s_portd = 38472;

        SCTP :
        {
            SCTP_INSTREAMS  = 2;
            SCTP_OUTSTREAMS = 2;
        };

        amf_ip_address = ({ ipv4 = "AMF_IP"; });

        NETWORK_INTERFACES :
        {
            GNB_IPV4_ADDRESS_FOR_NG_AMF = "POD_IP";
            GNB_IPV4_ADDRESS_FOR_NGU = "POD_IP";
            GNB_PORT_FOR_S1U = 2152
        };
      }
    );

    security = {
      ciphering_algorithms = ( {{- range $i, $alg := $ciphers }}{{ if $i }}, {{ end }}"{{ $alg }}"{{ end }} );
      integrity_algorithms = ( {{- range $i, $alg := $integrities }}{{ if $i }}, {{ end }}"{{ $alg }}"{{ end }} );
      drb_ciphering = "yes";
      drb_integrity = "no"; # UP integrity requires separate support and policy validation
    };

    log_config : {
      global_log_level = "info";
      pdcp_log_level = "info";
      rrc_log_level = "info";
      f1ap_log_level = "info";
      ngap_log_level = "info";
    };

---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ .Values.fullname }}
  labels:
    app: {{ .Values.fullname }}
    ran-type: {{ .Values.ranType | default "cran" }}
    component: cu
spec:
  replicas: {{ if hasKey .Values "replicaCount" }}{{ .Values.replicaCount }}{{ else }}1{{ end }}
  selector:
    matchLabels:
      app: {{ .Values.fullname }}
  template:
    metadata:
      labels:
        app: {{ .Values.fullname }}
        ran-type: {{ .Values.ranType | default "cran" }}
        component: cu
      annotations:
        sidecar.istio.io/inject: "false"
        checksum/config: "r{{ .Values.configRevision | default 1 }}-{{ toYaml .Values | sha256sum | trunc 8 }}"
    spec:
      {{- with .Values.nodeSelector }}
      nodeSelector:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      {{- with .Values.affinity }}
      affinity:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      {{- with .Values.tolerations }}
      tolerations:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      containers:
      - name: cu
        image: {{ required "Supply approved image values with scripts/runtime_images.py" .Values.image.reference | quote }}
        imagePullPolicy: {{ .Values.image.pullPolicy }}
        securityContext:
{{- with .Values.containerSecurityContext }}
{{- toYaml . | nindent 10 }}
{{- else }}
          privileged: true
{{- end }}
        {{- with .Values.resources }}
        resources:
          {{- toYaml . | nindent 10 }}
        {{- end }}
        command: ["bash", "/opt/oai-gnb/etc/cu-init.sh"]
        volumeMounts:
        - name: cu-config
          mountPath: /opt/oai-gnb/etc
      volumes:
      - name: cu-config
        configMap:
          name: {{ .Values.fullname }}-config
          defaultMode: 0755
---
apiVersion: v1
kind: Service
metadata:
  name: {{ .Values.fullname }}
spec:
  selector:
    app: {{ .Values.fullname }}
  ports:
  - name: ngap
    port: 38412
    targetPort: 38412
    protocol: SCTP
  - name: f1
    port: 38472
    targetPort: 38472
    protocol: SCTP
  - name: gtp
    port: 2152
    targetPort: 2152
    protocol: UDP
{{- if .Values.experimentalTransport }}
  - name: f1u
    port: 38472
    targetPort: 38472
    protocol: UDP
{{- end }}
