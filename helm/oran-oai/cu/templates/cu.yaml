{{- if .Values.e2.enabled }}
{{- $address := required "E2 requires the actual FlexRIC Service IPv4 address" .Values.e2.ricAddress }}
{{- if not (regexMatch "^([0-9]{1,3}\\.){3}[0-9]{1,3}$" $address) }}
{{- fail "e2.ricAddress must be a FlexRIC Service IPv4 address, not DNS" }}
{{- end }}
{{- range splitList "." $address }}
{{- if or (gt (int .) 255) (and (gt (len .) 1) (hasPrefix "0" .)) }}
{{- fail "e2.ricAddress must contain valid IPv4 octets" }}
{{- end }}
{{- end }}
{{- end }}
apiVersion: v1
kind: ConfigMap
metadata:
  name: oran-oai-cu-config
data:
  cu-init.sh: |
    #!/bin/bash
    export POD_IP=$(awk 'END{print $1}' /etc/hosts)
    export AMF_IP=$(getent hosts {{ .Values.amf.address }} | awk '{print $1}')
    echo "OAI CU (O-RAN): POD_IP=${POD_IP} AMF_IP=${AMF_IP}"
    mkdir -p /tmp/conf
    sed -e "s|AMF_IP|${AMF_IP}|g" -e "s|POD_IP|${POD_IP}|g" /opt/oai-gnb/etc/gnb.conf > /tmp/conf/cu.conf
    exec /opt/oai-gnb/bin/nr-softmodem -O /tmp/conf/cu.conf
  gnb.conf: |
    # SPDX-License-Identifier: LicenseRef-CSSL-1.0

    Active_gNBs = ( "cu-rfsim");
    Asn1_verbosity = "none";

    gNBs =
    (
     {
        gNB_ID = 0xe00;
        gNB_name  =  "cu-rfsim";

        tracking_area_code  =  1;
        plmn_list = ({ mcc = 208; mnc = 93; mnc_length = 2; snssaiList = ({ sst = 1; sd = 0x010203; }) });

        nr_cellid = 12345678L;

        tr_s_preference = "f1";

        local_s_address = "POD_IP";
        remote_s_address = "0.0.0.0"; # multiple DUs
        local_s_portd = 38472;
        remote_s_portd = 38472;

        SCTP :
        {
            SCTP_INSTREAMS  = 2;
            SCTP_OUTSTREAMS = 2;
        };

        amf_ip_address = ({ ipv4 = "AMF_IP"; });

        NETWORK_INTERFACES :
        {
            GNB_IPV4_ADDRESS_FOR_NG_AMF = "POD_IP";
            GNB_IPV4_ADDRESS_FOR_NGU = "POD_IP";
            GNB_PORT_FOR_S1U = 2152
        };
      }
    );

    security = {
      ciphering_algorithms = ( "nea0" );
      integrity_algorithms = ( "nia2", "nia0" );
      drb_ciphering = "yes";
      drb_integrity = "no";
    };

    log_config : {
      global_log_level = "info";
      pdcp_log_level = "info";
      rrc_log_level = "info";
      f1ap_log_level = "info";
      ngap_log_level = "info";
    };

{{- if .Values.e2.enabled }}
    e2_agent = {
      near_ric_ip_addr = "{{ .Values.e2.ricAddress }}";
      sm_dir = "/tmp/flexric-sm-kpm-rc/";
    };
{{- end }}

---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: oran-oai-cu
  labels:
    app: oran-oai-cu
    ran-type: oran
    component: cu
spec:
  replicas: 1
  selector:
    matchLabels:
      app: oran-oai-cu
  template:
    metadata:
      labels:
        app: oran-oai-cu
        ran-type: oran
        component: cu
      annotations:
        sidecar.istio.io/inject: "false"
        checksum/config: "r{{ .Values.configRevision | default 1 }}-{{ toYaml .Values | sha256sum | trunc 8 }}"
    spec:
{{- if .Values.e2.enabled }}
      initContainers:
      - name: copy-kpm-rc-only
        image: {{ required "Supply approved image values with scripts/runtime_images.py" .Values.image.reference | quote }}
        imagePullPolicy: {{ .Values.image.pullPolicy }}
        command: ["sh", "-ec", "cp /usr/local/lib/flexric/libkpm_sm.so /usr/local/lib/flexric/librc_sm.so /sm-out/"]
        volumeMounts:
        - name: e2-sm
          mountPath: /sm-out
{{- end }}
      containers:
      - name: cu
        image: {{ required "Supply approved image values with scripts/runtime_images.py" .Values.image.reference | quote }}
        imagePullPolicy: {{ .Values.image.pullPolicy }}
        securityContext:
          privileged: true
        {{- with .Values.resources }}
        resources:
          {{- toYaml . | nindent 10 }}
        {{- end }}
        command: ["bash", "/opt/oai-gnb/etc/cu-init.sh"]
        volumeMounts:
        - name: cu-config
          mountPath: /opt/oai-gnb/etc
{{- if .Values.e2.enabled }}
        - name: e2-sm
          mountPath: /tmp/flexric-sm-kpm-rc
          readOnly: true
{{- end }}
      volumes:
      - name: cu-config
        configMap:
          name: oran-oai-cu-config
          defaultMode: 0755
{{- if .Values.e2.enabled }}
      - name: e2-sm
        emptyDir: {}
{{- end }}
---
apiVersion: v1
kind: Service
metadata:
  name: oran-oai-cu
spec:
  selector:
    app: oran-oai-cu
  ports:
  - name: ngap
    port: 38412
    targetPort: 38412
    protocol: SCTP
  - name: f1
    port: 38472
    targetPort: 38472
    protocol: SCTP
  - name: gtp
    port: 2152
    targetPort: 2152
    protocol: UDP
