# Image identity is supplied by config/reference-versions.json.
image: {}

identity:
  gnbId: "0xe00"
  duId: "0xe00"
  nrCellId: 12345678
  physCellId: 0

du:
  mcc: "208"
  mnc: "93"
  tac: 1
  plmn: "20893"
  cu:
    address: "oran-oai-cu"
    port: 38472

network:
  masterIf: enp3s0

ran:
  type: oran
  component: du

rf:
  mode: rfsim
  usrp:
    args: "type=b200,serial=XXXXXXXX"
    clockSource: internal
    timeSource: internal

e2:
  enabled: false
  ricAddress: ""

# F1 discovery must follow the canonical CU Service.
cuFullname: oran-oai-cu
