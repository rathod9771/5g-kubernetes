dbURI: "mongodb://open5gs-mongo-custom:27017/open5gs"

populate:
  enabled: true
  image:
    registry: docker.io
    repository: gradiant/open5gs-dbctl
    tag: 0.10.3
    pullPolicy: IfNotPresent
  initCommands: []

# Using our own MongoDB StatefulSet (Bitnami tags are broken on Docker Hub)
mongodb:
  enabled: false

smf:
  enabled: true
  config:
    info:
      - s_nssai:
          - sst: 1
            sd: "010203"
            dnn:
              - internet
              - ims
              - edge
          - sst: 1
            dnn:
              - internet
              - ims
              - edge
    subnetList:
      - subnet: 10.45.0.0/16
        gateway: 10.45.0.1
        dnn: internet
      - subnet: 10.46.0.0/16
        gateway: 10.46.0.1
        dnn: ims
      - subnet: 10.47.0.0/16
        gateway: 10.47.0.1
        dnn: edge
    pcscfList:
      - 10.99.99.99
    pcrf:
      enabled: false
    sbi:
      client:
        nrf:
          enabled: true
        scp:
          enabled: false
  dbURI: "mongodb://open5gs-mongo-custom:27017/open5gs"
upf:
  enabled: true
  config:
    subnetList:
      - subnet: 10.45.0.0/16
        gateway: 10.45.0.1
        dnn: internet
        dev: ogstun
        mask: 16
        createDev: true
        enableNAT: true
      - subnet: 10.46.0.0/16
        gateway: 10.46.0.1
        dnn: ims
        dev: ogstun2
        mask: 16
        createDev: true
        enableNAT: true
      - subnet: 10.47.0.0/16
        gateway: 10.47.0.1
        dnn: edge
        dev: ogstun3
        mask: 16
        createDev: true
        enableNAT: false
webui:
  enabled: true
  dbURI: "mongodb://open5gs-mongo-custom:27017/open5gs"
  mongodb:
    enabled: false

# 4G disabled - 5G SA only
hss:
  enabled: false
mme:
  enabled: false
pcrf:
  enabled: false
sgwc:
  enabled: false
sgwu:
  enabled: false

# 5G NFs
amf:
  enabled: true
  config:
    sbi:
      client:
        nrf:
          enabled: true
        scp:
          enabled: false
    guamiList:
      - plmn_id:
          mcc: "208"
          mnc: "93"
        amf_id:
          region: 2
          set: 1
      - plmn_id:
          mcc: "001"
          mnc: "01"
        amf_id:
          region: 2
          set: 1
    taiList:
      - plmn_id:
          mcc: "208"
          mnc: "93"
        tac: [1]
      - plmn_id:
          mcc: "001"
          mnc: "01"
        tac: [1]
    plmnList:
      - plmn_id:
          mcc: "208"
          mnc: "93"
        s_nssai:
          - sst: 1
            sd: "010203"
      - plmn_id:
          mcc: "001"
          mnc: "01"
        s_nssai:
          - sst: 1
          - sst: 1
            sd: "010203"
ausf:
  enabled: true
  customOpen5gsConfig:
    logger:
      level: info
    global: {}
    ausf:
      serving:
        - plmn_id:
            mcc: "208"
            mnc: "93"
        - plmn_id:
            mcc: "001"
            mnc: "01"
      sbi:
        server:
          - dev: eth0
            port: 7777
        client:
          nrf:
            - uri: http://open5gs-nrf-sbi:7777
bsf:
  enabled: true
  config:
    sbi:
      client:
        nrf:
          enabled: true
        scp:
          enabled: false
nrf:
  enabled: true
nssf:
  enabled: true
  config:
    sbi:
      client:
        nrf:
          enabled: true
        scp:
          enabled: false
    nsiList:
      - addr: nrf
        sst: 1
        sd: "010203"
      - addr: nrf
        sst: 1
pcf:
  enabled: true
  config:
    sbi:
      client:
        nrf:
          enabled: true
        scp:
          enabled: false
  dbURI: "mongodb://open5gs-mongo-custom:27017/open5gs"
  mongodb:
    enabled: false
scp:
  enabled: false
udm:
  enabled: true
  customOpen5gsConfig:
    logger:
      level: info
    global: {}
    udm:
      serving:
        - plmn_id:
            mcc: "208"
            mnc: "93"
        - plmn_id:
            mcc: "001"
            mnc: "01"
      sbi:
        server:
          - dev: eth0
            port: 7777
        client:
          nrf:
            - uri: http://open5gs-nrf-sbi:7777
udr:
  enabled: true
  customOpen5gsConfig:
    logger:
      level: info
    global: {}
    udr:
      serving:
        - plmn_id:
            mcc: "208"
            mnc: "93"
        - plmn_id:
            mcc: "001"
            mnc: "01"
      sbi:
        server:
          - dev: eth0
            port: 7777
        client:
          nrf:
            - uri: http://open5gs-nrf-sbi:7777
  dbURI: "mongodb://open5gs-mongo-custom:27017/open5gs"
  mongodb:
    enabled: false
