<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>NovaThinkTech Intelli5G Dashboard</title>
<style>
*{box-sizing:border-box;margin:0;padding:0}
body{font-family:sans-serif;background:#080812;color:#fff;height:100vh;display:flex;flex-direction:column;overflow:hidden}
.topbar{display:flex;align-items:center;justify-content:space-between;padding:8px 16px;background:#0f0f1e;border-bottom:1px solid #1e1e3a;flex-shrink:0}
.topbar h1{font-size:13px;font-weight:700;color:#00d4ff;letter-spacing:1px}
.top-btns{display:flex;gap:8px}
.top-btn{padding:5px 16px;border-radius:6px;border:1px solid #2a2a4a;background:transparent;color:#888;font-size:11px;cursor:pointer;transition:all 0.15s;font-weight:600}
.top-btn:hover{border-color:#00d4ff;color:#00d4ff}
.top-btn.active{background:#001a2e;border-color:#00d4ff;color:#00d4ff}
.top-btn.purple:hover{border-color:#a855f7;color:#a855f7}
.top-btn.purple.active{background:#1a0a2e;border-color:#a855f7;color:#a855f7}
.layout{display:flex;flex:1;overflow:hidden}
.sidebar{width:155px;background:#0f0f1e;border-right:1px solid #1e1e3a;display:flex;flex-direction:column;flex-shrink:0;overflow-y:auto;padding:10px 8px}
.sb-title{font-size:9px;font-weight:700;color:#444;text-transform:uppercase;letter-spacing:1px;margin-bottom:8px;padding:0 2px}
.ran-card{background:#13132a;border:1px solid #1e1e3a;border-radius:8px;padding:8px;margin-bottom:6px;transition:all 0.15s}
.ran-card.disabled{opacity:0.35}
.ran-top{display:flex;align-items:center;justify-content:space-between;margin-bottom:3px}
.ran-name{font-size:11px;font-weight:700;color:#ccc;display:flex;align-items:center;gap:4px}
.ran-card.deployed .ran-name{color:#00d4ff}
.ran-type{font-size:9px;color:#444;margin-bottom:6px}
.ran-badge{font-size:8px;padding:1px 5px;border-radius:10px}
.badge-live{background:#0a2a1a;color:#00ff88;border:1px solid #00ff8844}
.badge-soon{background:#1a1a1a;color:#333;border:1px solid #222}
.deploy-btn{width:100%;padding:5px 0;border-radius:5px;border:1px solid #2a2a4a;background:transparent;color:#888;font-size:10px;cursor:pointer;transition:all 0.15s;font-weight:600}
.deploy-btn:hover:not(:disabled){border-color:#00d4ff;color:#00d4ff;background:#001a2e}
.deploy-btn.deploying{border-color:#ffaa00;color:#ffaa00;animation:blink 1s infinite}
.deploy-btn.deployed{border-color:#00ff88;color:#00ff88;background:#0a2a1a}
@keyframes blink{0%,100%{opacity:1}50%{opacity:0.5}}
.dot{width:6px;height:6px;border-radius:50%;background:#2a2a4a;flex-shrink:0}
.dot.on{background:var(--success)}
.dot.off{background:#2a2a4a}
.main{flex:1;display:flex;flex-direction:column;overflow:hidden}
.blank{flex:1;display:flex;align-items:center;justify-content:center;flex-direction:column;gap:12px}
.blank-icon{font-size:52px;opacity:0.15}
.blank-txt{color:#2a2a4a;font-size:12px}
.content-area{flex:1;padding:14px;overflow-y:auto;display:flex;flex-direction:column;gap:10px}
.panel{background:#0f0f1e;border:1px solid #1e1e3a;border-radius:12px;overflow:hidden}
.panel-hdr{display:flex;align-items:center;justify-content:space-between;padding:10px 14px;border-bottom:1px solid #1e1e3a}
.panel-title{font-size:14px;font-weight:700;color:#00d4ff}
.panel-sub{font-size:10px;color:#555;margin-top:2px}
.panel-status{font-size:10px;display:flex;align-items:center;gap:5px;margin-left:12px}
.ok{color:#15803c}
.warn{color:#a15c00}
.close-btn{width:24px;height:24px;border-radius:50%;border:1px solid #2a2a4a;background:transparent;color:#555;font-size:12px;cursor:pointer;display:flex;align-items:center;justify-content:center;transition:all 0.15s;flex-shrink:0}
.close-btn:hover{border-color:#ff4444;color:#ff4444}
.wf-bar{display:flex;align-items:center;padding:8px 14px;background:#080810;border-bottom:1px solid #1e1e3a;overflow-x:auto;gap:0;flex-shrink:0}
.wf-step{display:flex;align-items:center;gap:5px;flex-shrink:0}
.wf-dot{width:20px;height:20px;border-radius:50%;display:flex;align-items:center;justify-content:center;font-size:9px;font-weight:700;border:1px solid #2a2a4a;background:#1a1a2e;color:#444}
.wf-dot.done{background:#00ff88;border-color:#00ff88;color:#000}
.wf-dot.active{background:#001a2e;border-color:#00d4ff;color:#00d4ff;animation:blink 1s infinite}
.wf-lbl{font-size:9px;color:#444}
.wf-dot.done~.wf-lbl{color:#00ff88}
.wf-dot.active~.wf-lbl{color:#00d4ff}
.wf-arr{color:#2a2a4a;font-size:11px;margin:0 6px}
.tab-row{display:flex;gap:4px;padding:8px 14px;border-bottom:1px solid #1e1e3a}
.tab{padding:5px 14px;border-radius:6px;border:1px solid transparent;background:transparent;color:#555;font-size:11px;cursor:pointer;font-weight:600;transition:all 0.15s}
.tab:hover{color:#ccc}
.tab.active{background:#001a2e;border-color:#00d4ff44;color:#00d4ff}
.panel-body{padding:12px 14px;min-height:0;overflow-y:auto}
.log-terminal{background:#050508;border-radius:8px;padding:10px;font-family:monospace;font-size:10px;line-height:1.8;min-height:0;overflow-y:auto}
.log-ok{color:#15803d;font-weight:600}
.log-err{color:#dc2626;font-weight:600}
.log-warn{color:#a15c00;font-weight:600}
.log-info{color:#334155}
.loading-txt{color:#333;font-style:italic;padding:10px;font-size:11px}
.process-list{display:flex;flex-direction:column;gap:6px}
.proc-item{display:flex;align-items:center;gap:10px;padding:8px 10px;background:#080810;border-radius:7px;border:1px solid #1a1a2a}
.proc-dot{width:10px;height:10px;border-radius:50%;flex-shrink:0;box-shadow:0 0 0 3px var(--success-soft)}
.proc-name{font-size:11px;font-weight:700;color:#ccc}
.proc-desc{font-size:10px;color:#555;margin-top:1px}
.proc-badge{font-size:9px;padding:2px 7px;border-radius:10px;margin-left:auto;flex-shrink:0}
.pbg-run{background:var(--success-soft);color:#166534;border:1px solid #9bd8b0;font-weight:700}
.status-grid{display:grid;grid-template-columns:repeat(3,1fr);gap:8px}
.stat-card{background:#080810;border-radius:8px;padding:10px;text-align:center;border:1px solid #1a1a2a}
.stat-val{font-size:20px;font-weight:700}
.stat-lbl{font-size:9px;color:#555;margin-top:3px}
.nf-grid{display:grid;grid-template-columns:repeat(4,1fr);gap:8px;padding:14px}
.nf-btn{padding:12px 8px;border-radius:10px;border:1px solid #1e1e3a;background:#13132a;cursor:pointer;text-align:center;transition:all 0.15s}
.nf-btn:hover{border-color:#a855f7;background:#1a0a2e}
.nf-btn.sel{border-color:#a855f7;background:#1a0a2e}
.nf-btn-name{font-size:13px;font-weight:700;color:#ccc;display:flex;align-items:center;justify-content:center;gap:5px}
.nf-btn.sel .nf-btn-name{color:#a855f7}
.nf-btn-st{font-size:9px;color:#555;margin-top:3px}
.info-grid{display:grid;grid-template-columns:1fr 1fr;gap:8px;padding:14px}
.info-card{background:#080810;border-radius:8px;padding:10px;border:1px solid #1a1a2a}
.info-key{font-size:9px;color:#555;margin-bottom:3px;text-transform:uppercase;letter-spacing:0.5px}
.info-val{font-size:13px;font-weight:700;color:#ccc}
.info-val.ok{color:#15803c}
.info-val.blue{color:#00d4ff}
.pulse{display:inline-block;width:6px;height:6px;border-radius:50%;background:#00ff88;animation:p 2s infinite;margin-right:4px}
@keyframes p{0%,100%{opacity:1}50%{opacity:0.3}}
.deploying-bar{padding:12px 14px;background:#080810;border-bottom:1px solid #1e1e3a;font-size:11px;color:#ffaa00;display:flex;align-items:center;gap:8px}
.spinner{width:14px;height:14px;border:2px solid #2a2a4a;border-top:2px solid #ffaa00;border-radius:50%;animation:spin 0.8s linear infinite;flex-shrink:0}
@keyframes spin{to{transform:rotate(360deg)}}
::-webkit-scrollbar{width:3px;height:3px}
::-webkit-scrollbar-track{background:#0a0a1a}
::-webkit-scrollbar-thumb{background:#2a2a4a;border-radius:2px}

.arch-btn,.stack-btn{padding:7px 10px;border-radius:7px;border:1px solid #1e1e3a;background:#13132a;color:#aaa;font-size:11px;cursor:pointer;text-align:left;font-weight:600;transition:all 0.15s;display:flex;align-items:center;justify-content:space-between}
.arch-btn:hover,.stack-btn:hover{border-color:#444}
.arch-btn.sel{border-color:#00d4ff;background:#001a2e;color:#00d4ff}
.stack-btn.sel{border-color:#a855f7;background:#1a0a2e;color:#a855f7}
.arch-btn.disabled{opacity:0.3;cursor:default}
.bdg-mini{font-size:8px;padding:1px 5px;border-radius:10px}
.bdg-mini.live{background:#0a2a1a;color:#00ff88;border:1px solid #00ff8844}
.bdg-mini.soon{background:#1a1a1a;color:#333;border:1px solid #222}

/* =========================================================
   5G PLATFORM DASHBOARD — FINAL LAYOUT / TYPOGRAPHY SYSTEM
   ========================================================= */
:root{
  --bg:#080812;--surface:#0f0f1e;--surface-2:#13132a;--surface-3:#080810;
  --border:#252542;--border-soft:#1a1a2a;--text:#e7e9f0;--muted:#8b90a3;
  --dim:#62697d;--accent:#00d4ff;--success:#00ff88;--warning:#ffaa00;
  --danger:#ff4444;--purple:#a855f7;--gap:12px;
}
html,body{width:100%;height:100%;min-height:100%}
body{
  min-height:100vh;font-size:14px;line-height:1.45;
  background:radial-gradient(circle at 80% 0%,rgba(0,212,255,.045),transparent 32%),
             radial-gradient(circle at 30% 100%,rgba(168,85,247,.035),transparent 30%),var(--bg);
}
.topbar{min-height:58px;padding:10px 18px;gap:14px}
.topbar h1{font-size:16px;letter-spacing:1.1px;white-space:nowrap}
.top-btns{gap:7px;overflow-x:auto;scrollbar-width:none;padding-bottom:1px}
.top-btns::-webkit-scrollbar{display:none}
.top-btn{flex:0 0 auto;min-height:34px;padding:7px 13px;font-size:12px;border-radius:7px}
.layout{min-height:0}
.sidebar{width:190px;padding:14px 10px}
.sb-title{font-size:11px;margin-bottom:10px}
.ran-card{padding:10px;margin-bottom:7px;border-radius:9px}
.ran-name{font-size:13px}.ran-type{font-size:11px;margin-bottom:7px}
.ran-badge{font-size:10px;padding:2px 6px}.deploy-btn{min-height:32px;font-size:12px;padding:6px 0}
.main{min-width:0;min-height:0}
.content-area{
  flex:1 1 auto;min-width:0;min-height:0;padding:16px;gap:12px;overflow:auto;scrollbar-gutter:stable
}
.panel{min-width:0;min-height:0;border-radius:12px;border-color:var(--border)}
.panel-hdr{min-height:58px;padding:11px 16px}
.panel-title{font-size:18px}.panel-sub{font-size:12px;color:var(--muted)}.panel-status{font-size:12px}
.close-btn{width:30px;height:30px;font-size:14px}
.wf-bar{min-height:48px;padding:9px 16px}.wf-dot{width:24px;height:24px;font-size:11px}
.wf-lbl{font-size:11px}.wf-arr{font-size:13px}
.tab-row{gap:6px;padding:9px 16px}.tab{min-height:34px;padding:7px 15px;font-size:13px}
.panel-body{padding:14px 16px;min-height:0;overflow:auto}
.log-terminal{min-height:0;padding:12px 14px;font-size:12px;line-height:1.65;overflow:auto}
.loading-txt{padding:14px;font-size:14px;color:#475569;line-height:1.6}
.process-list{gap:8px}.proc-item{min-height:64px;padding:12px 14px}
.proc-name{font-size:15px;font-weight:700;color:var(--text-strong)}.proc-desc{font-size:13px;color:var(--muted);margin-top:3px;line-height:1.45}.proc-badge{font-size:12px;padding:4px 9px}
.status-grid{grid-template-columns:repeat(3,minmax(0,1fr));gap:10px}
.stat-card{min-height:86px;padding:14px 10px;display:flex;flex-direction:column;align-items:center;justify-content:center}
.stat-val{font-size:26px}.stat-lbl{font-size:12px;margin-top:5px;color:var(--muted)}
.nf-grid{grid-template-columns:repeat(4,minmax(0,1fr));gap:10px;padding:16px}
.nf-btn{min-height:70px;padding:14px 10px}.nf-btn-name{font-size:15px}.nf-btn-st{font-size:11px}
.info-grid{gap:10px;padding:16px}.info-card{min-height:72px;padding:12px 14px}
.info-key{font-size:11px;margin-bottom:5px}.info-val{font-size:15px}
.arch-btn,.stack-btn{min-height:38px;padding:8px 12px;font-size:13px}.bdg-mini{font-size:10px;padding:2px 6px}
.deploying-bar{padding:14px 16px;font-size:13px}

/* Flexible-height panels */
.fill-panel,.log-panel{flex:1 1 auto;min-height:0;display:flex;flex-direction:column}
.fill-panel>.panel-body,.log-panel>.panel-body{flex:1 1 auto;min-height:0}
.log-panel>.panel-body{display:flex;flex-direction:column;overflow:hidden}
.log-panel>.panel-body>.log-terminal{flex:1 1 auto;min-height:0;overflow:auto}

/* UE — structured top panel + bottom status cards */
.content-area:has(.ue-panel){overflow:hidden}
.content-area:has(.ue-panel)>.ue-panel{
  flex:0 0 58%;
  min-height:0;
}
.ue-panel .panel-body{
  display:flex;
  flex-direction:column;
  min-height:0;
}
.ue-panel .panel-body>.log-terminal{
  flex:1 1 auto;
  min-height:0;
  overflow:auto;
}
.ue-panel+.info-grid{
  flex:1 1 auto;
  min-height:0;
  max-height:none;
  grid-template-columns:repeat(3,minmax(0,1fr));
  grid-auto-rows:minmax(0,1fr);
  padding:0;
  gap:10px;
}
.ue-panel+.info-grid .info-card{
  min-height:0;
  display:flex;
  flex-direction:column;
  justify-content:center;
}

/* Network Slice */
.content-area:has(.slice-panel){overflow:hidden}
.slice-panel .info-grid{flex:1 1 auto;min-height:0;grid-auto-rows:minmax(90px,1fr)}
.slice-panel .info-card{display:flex;flex-direction:column;justify-content:center}

/* 5G Core */
.core-content{overflow:hidden}
.core-overview-panel{flex:0 0 auto}
.core-content #nf-area{flex:1 1 auto;min-height:0;display:flex}
.core-content #nf-area .nf-detail-panel{flex:1 1 auto;min-height:0}
.nf-detail-panel .panel-body{flex:1 1 auto}
.nf-detail-panel .log-terminal{flex:1 1 auto;min-height:0}

/* Layer 2 */
.layer2-content{overflow:hidden}
.layer2-panel{flex:1 1 auto}
.layer2-panel #l2-grid{flex:0 0 auto}
.layer2-panel>div:last-child{flex:1 1 auto;min-height:0;overflow:auto}
.layer2-panel>div:last-child>div:last-child{min-height:110px}

/* Layer 3 */
.layer3-content{overflow:hidden}
.layer3-panel{flex:1 1 auto}
.layer3-body{flex:1 1 auto;min-height:0;max-height:none!important;overflow:auto}
.layer3-body .process-list{min-height:100%}
.layer3-body .proc-item{min-height:56px}

/* Short information views still own the viewport */
.content-area>.panel:not(.log-panel):not(.core-overview-panel){min-height:0}

/* Intentional empty state */
.blank{padding:32px}.blank-icon{font-size:64px}.blank-txt{font-size:14px;color:var(--dim)}
::-webkit-scrollbar{width:7px;height:7px}
::-webkit-scrollbar-track{background:#0a0a14}
::-webkit-scrollbar-thumb{background:#30304c;border-radius:5px}
::-webkit-scrollbar-thumb:hover{background:#444465}

/* Responsive */
@media (max-width:1100px){
  .sidebar{width:170px}.topbar h1{font-size:14px}.top-btn{padding-inline:10px}
  .nf-grid{grid-template-columns:repeat(3,minmax(0,1fr))}
}
@media (max-width:800px){
  body{overflow:auto}.layout{min-height:calc(100vh - 58px)}.sidebar{width:145px}
  .content-area{padding:10px}.status-grid{grid-template-columns:repeat(2,minmax(0,1fr))}
  .info-grid{grid-template-columns:1fr}.nf-grid{grid-template-columns:repeat(2,minmax(0,1fr))}
  .panel-title{font-size:16px}.log-terminal{font-size:11px}
}


/* ============================================================
   NOVATHINKTECH INTELLI5G — LIGHT ENTERPRISE DASHBOARD THEME
   Neutral surfaces + blue primary accent + semantic status colors.
   ============================================================ */
:root{
  --bg:#f5f7fb;
  --surface:#ffffff;
  --surface-2:#f8fafc;
  --surface-3:#eef3f8;
  --border:#d8e0ea;
  --border-soft:#e7edf4;
  --text:#172033;
  --text-strong:#0b1730;
  --muted:#526176;
  --dim:#718096;
  --accent:#155eef;
  --accent-dark:#0b4fc4;
  --accent-soft:#eaf2ff;
  --success:#16803c;
  --success-soft:#eaf8ef;
  --warning:#a15c00;
  --warning-soft:#fff5e6;
  --danger:#c62828;
  --danger-soft:#fff0f0;
  --purple:#6941c6;
  --purple-soft:#f2edff;
  --shadow:0 2px 8px rgba(15,23,42,.06),0 1px 2px rgba(15,23,42,.04);
}
html,body{background:var(--bg);color:var(--text)}
body{font-family:Inter,ui-sans-serif,system-ui,-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;font-size:15px;line-height:1.5}
.topbar{background:var(--surface);border-bottom:1px solid var(--border);padding:10px 20px;min-height:62px;box-shadow:0 1px 2px rgba(15,23,42,.04)}
.topbar h1{font-size:20px;font-weight:750;color:var(--accent);letter-spacing:.15px}
.top-btn{font-size:13px;color:var(--text);background:var(--surface-2);border-color:var(--border);min-height:36px}
.top-btn:hover{color:var(--accent);border-color:#9dbcf5;background:var(--accent-soft)}
.sidebar{width:205px;background:var(--surface);border-right:1px solid var(--border);padding:16px 11px;box-shadow:1px 0 3px rgba(15,23,42,.03)}
.sidebar .nav-label,.sidebar small{color:var(--muted)}
.nav-item{color:var(--text);font-size:14px;min-height:38px}
.nav-item:hover{background:var(--accent-soft);color:var(--accent-dark)}
.nav-item.active{background:var(--accent-soft);color:var(--accent-dark);border-left-color:var(--accent)}
.main{background:var(--bg)}
.content-area{padding:16px 18px;gap:14px}
.panel{background:var(--surface);border:1px solid var(--border);border-radius:10px;box-shadow:var(--shadow)}
.panel-hdr{min-height:58px;padding:12px 17px;border-bottom:1px solid var(--border-soft);background:var(--surface)}
.panel-title{font-size:18px;font-weight:700;color:var(--text-strong)}
.panel-sub{font-size:13px;color:var(--muted)}
.panel-body{padding:15px 17px}
.tab-row{background:var(--surface-2);border-bottom:1px solid var(--border-soft);gap:6px;padding:9px 16px}
.tab{min-height:36px;padding:7px 15px;font-size:13px;color:var(--muted)}
.tab:hover{color:var(--accent-dark);background:var(--accent-soft)}
.tab.active{background:var(--accent-soft);border-color:#b7cef7;color:var(--accent-dark)}
.log-terminal{background:#f8fafc;color:#243247;border:1px solid var(--border-soft);border-radius:7px;padding:14px 16px;font-size:14px;line-height:1.8}
.stat-card,.info-card{background:var(--surface);border:1px solid var(--border-soft);box-shadow:0 1px 3px rgba(15,23,42,.035)}
.log-terminal .log-info:where(span){display:inline-block;max-width:100%;word-break:break-word}.log-terminal .log-err,.log-terminal .log-warn,.log-terminal .log-ok,.log-terminal .log-info{font-size:14px}.log-terminal .log-info{font-weight:500}.log-terminal .log-empty{display:block;padding:11px 13px;margin:2px 0;background:var(--accent-soft);border:1px solid #b7cef7;border-radius:7px;color:#334155;font-size:15px;font-weight:650;line-height:1.6}
.stat-val{font-size:28px;color:var(--text-strong)}
.stat-lbl{font-size:12px;color:var(--muted);font-weight:600}
.info-key{font-size:12px;color:var(--muted);font-weight:650}
.info-val{font-size:16px;color:var(--text-strong)}
.info-val.blue{color:var(--accent)}
.info-val.ok{color:var(--success)}
.nf-btn{background:var(--surface);border-color:var(--border);min-height:74px;box-shadow:0 1px 2px rgba(15,23,42,.03)}
.nf-btn:hover{border-color:#9dbcf5;background:var(--accent-soft)}
.nf-btn.sel{border-color:#7da8f4;background:var(--accent-soft);box-shadow:0 0 0 1px #b7cef7 inset}
.nf-btn-name{font-size:15px;color:var(--text-strong)}
.nf-btn.sel .nf-btn-name{color:var(--accent-dark)}
.nf-btn-st{font-size:11px;color:var(--muted)}
.process-list,.proc-item{color:var(--text)}
.proc-item{border-color:var(--border-soft);background:var(--surface-2);padding:12px 14px;min-height:64px}
.status-dot.ok{background:var(--success);box-shadow:0 0 0 3px var(--success-soft)}
.status-dot.warn{background:var(--warning)}
.status-dot.bad{background:var(--danger)}
button,.btn{font-size:13px}
input,select{font-size:14px;background:var(--surface);color:var(--text);border-color:var(--border)}
code,pre{font-size:13px}

/* Semantic accents: status meaning stays distinct from the blue brand accent. */

.badge-warn,.status-warn{color:var(--warning)}
.badge-bad,.status-bad{color:var(--danger)}

  .sidebar{width:185px}
  .topbar h1{font-size:18px}
}

/* ============================================================
   NOVATHINKTECH INTELLI5G — POLISHED DESIGN SYSTEM + THEME SWITCH
   Light is the default. Dark mode is user-selectable and persisted.
   ============================================================ */
.theme-toggle{display:inline-flex;align-items:center;justify-content:center;gap:7px;min-width:104px}
.theme-toggle .theme-icon{font-size:15px;line-height:1}
.theme-toggle .theme-label{font-size:12px;font-weight:700}

/* Shared polish */
.topbar{position:relative;z-index:10}
.topbar h1{display:flex;align-items:center;gap:9px}
.topbar h1::before{content:"";width:8px;height:8px;border-radius:50%;background:var(--accent);box-shadow:0 0 0 4px var(--accent-soft);flex:0 0 auto}
.top-btn{box-shadow:0 1px 2px rgba(15,23,42,.04)}
.top-btn.active{box-shadow:0 0 0 1px rgba(21,94,239,.10) inset}
.sidebar{position:relative}
.sidebar::after{content:"";position:absolute;right:-1px;top:0;bottom:0;width:1px;background:var(--border)}
.ran-card{box-shadow:0 1px 2px rgba(15,23,42,.025)}
.ran-card:hover{transform:translateY(-1px);box-shadow:var(--shadow)}
.panel{box-shadow:var(--shadow)}
.panel-hdr{position:relative}
.panel-hdr::after{content:"";position:absolute;left:0;bottom:-1px;width:72px;height:2px;background:var(--accent);opacity:.75}
.tab.active{font-weight:700}
.info-card,.stat-card,.nf-btn,.proc-item{transition:transform .15s ease,box-shadow .15s ease,border-color .15s ease,background .15s ease}
.info-card:hover,.stat-card:hover,.nf-btn:hover,.proc-item:hover{transform:translateY(-1px);box-shadow:var(--shadow)}

/* Dark theme */
body.theme-dark{
  --bg:#070b14;
  --surface:#0d1422;
  --surface-2:#111a2b;
  --surface-3:#172238;
  --border:#24324a;
  --border-soft:#1d2a40;
  --text:#e7edf7;
  --text-strong:#f5f8ff;
  --muted:#9aa9bd;
  --dim:#718199;
  --accent:#4ea1ff;
  --accent-dark:#79b7ff;
  --accent-soft:#102846;
  --success:#39d98a;
  --success-soft:#0e2a20;
  --warning:#ffb547;
  --warning-soft:#342710;
  --danger:#ff6b6b;
  --danger-soft:#351619;
  --purple:#a78bfa;
  --purple-soft:#241b3d;
  --shadow:0 8px 24px rgba(0,0,0,.18),0 1px 3px rgba(0,0,0,.20);
  color-scheme:dark;
}
body.theme-dark .topbar,
body.theme-dark .sidebar,
body.theme-dark .panel,
body.theme-dark .panel-hdr{background:var(--surface);color:var(--text)}
body.theme-dark .topbar{border-bottom-color:var(--border)}
body.theme-dark .sidebar{border-right-color:var(--border)}
body.theme-dark .top-btn{background:var(--surface-2);border-color:var(--border);color:var(--text)}
body.theme-dark .top-btn:hover{background:var(--accent-soft);border-color:var(--accent);color:var(--accent)}
body.theme-dark .top-btn.active{background:var(--accent-soft);border-color:var(--accent);color:var(--accent)}
body.theme-dark .ran-card{background:var(--surface-2);border-color:var(--border)}
body.theme-dark .ran-name,.theme-dark .proc-name,.theme-dark .nf-btn-name{color:var(--text-strong)}
body.theme-dark .ran-type,.theme-dark .proc-desc,.theme-dark .nf-btn-st{color:var(--muted)}
body.theme-dark .arch-btn,body.theme-dark .stack-btn{background:var(--surface-2);border-color:var(--border);color:var(--text)}
body.theme-dark .arch-btn.sel{background:var(--accent-soft);border-color:var(--accent);color:var(--accent)}
body.theme-dark .stack-btn.sel{background:var(--purple-soft);border-color:var(--purple);color:var(--purple)}
body.theme-dark .deploy-btn{background:transparent;border-color:var(--border);color:var(--muted)}
body.theme-dark .panel-sub,body.theme-dark .info-key,body.theme-dark .stat-lbl{color:var(--muted)}
body.theme-dark .tab-row{background:var(--surface-2);border-bottom-color:var(--border-soft)}
body.theme-dark .tab{color:var(--muted)}
body.theme-dark .tab:hover,body.theme-dark .tab.active{background:var(--accent-soft);color:var(--accent-dark);border-color:#315d8f}
body.theme-dark .log-terminal{background:#080d17;color:#d9e2ef;border-color:var(--border-soft)}
body.theme-dark .log-info{color:#c2cede}
body.theme-dark .log-ok{color:var(--success)}
body.theme-dark .log-warn{color:var(--warning)}
body.theme-dark .log-err{color:var(--danger)}
body.theme-dark .log-terminal .log-empty{background:var(--accent-soft);border-color:#315d8f;color:#dbeafe}
body.theme-dark .stat-card,body.theme-dark .info-card,body.theme-dark .nf-btn,body.theme-dark .proc-item{background:var(--surface-2);border-color:var(--border-soft)}
body.theme-dark .nf-btn.sel{background:var(--purple-soft);border-color:#6d57ad}
body.theme-dark .nf-btn.sel .nf-btn-name{color:var(--purple)}
body.theme-dark .info-val,body.theme-dark .stat-val{color:var(--text-strong)}
body.theme-dark .info-val.blue{color:var(--accent)}
body.theme-dark .info-val.ok{color:var(--success)}
body.theme-dark .wf-bar{background:#090f1a;border-bottom-color:var(--border)}
body.theme-dark .wf-dot{background:var(--surface-2);border-color:var(--border);color:var(--muted)}
body.theme-dark .wf-dot.active{background:var(--accent-soft);border-color:var(--accent);color:var(--accent)}
body.theme-dark .wf-lbl{color:var(--muted)}
body.theme-dark .blank-txt{color:var(--dim)}
body.theme-dark input,body.theme-dark select{background:var(--surface-2);color:var(--text);border-color:var(--border)}
body.theme-dark .close-btn{border-color:var(--border);color:var(--muted)}
body.theme-dark #liveBar{background:#090f1a!important;border-bottom-color:var(--border)!important}
body.theme-dark #lb-updated{color:#718199!important}
body.theme-dark ::-webkit-scrollbar-track{background:#080d17}
body.theme-dark ::-webkit-scrollbar-thumb{background:#33445f}

/* Live bar follows the selected theme without changing its live status colors. */
#liveBar{background:var(--surface-3)!important;border-bottom:1px solid var(--border)!important;color:var(--muted)}
#liveBar span:first-child{color:var(--muted)!important;font-weight:800;letter-spacing:.4px}

/* Responsive desktop/tablet/mobile behavior */
@media (max-width:1100px){
  .topbar{align-items:flex-start}
  .topbar h1{font-size:18px}
  .top-btns{max-width:72vw}
}
@media (max-width:800px){

  .nf-grid{grid-template-columns:repeat(2,minmax(0,1fr))}

@media (max-width:520px){
  .topbar h1{font-size:16px}

  .theme-toggle .theme-label{font-size:11px}

  #arch-list,#stack-list{grid-template-columns:1fr!important}
  .sidebar{max-height:310px}
  .main{min-height:700px}
  .status-grid,.ue-panel+.info-grid{grid-template-columns:1fr}
  .nf-grid{grid-template-columns:1fr}
}


/* Client-facing RAN operational summary */
.ran-client-panel{display:flex;flex-direction:column;min-height:0;flex:1 1 auto}
.ran-client-summary{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:9px;padding:12px 16px}
.ran-health{grid-column:1/-1;display:flex;align-items:center;justify-content:space-between;gap:12px;padding:10px 13px;border:1px solid var(--border);border-radius:10px;background:var(--surface-2)}
.ran-health-title{font-size:12px;font-weight:800;text-transform:uppercase;letter-spacing:.45px;color:var(--muted)}
.ran-health-state{font-size:15px;font-weight:900;letter-spacing:.3px}
.ran-status-card{min-height:66px;padding:10px 12px;border:1px solid var(--border);border-radius:9px;background:var(--surface-2);display:flex;align-items:center;gap:9px}
.ran-status-dot{width:10px;height:10px;border-radius:50%;flex:0 0 auto}
.ran-status-label{font-size:11px;color:var(--muted);text-transform:uppercase;letter-spacing:.35px}
.ran-status-value{font-size:13px;font-weight:800;color:var(--text-strong);margin-top:3px}
.ran-client-tabs{display:flex;gap:7px;padding:8px 16px;border-top:1px solid var(--border);border-bottom:1px solid var(--border);background:var(--surface)}
.ran-client-tab{border:1px solid var(--border);background:var(--surface-2);color:var(--muted);border-radius:7px;padding:7px 12px;font-size:12px;font-weight:800;cursor:pointer}
.ran-client-tab.active{background:var(--accent);border-color:var(--accent);color:#fff}
.ran-client-body{flex:1 1 auto;min-height:0;overflow:auto;padding:12px 16px}
.ran-event-list{display:flex;flex-direction:column;gap:7px}
.ran-event{display:grid;grid-template-columns:20px 155px minmax(0,1fr);align-items:center;gap:9px;padding:9px 11px;border:1px solid var(--border);border-radius:8px;background:var(--surface-2)}
.ran-event-icon{font-size:13px;font-weight:900;text-align:center}
.ran-event-label{font-size:12px;font-weight:800;color:var(--text-strong)}
.ran-event-detail{font-size:11px;color:var(--muted);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.ran-event-time{font-size:10px;color:var(--muted);grid-column:2/-1}
.ran-client-body .log-terminal{min-height:240px}
.ran-empty{padding:20px;text-align:center;border:1px dashed var(--border);border-radius:9px;color:var(--muted);font-size:13px;line-height:1.6}
@media(max-width:900px){.ran-client-summary{grid-template-columns:repeat(2,minmax(0,1fr))}.ran-event{grid-template-columns:20px 1fr}.ran-event-detail{grid-column:2}.ran-event-time{grid-column:2}}

<body>

<script>
const NF_LIST=["AMF","SMF","UPF","NRF","AUSF","UDM","UDR","PCF","NSSF"];
const NF_COLOR={AMF:"#00d4ff",SMF:"#00aaff",UPF:"#ff6b35",NRF:"#15803c",AUSF:"#a855f7",UDM:"#f59e0b",UDR:"#ec4899",PCF:"#06b6d4",NSSF:"#84cc16"};
const NF_DESC={AMF:"Access & Mobility — registration, auth, mobility. N2 to gNB via NGAP/SCTP.",SMF:"Session Management — assigns UE IP, GTP tunnel via PFCP to UPF.",UPF:"User Plane — forwards packets via gtp5g kernel module. N3 N4 N6.",NRF:"Network Repository — service registry for all NFs. Port 8000.",AUSF:"Authentication Server — 5G-AKA with K/OPc keys.",UDM:"Unified Data Mgmt — subscriber profiles and auth vectors.",UDR:"Unified Data Repo — raw storage backend for UDM.",PCF:"Policy Control — QoS rules and PCC rules to SMF.",NSSF:"Slice Selection — routes UE to SST=1 SD=010203."};
let podData={};
let currentRAN=null;

async function loadPods(){
  try{
    const r=await fetch("/api/pods");
    const d=await r.json();
    d.pods.forEach(p=>{
      NF_LIST.forEach(nf=>{if(p.name.toLowerCase().includes("open5gs-"+nf.toLowerCase()))podData[nf]=p;});
      if(p.name.includes("ueransim-ue"))podData["UE"]=p;
      if(p.name.includes("ueransim-gnb"))podData["GNB"]=p;
      if(p.name.includes("oai-cu"))podData["OAI-CU"]=p;
      if(p.name.includes("srsran"))podData["SRSRAN"]=p;
    });
    NF_LIST.forEach(nf=>{
      const el=document.getElementById("nfst-"+nf);
      if(el)el.textContent=podData[nf]?(podData[nf].ready+" ✓"):"—";
    });
  }catch(e){}
}

function clearTop(){
  document.querySelectorAll(".top-btn").forEach(b=>b.classList.remove("active"));
}

function blank(){
  clearTop();
  document.querySelectorAll(".ran-card").forEach(c=>c.classList.remove("deployed"));
  currentRAN=null;
  localStorage.removeItem("activeTopPanel");
  document.getElementById("main").innerHTML='<div class="blank"><div class="blank-icon">📡</div><div class="blank-txt">Deploy a RAN or select a component from the top bar</div></div>';
}

// Restore Layer 2 / Layer 3 panel across page reloads
(function restoreActiveTopPanel(){
  const saved = localStorage.getItem("activeTopPanel");
  if(saved === "layer2" || saved === "layer3"){
    window.addEventListener("load", () => {
      const btn = document.getElementById(saved === "layer2" ? "btn-layer2" : "btn-layer3");
      if(btn){
        if(saved === "layer2") showLayer2Panel(btn);
        else showLayer3Panel(btn);
      }
    });
  }
})();

function wfHTML(steps){
  const labels=["Selected","GitHub push","Helm deploy","Pod running","AMF connected"];
  return '<div class="wf-bar">'+steps.map((s,i)=>`<div class="wf-step"><div class="wf-dot ${s}">${s==="done"?"✓":s==="active"?"…":String(i+1)}</div><span class="wf-lbl">${labels[i]}</span></div>${i<4?'<div class="wf-arr">→</div>':""}`).join("")+"</div>";
}

function tabsHTML(podLabel,key,pfx){
  if(pfx !== "ran") return `<div class="tab-row">
    <button class="tab active" onclick="doTab(this,'logs','${podLabel}','${key}','${pfx}')">Logs</button>
    <button class="tab" onclick="doTab(this,'process','${podLabel}','${key}','${pfx}')">Process</button>
    <button class="tab" onclick="doTab(this,'status','${podLabel}','${key}','${pfx}')">Status</button>
  </div>`;
  return `<div class="ran-client-tabs" id="ran-client-tabs">
    <button class="ran-client-tab active" onclick="doTab(this,'events','${podLabel}','${key}','ran')">Recent Events</button>
    <button class="ran-client-tab" onclick="doTab(this,'logs','${podLabel}','${key}','ran')">Technical Logs</button>
    <button class="ran-client-tab" onclick="doTab(this,'process','${podLabel}','${key}','ran')">Processes</button>
    <button class="ran-client-tab" onclick="doTab(this,'status','${podLabel}','${key}','ran')">Runtime</button>
  </div>`;
}

async function fetchLogs(podLabel,tid){
  const el=document.getElementById(tid); if(!el)return;
  try{
    const r=await fetch("/api/logs/"+encodeURIComponent(podLabel)+"?lines=100",{cache:"no-store"});
    const d=await r.json();
    if(!d.logs||!d.logs.trim()){
      el.innerHTML='<div class="ran-empty">'+(d.pod?'No technical logs available yet.':'No running pod found.')+'</div>'; return;
    }
    const lines=d.logs.trim().split("\n").slice(-100); el.innerHTML="";
    lines.forEach(line=>{
      if(!line.trim())return;
      const div=document.createElement("div");
      const isErr=/error|ERRO|fail|panic|fatal/i.test(line);
      const isOk=/success|established|started|running|complete|finalized|activated/i.test(line);
      const isWarn=/warn/i.test(line);
      const cls=isErr?"log-err":isOk?"log-ok":isWarn?"log-warn":"log-info";
      div.innerHTML=`<span class="${cls}">${escHtml(line)}</span>`; el.appendChild(div);
    });
    el.scrollTop=el.scrollHeight;
  }catch(e){el.innerHTML='<div class="ran-empty">Live technical-log error: '+escHtml(e.message)+'</div>';}
}

function stopLiveTimer(pfx){
  if(window._liveTimers&&window._liveTimers[pfx]){clearInterval(window._liveTimers[pfx]);delete window._liveTimers[pfx];}
}
function startLiveLogs(podLabel,tid,pfx){
  stopLiveTimer(pfx); fetchLogs(podLabel,tid); window._liveTimers=window._liveTimers||{};
  window._liveTimers[pfx]=setInterval(()=>{if(!document.getElementById(tid)){stopLiveTimer(pfx);return;}fetchLogs(podLabel,tid);},3000);
}
function escHtml(v){return String(v??"").replace(/&/g,"&amp;").replace(/</g,"&lt;").replace(/>/g,"&gt;").replace(/"/g,"&quot;");}

function renderProcess(d){
  if(!d.found)return '<div class="ran-empty">No running Kubernetes pod found.</div>';
  if(!d.processes||!d.processes.length)return '<div class="ran-empty">No process information available from the running containers.</div>';
  return '<div class="process-list">'+d.processes.map(p=>`<div class="proc-item"><div class="proc-dot" style="background:#15803c"></div><div style="min-width:0"><div class="proc-name">${escHtml(p.name)}</div><div class="proc-desc">${escHtml(p.container)} · PID ${escHtml(p.pid)} · ${escHtml(p.command)}</div></div><span class="proc-badge pbg-run">running</span></div>`).join("")+'</div>';
}
function renderStatus(d){
  if(!d.found)return '<div class="ran-empty">No running Kubernetes pod found.</div>';
  const pods=d.pods||[], ready=pods.reduce((n,p)=>n+(p.ready_count||0),0), total=pods.reduce((n,p)=>n+(p.container_count||0),0), restarts=pods.reduce((n,p)=>n+(p.restarts||0),0);
  const phases=[...new Set(pods.map(p=>p.phase))].join(", ");
  const latency=d.latency_ms, success=d.sbi_success_pct;
  const cards=[{v:`${ready}/${total}`,l:"containers ready",c:"#15803c"},{v:String(restarts),l:"container restarts",c:restarts>0?"#a15c00":"#15803c"},{v:phases||"Unknown",l:"pod phase",c:phases==="Running"?"#15803c":"#a15c00"},{v:latency==null?"—":latency.toFixed(2)+"ms",l:"live SBI TCP latency",c:"#00aaff"},{v:success==null?"—":success.toFixed(1)+"%",l:"live SBI success (5m)",c:success!=null&&success>=99?"#15803c":"#a15c00"}];
  return '<div class="status-grid">'+cards.map(s=>`<div class="stat-card"><div class="stat-val" style="color:${s.c}">${escHtml(s.v)}</div><div class="stat-lbl">${escHtml(s.l)}</div></div>`).join("")+`<div style="grid-column:1/-1;font-size:11px;opacity:.7;padding:4px 2px">Live pods: ${pods.map(p=>escHtml(p.name)).join(" · ")}</div></div>`;
}
function eventColor(state){return state==="OPERATIONAL"||state==="Connected"||state==="Completed"||state==="Established"||state==="Active"?"#15803c":state==="DEGRADED"?"#dc2626":"#a15c00";}
function renderClientEvents(d){
  if(!d.found)return '<div class="ran-empty">No running RAN pods found. Events will appear automatically when the RAN is running.</div>';
  const c=eventColor(d.overall); let html=`<div class="ran-health"><div><div class="ran-health-title">RAN Operational Status</div><div class="ran-health-state" style="color:${c}">${escHtml(d.overall)}</div></div><div style="font-size:11px;color:var(--muted)">${escHtml(d.overall_detail||"")}</div></div>`;
  html+='<div class="ran-client-summary">'+(d.statuses||[]).map(x=>{const col=eventColor(x.state);return `<div class="ran-status-card"><span class="ran-status-dot" style="background:${col}"></span><div><div class="ran-status-label">${escHtml(x.label)}</div><div class="ran-status-value" style="color:${col}">${escHtml(x.state)}</div></div></div>`}).join("")+'</div>';
  if(!(d.statuses||[]).length) html+='<div class="ran-empty">No client-readable connection events detected in the current live log window yet. Open Technical Logs for raw evidence.</div>';
  html+='<div class="ran-event-list">'+(d.events||[]).map(e=>`<div class="ran-event"><div class="ran-event-icon" style="color:${e.severity==="error"?"#dc2626":"#15803c"}">${e.severity==="error"?"⚠":"✓"}</div><div class="ran-event-label">${escHtml(e.label)}</div><div class="ran-event-detail">${escHtml(e.detail||"")}</div>${e.timestamp?`<div class="ran-event-time">${escHtml(e.timestamp)}</div>`:""}</div>`).join("")+'</div>';
  return html;
}
async function fetchClientEvents(key,bodyId){
  const body=document.getElementById(bodyId); if(!body)return;
  try{const r=await fetch("/api/events/"+encodeURIComponent(key),{cache:"no-store"}); const d=await r.json(); body.innerHTML=renderClientEvents(d); updateRANHealth(d);}catch(e){body.innerHTML='<div class="ran-empty">Live event error: '+escHtml(e.message)+'</div>';}
}
function updateRANHealth(d){
  const el=document.getElementById("ran-health-inline"); if(!el)return;
  const col=eventColor(d.overall); el.innerHTML=`<span class="pulse" style="background:${col}"></span>${escHtml(d.overall)}`; el.style.color=col;
}
async function fetchRuntime(key,bodyId,view){
  const body=document.getElementById(bodyId); if(!body)return;
  try{const r=await fetch("/api/runtime/"+encodeURIComponent(key),{cache:"no-store"}); const d=await r.json(); body.innerHTML=view==="process"?renderProcess(d):renderStatus(d);}catch(e){body.innerHTML='<div class="ran-empty">Live runtime error: '+escHtml(e.message)+'</div>';}
}
function doTab(btn,view,podLabel,key,pfx){
  if(pfx !== "ran"){
    const scope=document.getElementById(pfx+"wrap")||document;
    scope.querySelectorAll(".tab").forEach(t=>t.classList.remove("active")); btn.classList.add("active");
    const body=document.getElementById(pfx+"pbody"); if(!body)return; stopLiveTimer(pfx);
    if(view==="logs"){
      body.innerHTML=`<div class="log-terminal" id="${pfx}lterm"><div class="loading-txt">Fetching live logs...</div></div>`;
      startLiveLogs(podLabel,pfx+"lterm",pfx);
    }else if(view==="process"){
      body.innerHTML='<div class="loading-txt">Reading live processes from Kubernetes...</div>';
      fetchRuntime(key,pfx+"pbody","process"); window._liveTimers=window._liveTimers||{}; window._liveTimers[pfx]=setInterval(()=>fetchRuntime(key,pfx+"pbody","process"),5000);

  scope.querySelectorAll(".ran-client-tab").forEach(t=>t.classList.remove("active")); btn.classList.add("active");
  const body=document.getElementById("ranpbody"); if(!body)return; stopLiveTimer("ran");
  if(view==="events"){

    fetchRuntime(key,"ranruntimebody","status"); window._liveTimers=window._liveTimers||{}; window._liveTimers.ran=setInterval(()=>fetchRuntime(key,"ranruntimebody","status"),5000);
  }
}

async function deployRAN(key,name,sub){
  clearTop();
  const btn=document.getElementById("dbtn-"+key);
  const card=document.getElementById("ran-"+key);
  btn.className="deploy-btn deploying";
  btn.textContent="⏳ Deploying...";
  card.classList.add("deployed");
  currentRAN=key;
  const other=key==="cran"?"oran":"cran";
  const obtn=document.getElementById("dbtn-"+other);
  const ocard=document.getElementById("ran-"+other);
  if(obtn){obtn.className="deploy-btn";obtn.textContent="▶ Deploy";}
  if(ocard)ocard.classList.remove("deployed");

  const m=document.getElementById("main");
  m.innerHTML=`<div class="content-area">
    <div class="panel log-panel ran-log-panel" id="ran-panel-main">
      <div class="panel-hdr">
        <div style="display:flex;align-items:center">

      </div>

      ${wfHTML(["done","active","pending","pending","pending"])}
    </div>
  </div>`;

  try{
    const r=await fetch("/api/deploy",{method:"POST",headers:{"Content-Type":"application/json"},body:JSON.stringify({ran:key})});
    const d=await r.json();
    if(d.status==="success"){
      btn.className="deploy-btn deployed";
      btn.textContent="✓ Deployed";
      showDeployedPanel(key,name,sub);

}

async function refreshLayer2Panel(){

  try{
    const d = await (await fetch("/api/layer2-metrics")).json();
    const fmt = (v,suffix,digits) => (v===null||v===undefined) ? "—" : v.toFixed(digits!==undefined?digits:2)+(suffix||"");
    document.getElementById("l2-bler").textContent = fmt(d.bler_dl!==null?d.bler_dl*100:null, "%", 3);
    document.getElementById("l2-latency").textContent = fmt(d.control_plane_latency_ms, "ms", 2);
    document.getElementById("l2-retx").textContent = fmt(d.harq_retx_dl, "", 0);
    document.getElementById("l2-tx").textContent = fmt(d.mac_tx_bytes ? d.mac_tx_bytes/1024 : null, " KB", 1);
    document.getElementById("l2-rx").textContent = fmt(d.mac_rx_bytes ? d.mac_rx_bytes/1024 : null, " KB", 1);
    document.getElementById("l2-reg").textContent = fmt(d.amf_registrations, "", 0);
  }catch(e){}
}

async function refreshLayer3Panel(){
  const body = document.getElementById("l3-body");
  if(!body) { clearInterval(window._l3interval); return; }
  try{
    const d = await (await fetch("/api/layer3-actions")).json();
    if(!d.actions || d.actions.length === 0){
      body.innerHTML = '<div class="loading-txt">No autonomous actions yet — SLA has stayed within threshold.</div>';
      return;
    }
    body.innerHTML = '<div class="process-list">' + d.actions.map(a => {
      const ok = a.kind === "ran_failover";
      const t = new Date(a.timestamp).toLocaleString();
      return `<div class="proc-item">
        <div class="proc-dot" style="background:${ok?'#15803c':'#dc2626'}"></div>
        <div>
          <div class="proc-name">${ok?'Failover triggered':'Failover failed'} → ${a.target_scenario}</div>
          <div class="proc-desc">${a.reason} · ${t}</div>
        </div>
        <div class="proc-badge pbg-run">${ok ? (a.dashboard_response?.status||'') : 'error'}</div>
      </div>`;
    }).join("") + '</div>';
  }catch(e){}
}

function docShow(i){
  if(!_docSlides.length) return;
  _docIdx = Math.max(0, Math.min(_docSlides.length - 1, i));
  const img = document.getElementById("docImg");
  if(img) img.src = _docSlides[_docIdx];
  const c = document.getElementById("docCounter");
  if(c) c.textContent = String(_docIdx + 1).padStart(2,"0") + " / " + _docSlides.length;
  document.querySelectorAll("#docStrip img").forEach((t, n)=>{
    t.style.borderColor = n === _docIdx ? "#00d4ff" : "#1e2a45";
    t.style.opacity = n === _docIdx ? "1" : "0.5";
    if(n === _docIdx && _docStrip) t.scrollIntoView({block:"nearest", inline:"center", behavior:"smooth"});
  });
}
function docGo(d){ docShow(_docIdx + d); }

function docToggleStrip(){
  _docStrip = !_docStrip;
  const s = document.getElementById("docStrip");
  const caret = document.getElementById("docStripCaret");
  if(s) s.style.display = _docStrip ? "flex" : "none";
  if(caret) caret.innerHTML = _docStrip ? "&#9660;" : "&#9650;";
  if(_docStrip) docShow(_docIdx);
}

function docKeys(e){
  if(!document.getElementById("docImg")) { document.onkeydown = null; return; }
  if(e.key === "ArrowRight" || e.key === " ") { e.preventDefault(); docGo(1); }
  if(e.key === "ArrowLeft")  { e.preventDefault(); docGo(-1); }
  if(e.key === "Home") docShow(0);
  if(e.key === "End")  docShow(_docSlides.length - 1);
  if(e.key === "Escape") docClose();
}

function docRenderStrip(){
  const strip = document.getElementById("docStrip");
  if(!strip) return;
  strip.innerHTML = _docSlides.map((s, n) =>
    `<img src="${s}" onclick="docShow(${n})" loading="lazy"
      style="height:42px;flex:0 0 auto;border:1.5px solid #1e2a45;border-radius:3px;
             cursor:pointer;opacity:.5;transition:opacity .15s,border-color .15s">`
  ).join("");
}

function docFullscreen(){
  const el = document.getElementById("docwrap");
  if(!el) return;
  if(document.fullscreenElement) document.exitFullscreen();
  else if(el.requestFullscreen) el.requestFullscreen();
}

async function loadOsmStatus(){
  const el = document.getElementById("osm-status");
  if(!el) return;
  try{
    const r = await fetch("/api/osm/status");
    const d = await r.json();
    if(d.error){ el.innerHTML = `<span style="color:#ff6b6b">status error: ${d.error}</span>`; return; }
    const allPods = d.pods.total > 0 && d.pods.ready === d.pods.total;

      `<span style="color:${f.ready ? "#3ddc84" : "#ff6b6b"}">${f.kind==="GitRepository"?"git":"sync"} ${f.ready?"\u2713":"\u2717"}</span>`

      `<span style="color:${podCol}">pods ${d.pods.ready}/${d.pods.total}</span>` +

  }catch(e){
    el.innerHTML = `<span style="color:#ff6b6b">status unavailable</span>`;

}

async function deployCombo(){
  if(!selectedArch)return;
  if(selectedArch.additive){
    // additive scenarios add to whatever RAN is running - no replacement prompt
    runDeployCombo(selectedArch.key, selectedArch.label,
                   "Edge breakout scenario - coexists with the active RAN");
    return;
  }
  if(!selectedStack)return;
  const comboKey=selectedArch.key+"-"+selectedStack.key;
  const name=selectedStack.label+" on "+selectedArch.label;
  const sub=selectedArch.label+" architecture using "+selectedStack.label+" software";

  if(lastDeployedCombo!==null && lastDeployedCombo===comboKey){
    showInfoModal(name+" is already deployed and running.");
    return;
  }
  if(lastDeployedCombo!==null && lastDeployedCombo!==comboKey){
    showConfirmModal(name, ()=>runDeployCombo(comboKey,name,sub));
    return;
  }
  runDeployCombo(comboKey,name,sub);
}

async function runDeployCombo(comboKey,name,sub){
  const badge=document.getElementById("clean-badge");
  badge.textContent="\u23f3 Switching...";
  badge.style.background="#2a1a0a";
  badge.style.color="#ffaa00";
  badge.style.border="1px solid #ffaa0044";
  clearTop();

  const btn=document.getElementById("combo-deploy-btn");
  btn.className="deploy-btn deploying";
  btn.textContent="\u23f3 Deploying...";

  const m=document.getElementById("main");
  m.innerHTML=`<div class="content-area">
    <div class="panel" id="ran-panel-main">
      <div class="panel-hdr">
        <div style="display:flex;align-items:center">
          <div><div class="panel-title">${name}</div><div class="panel-sub">${sub}</div></div>
          <div class="panel-status warn"><div class="spinner"></div>Deploying to Kubernetes...</div>
        </div>
        <button class="close-btn" onclick="blank()">\u2715</button>
      </div>
      <div class="deploying-bar"><div class="spinner"></div><span>Pushing to GitHub and running helm install...</span></div>
      ${wfHTML(["done","active","pending","pending","pending"])}
    </div>
  </div>`;

  try{
    const r=await fetch("/api/deploy",{method:"POST",headers:{"Content-Type":"application/json"},body:JSON.stringify({ran:comboKey,arch:selectedArch.key,stack:selectedStack.key})});
    const d=await r.json();
    if(d.status==="success"){
      btn.className="deploy-btn deployed";
      btn.textContent="\u2713 Deployed";
      lastDeployedCombo=comboKey;
      verifyClean();
      showComboDeployedPanel(comboKey,name,sub,selectedStack.key);
    }else{
      btn.className="deploy-btn";
      btn.textContent="\u25b6 Deploy";
      alert("Deploy failed: "+(d.error||"Not yet implemented for this combination"));
      blank();
    }
  }catch(e){
    btn.className="deploy-btn";
    btn.textContent="\u25b6 Deploy";
    blank();
  }
}

    <div class="panel">
      <div class="panel-hdr">
        <div style="display:flex;align-items:center">
          <div><div class="panel-title">${name}</div><div class="panel-sub">${sub}</div></div>
          <div class="panel-status ok"><span class="pulse"></span>Running on Kubernetes</div>
        </div>
        <button class="close-btn" onclick="blank()">\u2715</button>

      ${tabsHTML(podLabel,stackKey,"")}

    }
  }catch(e){}
  document.getElementById("lb-updated").textContent = "updated " + new Date().toLocaleTimeString();
}
refreshLiveBar();
setInterval(refreshLiveBar, 10000);
</script>

const COMBO_DISPLAY = {

  "cran-oai":        ["cran",     "C-RAN + OAI",        "Centralized monolithic gNB (OAI)"],

  "oran-oai":        ["oran",     "O-RAN + OAI",        "CU/DU split over F1 (OAI)"],
  "cloudran-srsran": ["cloudran", "Cloud-RAN + srsRAN", "Cloud-native elastic gNB (srsRAN)"],
  "cloudran-oai":    ["cloudran", "Cloud-RAN + OAI",    "Cloud-native elastic gNB (OAI)"],
  "hcran-srsran":    ["hcran",    "H-CRAN + srsRAN",    "Heterogeneous macro + small cell (srsRAN)"],
  "hcran-oai":       ["hcran",    "H-CRAN + OAI",       "Heterogeneous macro + small cell (OAI)"],

  "fran":            ["fran",     "F-RAN",              "Fog RAN edge/MEC breakout"]
};
async function restoreDeployedState(){
  try{
    const r = await fetch("/api/verify-clean");
    const d = await r.json();
    if(d.active_combos && d.active_combos.length === 1){
      const combo = d.active_combos[0];
      const disp = COMBO_DISPLAY[combo];
      if(disp && typeof showDeployedPanel === "function"){
        lastDeployedCombo = combo;  // arm the already-deployed guard
        showDeployedPanel(disp[0], disp[1], disp[2]);
      }
    }
  }catch(e){ console.log("state restore failed", e); }
}
window.addEventListener("load", restoreDeployedState);
</script>


<script>
(function(){
  const KEY="novathinktech-dashboard-theme";
  function applyTheme(theme){
    const dark=theme==="dark";
    document.body.classList.toggle("theme-dark",dark);
    document.documentElement.style.colorScheme=dark?"dark":"light";
    const icon=document.getElementById("theme-icon");
    const label=document.getElementById("theme-label");
    if(icon) icon.textContent=dark?"☀":"☾";
    if(label) label.textContent=dark?"Light":"Dark";
    const btn=document.getElementById("theme-toggle");
    if(btn){btn.setAttribute("aria-label",dark?"Switch to light theme":"Switch to dark theme");btn.title=dark?"Switch to light theme":"Switch to dark theme";}
    try{localStorage.setItem(KEY,theme)}catch(e){}
  }
  window.toggleTheme=function(){
    applyTheme(document.body.classList.contains("theme-dark")?"light":"dark");
  };
  let saved="light";
  try{saved=localStorage.getItem(KEY)||"light"}catch(e){}
  if(saved!=="dark") saved="light";
  if(document.readyState==="loading") document.addEventListener("DOMContentLoaded",()=>applyTheme(saved));
  else applyTheme(saved);
})();
</script>
